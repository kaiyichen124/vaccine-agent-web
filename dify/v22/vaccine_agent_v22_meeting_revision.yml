            ,\"status\":\"ONGOING|ENDED|UNKNOWN\",\"dose\":null,\"route\":null,\"\
            route_class\":\"SYSTEMIC|INHALED|TOPICAL|INTRANASAL|OTHER|UNKNOWN\",\"\
            intensity\":\"HIGH|STANDARD|LOW|UNKNOWN\",\"start_date\":null,\"end_date\"\
