            \n输出结构：\n{\n  \"demographics\":{\"age_months\":null,\"age_precision\"\
            :\"DAY|MONTH|YEAR|APPROXIMATE|UNKNOWN\",\"sex\":\"MALE|FEMALE|UNKNOWN\"\
            ,\"assessment_date\":null,\"source_spans\":[]},\n  \"clinical_summary\"\
            :\"\",\n  \"acute_status\":\"ACTIVE|RECOVERED|ABSENT|UNKNOWN\",\n  \"\
            clinical_facts\":{\"current_stability\":\"STABLE|ACTIVE|RECOVERED|UNKNOWN\"\
            ,\"immune_status\":\"NORMAL|ABNORMAL|UNKNOWN\",\"immune_reconstitution_status\"\
            :\"CONFIRMED|INCOMPLETE|UNKNOWN\",\"current_immunosuppression_status\"\
            :\"PRESENT|ABSENT|UNKNOWN\",\"gvhd_status\":\"PRESENT|ABSENT|UNKNOWN\"\
            ,\"infection_control_status\":\"CONTROLLED|ACTIVE|UNKNOWN\",\"organ_function_stability\"\
