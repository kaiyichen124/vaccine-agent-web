            "code": "import json\nimport re\n\n\nVACCINE_TERMS = {\n    \"hep_b\": r\"乙肝|乙型肝炎|HepB\",\n    \"bcg\": r\"卡介苗|BCG\",\n    \"polio\": r\"脊灰|脊髓灰质炎|IPV|OPV\",\n    \"dtap\": r\"百白破|白破|DTaP|DT\",\n    \"mmr\": r\"麻腮风|麻疹|风疹|腮腺炎|MMR\",\n    \"je\": r\"乙脑|乙型脑炎\",\n    \"meningococcal\": r\"流脑|脑膜炎球菌\",\n    \"hep_a\": r\"甲肝|甲型肝炎|HepA\",\n    \"flu\": r\"流感疫苗\",\n    \"varicella\": r\"水痘疫苗\",\n    \"pcv_ppsv\": r\"肺炎球菌|PCV|PPSV\",\n    \"hib\": r\"Hib|流感嗜血杆菌\",\n    \"rotavirus\": r\"轮状病毒\",\n    \"hpv\": r\"HPV|人乳头瘤病毒\",\n}\n\n\ndef _loads(value, default):\n    if isinstance(value, (list, dict)):\n        return value\n    try:\n        return json.loads((value or \"\").strip())\n    except (TypeError, ValueError):\n        return default\n\n\ndef _first(mapping, *keys):\n    for key in keys:\n        value = mapping.get(key)\n        if value not in (None, \"\", []):\n            return value\n    return None\n\n\ndef _number(value):\n    return value if isinstance(value, (int, float)) else None\n\n\ndef _record_score(item):\n    \"\"\"Prefer reranker score, while keeping a stable order when Dify omits scores.\"\"\"\n    values = [item.get(\"score\"), item.get(\"vector_score\"), item.get(\"keyword_score\")]\n    return max((value for value in values if isinstance(value, (int, float))), default=-1.0)\n\n\ndef _vaccines(text):\n    return [vaccine_id for vaccine_id, pattern in VACCINE_TERMS.items() if re.search(pattern, text or \"\", re.I)]\n\n\ndef _compact(text):\n    return re.sub(r\"[^0-9A-Za-z\\u4e00-\\u9fff]+\", \"\", text or \"\").lower()\n\n\ndef _matched_evidence_ids(text, catalog):\n    compact_text = _compact(text)\n    matched = []\n    for evidence_id, title in catalog.items():\n        compact_id = _compact(evidence_id)\n        compact_title = _compact(title)\n        title_tail = _compact(re.split(r\"[：:]\", title or \"\")[-1])\n        if compact_id in compact_text or compact_title in compact_text or (len(title_tail) >= 6 and title_tail in compact_text):\n            matched.append(evidence_id)\n    return matched\n\n\ndef main(retrieval_result, routing_json: str = \"\") -> dict:\n    raw = _loads(retrieval_result, [])\n    routing = _loads(routing_json, {})\n    if isinstance(raw, dict):\n        raw = raw.get(\"result\") or raw.get(\"records\") or raw.get(\"data\") or []\n    records = raw if isinstance(raw, list) else []\n    maximum = min(8, max(1, int(routing.get(\"requested_top_k\") or 8)))\n    catalog = routing.get(\"evidence_catalog\") if isinstance(routing.get(\"evidence_catalog\"), dict) else {}\n    evidence_topics = {}\n    for route in routing.get(\"topic_routes\", []):\n        if not isinstance(route, dict):\n            continue\n        for evidence_id in route.get(\"evidence_ids\", []):\n            evidence_topics.setdefault(evidence_id, []).append(route.get(\"topic_id\"))\n    required_topics = list(dict.fromkeys(\n        route.get(\"topic_id\") for route in routing.get(\"topic_routes\", [])\n        if isinstance(route, dict) and route.get(\"topic_id\")\n    ))\n    allowed_ids = set(catalog)\n    seen = set()\n    audited = []\n\n    for index, record in enumerate(records):\n        item = record if isinstance(record, dict) else {\"content\": str(record)}\n        metadata = item.get(\"metadata\") if isinstance(item.get(\"metadata\"), dict) else {}\n        content = str(_first(item, \"content\", \"text\", \"page_content\") or \"\")\n        filename = str(_first(item, \"title\", \"document_name\", \"name\") or _first(metadata, \"document_name\", \"file_name\", \"filename\", \"title\") or \"\")\n        section = str(_first(item, \"section\", \"segment_name\") or _first(metadata, \"section\", \"segment_name\", \"heading\") or \"\")\n        combined = filename + \"\\n\" + section + \"\\n\" + content\n        matched_ids = _matched_evidence_ids(combined, catalog)\n        matched_topics = list(dict.fromkeys(topic for evidence_id in matched_ids for topic in evidence_topics.get(evidence_id, []) if topic))\n        fingerprint = re.sub(r\"\\s+\", \"\", filename + \"|\" + section + \"|\" + content[:300])\n        duplicate = fingerprint in seen\n        if not duplicate:\n            seen.add(fingerprint)\n        is_national = bool(re.search(r\"国家免疫规划|免疫程序及说明|CN_NIP\", combined, re.I))\n        score = _number(_first(item, \"score\", \"relevance_score\") or _first(metadata, \"score\", \"relevance_score\"))\n        vector_score = _number(_first(item, \"vector_score\", \"dense_score\") or _first(metadata, \"vector_score\", \"dense_score\"))\n        keyword_score = _number(_first(item, \"keyword_score\", \"lexical_score\", \"bm25_score\") or _first(metadata, \"keyword_score\", \"lexical_score\", \"bm25_score\"))\n        chunk_id = str(_first(item, \"segment_id\", \"chunk_id\", \"id\") or _first(metadata, \"segment_id\", \"chunk_id\") or \"\") or None\n        document_id = str(_first(item, \"document_id\", \"doc_id\") or _first(metadata, \"document_id\", \"doc_id\") or \"\") or None\n        location = str(_first(item, \"page\", \"page_number\", \"position\") or _first(metadata, \"page\", \"page_number\", \"position\") or section or \"\") or None\n        audited.append({\n            \"rank\": index + 1,\n            \"file_name\": filename or None,\n            \"section\": section or None,\n            \"original_text\": content,\n            \"score\": score,\n            \"vector_score\": vector_score,\n            \"keyword_score\": keyword_score,\n            \"adopted\": False,\n            \"selection_rank\": None,\n            \"rejection_reason\": None,\n            \"supported_vaccines\": _vaccines(combined),\n            \"matched_evidence_ids\": [value for value in matched_ids if value in allowed_ids],\n            \"matched_topics\": matched_topics,\n            \"duplicate\": duplicate,\n            \"chunk_id\": chunk_id,\n            \"document_id\": document_id,\n            \"location\": location,\n            \"source_version\": _first(metadata, \"source_version\", \"version\", \"source_year\", \"year\"),\n        })\n\n    # Eligibility is decided before budgeting. Unmatched and duplicate records can\n    # never consume a slot. This prevents a high-ranked unrelated result from\n    # evicting a later result that covers a required clinical topic.\n    candidates = [item for item in audited if not item[\"duplicate\"] and item[\"matched_evidence_ids\"]]\n    candidates.sort(key=lambda item: (-len(item[\"matched_topics\"]), -_record_score(item), item[\"rank\"]))\n    selected = []\n    selected_ranks = set()\n    topic_counts = {topic: 0 for topic in required_topics}\n    national_count = 0\n\n    def adopt(item):\n        nonlocal national_count\n        if len(selected) >= maximum or item[\"rank\"] in selected_ranks:\n            return False\n        if any(evidence_id == \"CN_NIP_2026\" for evidence_id in item[\"matched_evidence_ids\"]) and national_count >= 2 and not item[\"matched_topics\"]:\n            return False\n        selected.append(item)\n        selected_ranks.add(item[\"rank\"])\n        if any(evidence_id == \"CN_NIP_2026\" for evidence_id in item[\"matched_evidence_ids\"]):\n            national_count += 1\n        for topic in item[\"matched_topics\"]:\n            topic_counts[topic] = topic_counts.get(topic, 0) + 1\n        return True\n\n    # First guarantee one result per required topic, choosing records that cover\n    # the most still-uncovered topics and then the best available score.\n    while len(selected) < maximum:\n        uncovered = {topic for topic in required_topics if topic_counts.get(topic, 0) == 0}\n        if not uncovered:\n            break\n        choices = [item for item in candidates if item[\"rank\"] not in selected_ranks and uncovered.intersection(item[\"matched_topics\"])]\n        if not choices:\n            break\n        choices.sort(key=lambda item: (-len(uncovered.intersection(item[\"matched_topics\"])), -_record_score(item), item[\"rank\"]))\n        adopt(choices[0])\n\n    # Then allow a second supporting chunk per topic, followed by other allowed\n    # evidence (including the national programme) until the context budget is full.\n    for target_count in (2,):\n        for topic in required_topics:\n            if len(selected) >= maximum:\n                break\n            choices = [item for item in candidates if item[\"rank\"] not in selected_ranks and topic in item[\"matched_topics\"]]\n            choices.sort(key=lambda item: (-_record_score(item), item[\"rank\"]))\n            while topic_counts.get(topic, 0) < target_count and choices and len(selected) < maximum:\n                adopt(choices.pop(0))\n    for item in sorted(candidates, key=lambda value: (-_record_score(value), value[\"rank\"])):\n        if len(selected) >= maximum:\n            break\n        adopt(item)\n\n    for selection_rank, item in enumerate(selected, 1):\n        item[\"adopted\"] = True\n        item[\"selection_rank\"] = selection_rank\n    for item in audited:\n        if item[\"adopted\"]:\n            continue\n        if item[\"duplicate\"]:\n            item[\"rejection_reason\"] = \"DUPLICATE\"\n        elif not item[\"matched_evidence_ids\"]:\n            item[\"rejection_reason\"] = \"OUTSIDE_EVIDENCE_ALLOWLIST\"\n        else:\n            item[\"rejection_reason\"] = \"CONTEXT_BUDGET_OR_TOPIC_CAP\"\n\n    adopted = [item for item in audited if item[\"adopted\"]]\n    special_required = bool(routing.get(\"special_evidence_required\"))\n    covered_topics = [topic for topic in required_topics if topic_counts.get(topic, 0) > 0]\n    missing_topics = [topic for topic in required_topics if topic_counts.get(topic, 0) == 0]\n    insufficient = special_required and (bool(missing_topics) or not required_topics)\n    status = \"SPECIAL_EVIDENCE_INSUFFICIENT\" if insufficient else \"OK\"\n    audit = {\n        \"status\": status,\n        \"requested_top_k\": maximum,\n        \"returned_count\": len(audited),\n        \"adopted_count\": len(adopted),\n        \"special_evidence_required\": special_required,\n        \"special_evidence_found\": special_required and not missing_topics and bool(required_topics),\n        \"required_topics\": required_topics,\n        \"covered_topics\": covered_topics,\n        \"missing_topics\": missing_topics,\n        \"topic_counts\": topic_counts,\n        \"score_note\": \"分项分数仅记录Dify实际返回值；未返回时为null。\",\n        \"routing\": routing,\n        \"records\": audited,\n    }\n    review_payload = {\n        \"status\": status,\n        \"warning\": (\"专题证据不足，缺少：\" + \"、\".join(missing_topics or [\"未建立专题路由\"]) + \"。\") if insufficient else \"\",\n        \"required_topics\": required_topics,\n        \"covered_topics\": covered_topics,\n        \"missing_topics\": missing_topics,\n        \"selection_policy\": routing.get(\"selection_policy\", {}),\n        \"adopted_evidence\": adopted,\n    }\n    return {\n        \"evidence_context\": json.dumps(review_payload, ensure_ascii=False, separators=(\",\", \":\")),\n        \"retrieval_audit_json\": json.dumps(audit, ensure_ascii=False, separators=(\",\", \":\")),\n        \"special_evidence_status\": status,\n    }\n",
