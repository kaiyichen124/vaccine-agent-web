t, r\"心功能不全|心力衰竭|严重肺动脉高压|反复住院手术|近期心脏手术\")\n    chd_stable = (stable or bool(re.search(r\"心功能正常|无临床症状|先心病.{0,10}稳定|术后.{0,10}心功能无异常\", text))) and not chd_high_risk\n    preterm_vlbw = \"PRETERM\" in categories\n    respiratory_history = bool(re.search(r\"ARDS|急性呼吸窘迫|支气管肺发育不良\", text, re.I))\n    kawasaki = bool(re.search(r\"川崎病|Kawasaki\", text, re.I))\n    ivig_information_known = bool(re.search(r\"(?:IVIG|静脉注射免疫球蛋白|丙种球蛋白).{0,16}(?:使用|输注|未用|无|日期|剂量|停用|20\\d{2})\", text, re.I))\n    kawasaki_ivig_pending = kawasaki and not ivig_information_known\n    temporal_source = \"\\n\".join(filter(None, [diagnosis_text, treatment_model.get(\"raw_text\", \"\")]))\n    current_cardiorespiratory_issue = bool(re.search(r\"目前|当前|仍有|持续|未恢复|住院|氧疗|呼吸支持|心功能不全|肺动脉高压\", temporal_source))\n    if not (preterm_vlbw or respiratory_history):\n        preterm_temporal_status = \"NOT_PRESENT\"\n    elif stable or explicit_no_acute:\n        preterm_temporal_status = \"RESOLVED\"\n    elif current_cardiorespiratory_issue:\n        preterm_temporal_status = \"CURRENT\"\n    elif age_months is not None and age_months >= 24:\n        preterm_temporal_status = \"HISTORICAL\"\n    else:\n        preterm_temporal_status = \"UNKNOWN\"\n    preterm_requires_modifier = preterm_temporal_status in {\"CURRENT\", \"UNKNOWN\"}\n    severe_vaccine_allergy = any(\n        fact.get(\"subject\") == \"CHILD\" and fact.get(\"polarity\") == \"PRESENT\"\n        and fact.get(\"fact_type\") in {\"VACCINE_ALLERGY\", \"VACCINE_REACTION\"}\n        and re.search(r\"呼吸困难|全身荨麻疹|过敏性休克|肾上腺素|喉头水肿\", fact.get(\"source_span\", \"\"))\n        for fact in allergy_facts\n    )\n    antibody_product_relevant = any(_antibody_product_relevant(item) for item in treatment_model[\"items\"])\n    targeted = (epilepsy and seizure_status != \"CONTROLLED\") or (chd and not chd_stable) or preterm_requires_modifier or antibody_product_relevant or kawasaki_ivig_pending or acute_episode in {\"POSSIBLE_ACTIVE\", \"UNKNOWN\"} or clinical_flags[\"planned_splenectomy\"] or clinical_flags[\"asplenia\"] or clinical_flags[\"cochlear_implant\"] or clinical_flags[\"csf_leak\"] or clinical_flags[\"dialysis\"] or severe_vaccine_allergy\n    if patient_path in {\"ROUTINE\", \"RISK_INFORMATION_PENDING\"} and targeted:\n        patient_path = \"TARGETED_MODIFIER\"\n        risk_disposition = \"ACUTE_STATUS_PENDING\" if acute_episode in {\"POSSIBLE_ACTIVE\", \"UNKNOWN\"} else \"TARGETED_RISK\"\n\n    return {\n        \"diagnoses\": diagnoses, \"diagnosis_information_state\": diagnosis_meta[\"information_state\"],\n        \"clinical_facts\": diagnosis_meta.get(\"clinical_facts\", []),\n        \"special_health_categories\": list(dict.fromkeys(categories)),\n        \"risk_domains\": list(dict.fromkeys(risk_domains)), \"unmapped_diagnoses\": diagnosis_meta[\"unmapped_diagnoses\"],\n        \"knowledge_coverage\": \"UNCOVERED\" if uncovered else \"DOMAIN_GENERIC\" if any(item[\"knowledge_coverage\"] == \"DOMAIN_GENERIC\" for item in diagnoses) else \"EXACT_26_CATEGORY\" if diagnoses else \"NO_SPECIAL_DIAGNOSIS\",\n        \"semantic_extraction\": semantic,\n        \"semantic_field_warnings\": semantic.get(\"field_warnings\", []),\n        \"treatment_information_state\": treatment_model[\"information_state\"], \"treatments\": treatment_model[\"items\"],\n        \"immune_results\": immune_results, \"allergy_facts\": allergy_facts,\n        \"disease_activity\": activity, \"acute_status\": acute_status, \"acute_episode\": acute_episode,\n        \"risk_disposition\": risk_disposition, \"patient_path\": patient_path,\n        \"underlying_risk\": \"HIGH_RISK_ACTIVE\" if hsct or solid_organ_transplant or ongoing_high_risk_treatment or active_immune_risk else \"HIGH_RISK_INFORMATION_PENDING\" if high_risk_diagnosis else \"RISK_INFORMATION_PENDING\" if uncovered else None,\n        \"patient_gate\": patient_path, \"stable\": stable, \"intensive_treatment\": ongoing_high_risk_treatment,\n        \"immune_risk\": high_risk_diagnosis or hsct or solid_organ_transplant or ongoing_high_risk_treatment,\n        \"immune_risk_level\": immune_risk_level,\n        \"hsct\": hsct, \"hsct_type\": hsct_type, \"solid_organ_transplant\": solid_organ_transplant,\n        \"ivig\": any(item[\"type\"] == \"IVIG\" and _antibody_product_relevant(item) for item in treatment_model[\"items\"]), \"blood_product\": any(item[\"type\"] == \"BLOOD_PRODUCT\" and _antibody_product_relevant(item) for item in treatment_model[\"items\"]), \"leukemia\": leukemia, \"autoimmune\": autoimmune,\n        \"malignancy\": malignancy, \"solid_malignancy\": solid_malignancy, \"infectious\": infectious,\n        \"epilepsy\": epilepsy, \"seizure_status\": seizure_status,\n        \"developmental_delay\": bool(re.search(r\"发育迟缓|发育落后\", text)),\n        \"chd\": chd, \"chd_uncertain\": chd_uncertain, \"chd_high_risk\": chd_high_risk, \"chd_stable\": chd_stable,\n        \"preterm_vlbw\": preterm_vlbw, \"respiratory_history\": respiratory_history,\n        \"preterm_temporal_status\": preterm_temporal_status,\n        \"kawasaki\": kawasaki, \"kawasaki_ivig_pending\": kawasaki_ivig_pending,\n        \"clinical_flags\": clinical_flags,\n        \"severe_vaccine_allergy\": severe_vaccine_allergy,\n        \"planned_splenectomy\": clinical_flags[\"planned_splenectomy\"], \"asplenia\": clinical_flags[\"asplenia\"],\n        \"diagnosis\": diagnosis_text, \"treatment\": treatment_model[\"raw_text\"],\n    }\n\n\ndef _item(series, state, reason_code, reason, dose=None, priority=90):\n    standard_status = {\n        \"NOW_DUE\": \"常规接种\", \"CATCHUP_DUE\": \"常规补种\",\n        \"TEMPORARILY_DEFERRED\": \"暂缓接种\", \"MEDICAL_REVIEW\": \"需进一步评估\",\n        \"RECORDS_NEEDED\": \"需进一步评估\", \"PRODUCT_NEEDED\": \"需进一步评估\",\n        \"HEALTH_STATUS_NEEDED\": \"需进一步评估\",\n    }.get(state)\n    section_map = {\n        \"polio\": (\"第二部分 三、脊髓灰质炎疫苗\", \"PDF第8-9页\"),\n        \"dtap\": (\"第二部分 四、百白破疫苗、白破疫苗\", \"PDF第9-10页\"),\n        \"bcg\": (\"第二部分 二、卡介苗\", \"PDF第7-8页\"),\n        \"hpv_nip\": (\"第二部分 十一、双价HPV疫苗\", \"PDF第15页\"),\n    }\n    section, location = section_map.get(series[\"id\"], (\"国家免疫规划疫苗程序及相应疫苗使用说明\", \"按疫苗章节\"))\n    return {\n        \"vaccine_id\": series[\"id\"],\n        \"vaccine\": series[\"name\"],\n        \"display_name\": series[\"name\"],\n        \"category\": \"国家免疫规划\",\n        \"decision_state\": state,\n        \"final_state\": STATE_LABELS[state],\n        \"reason_code\": reason_code,\n        \"reason\": reason,\n        \"caregiver_advice\": reason,\n        \"standard_recommendation_status\": standard_status,\n        \"dose\": dose,\n        \"priority\": priority,\n        \"implementation_options\": [],\n        \"medical_rule_ids\": [],\n        \"evidence_ids\": [\"CN_NIP_2026\"],\n        \"evidence_trace\": [{\"evidence_id\": \"CN_NIP_2026\", \"section\": section, \"location\": location, \"rule\": reason_code}],\n    }\n\n\ndef _age_gate(series, months, sex):\n    if months is None:\n        return \"AGE_UNKNOWN\"\n    if series.get(\"sex\") and series[\"sex\"] not in (sex or \"\"):\n        return \"POPULATION_NOT_APPLICABLE\"\n    if series.get(\"min_age\") is not None and months < series[\"min_age\"]:\n        return \"NOT_YET_DUE\"\n    if series.get(\"schedule\") and months < series[\"schedule\"][0]:\n        return \"NOT_YET_DUE\"\n    if series.get(\"catchup_max\") is not None and months > series[\"catchup_max\"]:\n        return \"CATCHUP_WINDOW_CLOSED\"\n    return \"ELIGIBLE\"\n\n\ndef _program_key(series, fact):\n    if series[\"id\"] in {\"je\", \"hep_a\"}:\n        candidates = [p for p in fact.get(\"products\", []) if p.startswith(series[\"id\"] + \"_\") and p in PROGRAM_INTERVALS]\n        return candidates[0] if len(set(candidates)) == 1 else series[\"id\"]\n    return series[\"id\"]\n\n\ndef _effective_schedule(series, fact):\n    products = set(fact.get(\"products\", []))\n    if series[\"id\"] == \"polio\" and products and products.issubset({\"ipv\", \"five_in_one\", \"six_in_one\"}):\n        return [2, 3, 4, 18]\n    if series[\"id\"] == \"je\":\n        if \"je_live\" in products:\n            return [8, 24]\n        if \"je_inactivated\" in products:\n            return [8, 8, 24, 72]\n    if series[\"id\"] == \"hep_a\":\n        if \"hep_a_live\" in products:\n            return [18]\n        if \"hep_a_inactivated\" in products:\n            return [18, 24]\n    return series.get(\"schedule\") or []\n\n\ndef _calculate_program(series, fact, mode, months, sex):\n    item = _calculate_program_core(series, fact, mode, months, sex)\n    schedule = _effective_schedule(series, fact)\n    program = _program_key(series, fact)\n    full_ipv = series[\"id\"] == \"polio\" and schedule == [2, 3, 4, 18]\n    meta = item.setdefault(\"program_calculation\", {})\n    meta.setdefault(\"program_id\", \"POLIO_FULL_IPV_CONTINUATION\" if full_ipv else \"POLIO_NIP_SEQUENTIAL\" if series[\"id\"] == \"polio\" else program)\n    meta.setdefault(\"schedule_months\", schedule)\n    if item.get(\"dose\") and schedule:\n        meta.setdefault(\"age_due_months\", schedule[min(item[\"dose\"]-1,len(schedule)-1)])\n    meta[\"known_products\"] = fact.get(\"products\", [])\n    meta[\"selection_basis\"] = \"按已记录的全IPV/含IPV联合疫苗方案继续计算；转换方案需重新计算\" if full_ipv else \"国家程序及已知产品记录\"\n    meta[\"reference_date\"] = _today().isoformat()\n    meta[\"source_id\"] = \"CN_NIP_2026\"\n    if full_ipv:\n        meta[\"program_source_url\"] = \"https://www.chinacdc.cn/jkyj/mygh02/ymkyfjb/jshzy/202606/t20260618_1837073.html\"\n        item[\"reason\"] += \" 当前按既往全IPV/含IPV联合疫苗方案继续计算，第4剂程序年龄为18月龄；切换方案时需重新核算。\"\n        item[\"caregiver_advice\"] = item[\"reason\"]\n    return item\n\n\ndef _calculate_program_core(series, fact, mode, months, sex):\n    gate = _age_gate(series, months, sex)\n    if gate == \"AGE_UNKNOWN\":\n        return _item(series, \"HEALTH_STATUS_NEEDED\", \"AGE_MISSING\", \"年龄或出生日期不足，无法判断当前程序。\", priority=25)\n    schedule = _effective_schedule(series, fact)\n    if mode == \"COMPLETE\" and fact.get(\"kind\") in {\"UNMENTIONED\", \"UNKNOWN\"}:\n        fact = {**fact, \"kind\": \"EXPLICIT_MISSING\", \"doses\": 0, \"missing\": 1, \"dates\": [], \"date_status\": \"COMPLETE_ABSENCE\"}\n    completed_count = fact.get(\"doses\") or 0\n    mixed_formulations = (\n        {\"je_live\", \"je_inactivated\"}.issubset(fact.get(\"products\", [])) if series[\"id\"] == \"je\"\n        else {\"hep_a_live\", \"hep_a_inactivated\"}.issubset(fact.get(\"products\", [])) if series[\"id\"] == \"hep_a\"\n        else False\n    )\n    history_completed = not mixed_formulations and (\n        fact[\"kind\"] == \"COMPLETE\"\n        or (mode == \"NIP_COMPLETE\" and fact[\"kind\"] == \"UNMENTIONED\")\n        or bool(len(schedule) == 1 and fact[\"kind\"] == \"COUNTED\" and completed_count >= 1)\n    )\n    # 明确完成是接种史事实，后续年龄或健康状态不能把它改写成“暂缓/评估”。\n    if history_completed:\n        return _item(series, \"COMPLETED\", \"DOSE_COUNT_COMPLETE\" if completed_count else \"RECORD_COMPLETE\", \"记录明确已完成相应程序。\")\n    if gate == \"POPULATION_NOT_APPLICABLE\":\n        return _item(series, gate, \"POPULATION\", \"该国家免疫规划项目不适用于当前性别人群。\")\n    if gate == \"CATCHUP_WINDOW_CLOSED\":\n        return _item(series, gate, \"AGE_LIMIT\", \"已超过该疫苗的国家程序补种年龄范围。\")\n    if gate == \"NOT_YET_DUE\":\n        return _item(series, gate, \"AGE_NOT_DUE\", \"尚未达到该项目的起始接种年龄。\")\n    if mixed_formulations:\n        return _item(series, \"MEDICAL_REVIEW\", \"MIXED_FORMULATION_PROGRAM_REVIEW\", \"已记录减毒活疫苗和灭活疫苗两种剂型；需按每剂产品与日期核对衔接程序，不能将混合记录直接套用其中一种全程程序。\", priority=9)\n    # BCG is a one-dose programme with a dedicated history/catch-up state machine.\n    # It never enters the generic NEXT_DOSE wording.\n    if series[\"id\"] == \"bcg\":\n        if fact[\"kind\"] in {\"UNMENTIONED\", \"UNKNOWN\", \"ANY_DOSE\"}:\n            return _item(series, \"RECORDS_NEEDED\", \"BCG_HISTORY_REQUIRED\", \"需核对卡介苗是否已经接种；确认未接种后再按当前年龄评估补种条件。\", priority=35)\n        if fact[\"kind\"] == \"EXPLICIT_MISSING\":\n            return _item(series, \"CATCHUP_DUE\", \"BCG_CATCHUP_EVALUATION\", \"记录明确未接种，当前仍在补种评估年龄范围内；由接种门诊按卡介苗补种要求评估。\", priority=15)\n    if fact[\"kind\"] == \"OVERLAP_UNRESOLVED\":\n        milestone = \"当前已经达到6周岁百白破加强剂程序年龄；\" if series[\"id\"] == \"dtap\" and months is not None and months >= 72 else \"\"\n        return _item(\n            series, \"RECORDS_NEEDED\", \"COMPONENT_OVERLAP_DATE_REQUIRED\",\n            milestone + \"相关记录存在重复或重叠，缺少逐剂日期时无法判断它们属于独立剂次、重复描述还是联合疫苗成分。请核对每剂日期后再计算。\",\n            priority=6,\n        )\n    if fact[\"kind\"] == \"INVALID_RECORD\":\n        issue_labels = {\n            \"DUPLICATE_DOSE_DATE\": \"存在同日重复剂次\",\n            \"DOSE_DATE_REVERSED\": \"日期顺序倒置\",\n            \"MINIMUM_INTERVAL_NOT_MET_IN_HISTORY\": \"既往剂次未达到最小间隔\",\n            \"DOSE_BEFORE_BIRTH\": \"存在出生日期之前的记录\",\n            \"DOSE_AFTER_REFERENCE_DATE\": \"存在晚于本次评估日期的记录\",\n            \"INVALID_DOSE_DATE\": \"存在无法识别的日期\",\n            \"AGE_HISTORY_TIMELINE_CONFLICT\": \"接种日期与当前年龄及评估日期不相容，请确认出生日期或历史病例的评估日期\",\n            \"INTERVAL_ANCHOR_MISSING\": \"缺少验证间隔所需的前序有效剂次\",\n        }\n        codes = list(dict.fromkeys(issue.get(\"code\") for issue in fact.get(\"validation_issues\", [])))\n        details = \"、\".join(issue_labels[code] for code in codes if code in issue_labels) or \"既往剂次日期未通过有效性校验\"\n        return _item(\n            series, \"RECORDS_NEEDED\", \"HISTORY_DOSE_VALIDATION_FAILED\",\n            f\"接种记录中{details}；这些记录不能直接计为有效剂次，请核对原始接种凭证后重新计算。\",\n            priority=4,\n        )\n    if fact[\"kind\"] in {\"UNMENTIONED\", \"UNKNOWN\", \"ANY_DOSE\"}:\n        wording = \"记录只说明接种过，未说明剂次数。\" if fact[\"kind\"] == \"ANY_DOSE\" else \"现有资料不能确定既往剂次数。\"\n        return _item(series, \"RECORDS_NEEDED\", \"DOSE_HISTORY_INSUFFICIENT\", wording + \"需核对记录后再计算下一剂。\", priority=35)\n    if fact.get(\"date_status\") == \"PROGRAM_CONTEXT_REQUIRED\":\n        return _item(series, \"MEDICAL_REVIEW\", \"ADDITIONAL_PROGRAM_CONTEXT_REQUIRED\", \"记录包含常规全程之外的剂次；请确认是否属于移植后、再次免疫或其他补充程序，分清各次接种程序后再判断。\", priority=8)\n    if series[\"id\"] == \"dtap\" and months >= 84 and completed_count < len(schedule):\n        return _item(series, \"PRODUCT_NEEDED\", \"AGE_ADAPTED_DT_PROGRAM_REQUIRED\", \"已满7周岁，应根据既往百白破/白破记录转入相应年龄的补种程序；不能直接沿用婴幼儿百白破剂次。\", priority=8)\n    if series[\"id\"] == \"meningococcal\":\n        return _calculate_meningococcal(series, fact, months, mode)\n    if series.get(\"product_dependent\") and not schedule:\n        return _item(series, \"PRODUCT_NEEDED\", \"PRODUCT_PROGRAM_DEPENDENT\", \"既往产品或剂型会改变程序，需先确认具体产品和剂次数。\", priority=45)\n    completed = fact.get(\"doses\") or 0\n    # Merged component histories also need interval checks (e.g. IPV + five-in-one).\n    program = _program_key(series, fact)\n    dated = {i + 1: date.fromisoformat(day) for i, day in enumerate(sorted(fact.get(\"dates\", [])))}\n    if fact.get(\"date_status\") == \"COMPLETE\":\n        for ordinal, dose_date in dated.items():\n            requirements, missing = _interval_requirements(program, ordinal, dated)\n            if missing or any(dose_date.isoformat() < r[\"earliest_date\"] for r in requirements):\n                return _item(series, \"RECORDS_NEEDED\", \"MERGED_COMPONENT_INTERVAL_CONFLICT\", \"合并联合疫苗和单苗后，成分剂次间隔未通过校验；请核对每剂日期及所属接种程序。\", priority=4)\n    if completed >= len(schedule):\n        if len(schedule) > 1 and fact.get(\"date_status\") not in {\"COMPLETE\", \"ASSUMED_VALID_PROGRAM\"}:\n            return _item(\n                series, \"RECORDS_NEEDED\", \"PROGRAM_COMPLETION_DATES_INCOMPLETE\",\n                f\"已记录{completed}剂，剂次数达到当前程序要求；但逐剂日期不完整，程序间隔和完整性尚未完全验证。\",\n                priority=12,\n            )\n        return _item(series, \"COMPLETED\", \"DOSE_COUNT_COMPLETE\", \"记录剂次数已达到当前程序总剂次。\")\n    next_dose = fact.get(\"missing\") or completed + 1\n    index = min(max(next_dose - 1, 0), len(schedule) - 1)\n    due_month = schedule[index]\n    if months < due_month:\n        return _item(series, \"NOT_YET_DUE\", \"NEXT_DOSE_NOT_DUE\", f\"下一剂为第{next_dose}剂，尚未到程序年龄。\", next_dose)\n    if completed > 0 and fact.get(\"date_status\") not in {\"COMPLETE\", \"ASSUMED_VALID_PROGRAM\"}:\n        if series[\"id\"] == \"polio\" and any(product in {\"five_in_one\", \"six_in_one\"} for product in fact.get(\"products\", [])):\n            reason = f\"已记录{completed}剂IPV成分。需核对第{completed}剂日期，并确认继续含IPV联合疫苗/全IPV方案还是转入国家免疫规划序贯方案，再判断第{next_dose}剂时间。\"\n            return _item(series, \"PRODUCT_NEEDED\", \"POLIO_PRODUCT_PATH_AND_DATE\", reason, next_dose, 7)\n        return _item(\n            series, \"RECORDS_NEEDED\", \"LAST_DOSE_DATE_REQUIRED\",\n            f\"已达到第{next_dose}剂的年龄要求，但缺少第{completed}剂接种日期，无法验证最小间隔；核对日期且间隔满足后才能安排。\",\n            next_dose, 7,\n        )\n    requirements, missing_anchors = _interval_requirements(program, next_dose, dated)\n    if completed > 0 and missing_anchors:\n        return _item(series, \"RECORDS_NEEDED\", \"LAST_DOSE_DATE_REQUIRED\", \"已到程序年龄；请提供验证本剂最小间隔所需的前序剂次日期。\", next_dose, 7)\n    earliest_dates = [r[\"earliest_date\"] for r in requirements]\n    bounds = fact.get(\"birth_bounds\")\n    if bounds and bounds.get(\"precision\") == \"DAY\":\n        earliest_dates.append(_add_calendar_months(date.fromisoformat(bounds[\"latest\"]), due_month).isoformat())\n    earliest = max(earliest_dates) if earliest_dates else None\n    calculation = {\"earliest_date\": earliest, \"interval_requirements\": requirements, \"age_due_months\": due_month, \"interval_verified\": not missing_anchors}\n    if earliest and _today().isoformat() < earliest:\n        item = _item(series, \"NOT_YET_DUE\", \"MINIMUM_INTERVAL_NOT_MET\", f\"第{next_dose}剂最早接种日期为{earliest}，当前尚未达到年龄或最小间隔。\", next_dose)\n        item[\"program_calculation\"] = calculation\n        return item\n    state = \"NOW_DUE\" if months == due_month else \"CATCHUP_DUE\"\n    reason = f\"第{next_dose}剂当前到期。\" if state == \"NOW_DUE\" else f\"记录明确第{next_dose}剂未完成，当前应按补种规则处理这一剂。\"\n    item = _item(series, state, \"ROUTINE_DUE\" if state == \"NOW_DUE\" else \"EXPLICIT_GAP\", reason, next_dose, 10 if state == \"NOW_DUE\" else 15)\n    item[\"program_calculation\"] = calculation\n    return item\n\n\ndef _calculate_meningococcal(series, fact, months, mode=\"PARTIAL\"):\n    \"\"\"Product-stage calculation: A doses never count as AC doses.\"\"\"\n    products = set(fact.get(\"products\", []))\n    if (not products and mode != \"COMPLETE\") or (products and not products.issubset({\"mpsv_a\", \"mpsv_ac\"})):\n        return _item(series, \"PRODUCT_NEEDED\", \"MENINGOCOCCAL_PRODUCT_PROGRAM\", \"不同流脑产品的年龄和替代程序不同，请核对尚未明确的产品或联合接种方案。\", priority=12)\n    histories = fact.get(\"product_histories\", [])\n    groups = {p: [h for h in histories if h[\"product_id\"] == p] for p in products}\n    counts = {p: sum(h.get(\"doses\") or 0 for h in hs) for p, hs in groups.items()}\n    dates = {p: sorted(set(d for h in hs for d in h.get(\"dates\", []))) for p, hs in groups.items()}\n    a_count, ac_count = counts.get(\"mpsv_a\", 0), counts.get(\"mpsv_ac\", 0)\n    if 24 <= months < 36 and ac_count == 0 and \"mpsv_a\" not in products:\n        return _item(series, \"RECORDS_NEEDED\", \"MEN_A_HISTORY_FOR_AC_CATCHUP\", \"已明确A群C群流脑产品；2至3岁是否提前补种以及所需间隔，取决于既往A群剂次，请核对A群是否接种及日期。\", priority=8)\n    if months < 24:\n        if a_count >= 2:\n            return _item(series, \"NOT_YET_DUE\", \"MEN_A_STAGE_COMPLETE\", \"已记录2剂A群流脑多糖疫苗；国家程序后续为3周岁和6周岁A群C群流脑多糖疫苗。\")\n        target, n, age_due = \"mpsv_a\", a_count + 1, 6 if a_count == 0 else 9\n    else:\n        target, n = \"mpsv_ac\", ac_count + 1\n        age_due = 72 if ac_count else 36 if a_count >= 2 else 24\n        if ac_count >= 2:\n            if len(dates.get(target, [])) != ac_count:\n                return _item(series, \"RECORDS_NEEDED\", \"PROGRAM_COMPLETION_DATES_INCOMPLETE\", \"已记录2剂A群C群流脑多糖疫苗，请补齐日期以验证3年间隔。\", priority=8)\n            req, _ = _interval_requirements(target, 2, {i+1: date.fromisoformat(d) for i,d in enumerate(dates[target])})\n            if any(dates[target][1] < r[\"earliest_date\"] for r in req):\n                return _item(series, \"RECORDS_NEEDED\", \"MERGED_COMPONENT_INTERVAL_CONFLICT\", \"两剂A群C群流脑多糖疫苗日期未满足3年间隔，请核对记录。\", priority=4)\n            return _item(series, \"COMPLETED\", \"MEN_AC_COMPLETE\", \"已记录2剂A群C群流脑多糖疫苗，间隔已核对。\")\n    name = \"A群流脑多糖疫苗\" if target == \"mpsv_a\" else \"A群C群流脑多糖疫苗\"\n    calculation = {\"program_id\": target, \"age_due_months\": age_due, \"next_product_id\": target}\n    if months < age_due:\n        result = _item(series, \"NOT_YET_DUE\", \"NEXT_DOSE_NOT_DUE\", f\"后续为{name}第{n}剂，程序年龄为{age_due // 12}周岁。\", n)\n    elif target not in products and mode != \"COMPLETE\":\n        result = _item(series, \"RECORDS_NEEDED\", \"MEN_AC_HISTORY_UNMENTIONED\", f\"既往A群产品已明确；当前应核对是否接种过{name}，未提供该记录不能按0剂计算。\", priority=8)\n    else:\n        anchors = {i+1: date.fromisoformat(d) for i,d in enumerate(dates.get(target, []))}\n        req, missing = _interval_requirements(target, n, anchors)\n        if target == \"mpsv_ac\" and n == 1 and a_count:\n            if len(dates.get(\"mpsv_a\", [])) != a_count:\n                missing.append(\"last_mpsv_a\")\n            else:\n                gap = 12 if a_count >= 2 else 3\n                req.append({\"anchor_product\": \"mpsv_a\", \"calendar_months\": gap, \"earliest_date\": _add_calendar_months(date.fromisoformat(dates[\"mpsv_a\"][-1]), gap).isoformat()})\n        earliest = max((r[\"earliest_date\"] for r in req), default=None)\n        calculation.update(earliest_date=earliest, interval_requirements=req, interval_verified=not missing)\n        if missing:\n            result = _item(series, \"RECORDS_NEEDED\", \"LAST_DOSE_DATE_REQUIRED\", f\"已到{name}接种年龄，请补齐前序剂次日期以核对间隔。\", n, 7)\n        elif earliest and _today().isoformat() < earliest:\n            result = _item(series, \"NOT_YET_DUE\", \"MINIMUM_INTERVAL_NOT_MET\", f\"{name}第{n}剂最早接种日期为{earliest}。\", n)\n        else:\n            result = _item(series, \"CATCHUP_DUE\", \"MEN_PRODUCT_CATCHUP_DUE\", f\"{name}第{n}剂已到年龄，已知日期满足最小间隔。\", n, 15)\n    result[\"program_calculation\"] = calculation\n    return result\n\n\ndef _attach_implementation_options(items, combos, months):\n    by_id = {item[\"vaccine_id\"]: item for item in items}\n    for combo in combos:\n        targets = [by_id.get(component) for component in combo[\"components\"]]\n        actionable = [item for item in targets if item and item[\"decision_state\"] in ACTION_STATES]\n        if len(actionable) >= 2 and months is not None and months <= 72:\n            option = {\"product\": combo[\"normalized_name\"], \"covers\": [item[\"vaccine_id\"] for item in actionable], \"note\": \"既往联合疫苗已拆入相应成分；后续产品选择需避免重复计算。\"}\n            for item in actionable:\n                item[\"implementation_options\"].append(option)\n    return items\n\n\ndef _apply_health_rules(items, profile):\n    live_ids = {\"bcg\", \"mmr\", \"varicella\", \"rotavirus\"}\n    path = profile[\"patient_path\"]\n    overall_state = profile.get(\"overall_recommendation_state\")\n    for item in items:\n        # 已完成、年龄/人群不适用、记录不足均保持原事实；健康规则只修正原本可安排的项目。\n        if item[\"decision_state\"] not in ACTION_STATES | {\"PRODUCT_NEEDED\"}:\n            continue\n        if profile.get(\"severe_vaccine_allergy\") and item[\"decision_state\"] in ACTION_STATES:\n            reason = \"既往存在疫苗或疫苗成分相关严重过敏反应，本项在核对具体疫苗和致敏成分前不得直接安排。\"\n            item.update(decision_state=\"MEDICAL_REVIEW\", final_state=STATE_LABELS[\"MEDICAL_REVIEW\"], reason_code=\"SEVERE_VACCINE_ALLERGY_REVIEW\", reason=reason, caregiver_advice=reason, standard_recommendation_status=\"需进一步评估\", priority=1)\n            item[\"medical_rule_ids\"] = [\"INV_SEVERE_VACCINE_ALLERGY_NO_DIRECT_ACTION\"]\n        elif profile.get(\"clinical_flags\", {}).get(\"dialysis\") and item[\"vaccine_id\"] == \"hep_b\" and item[\"decision_state\"] in ACTION_STATES | {\"PRODUCT_NEEDED\"}:\n            reason = \"规律透析会改变乙肝疫苗的剂量