, \"items\": treatments}\n\n\ndef _validated_semantic_facts(raw_value, diagnosis_text, treatment_text, age_text=\"\", record_text=\"\", full_text=\"\"):\n    \"\"\"Validate LLM extraction as evidence-bearing facts; it cannot issue vaccine decisions.\"\"\"\n    try:\n        if isinstance(raw_value, str):\n            cleaned = raw_value.strip()\n            if cleaned.startswith(\"```\"):\n                cleaned = re.sub(r\"^```(?:json)?\\s*|\\s*```$\", \"\", cleaned, flags=re.I)\n            if \"{\" in cleaned and \"}\" in cleaned:\n                cleaned = cleaned[cleaned.find(\"{\"):cleaned.rfind(\"}\") + 1]\n            value = json.loads(cleaned or \"{}\")\n        else:\n            value = raw_value or {}\n    except (TypeError, ValueError):\n        return {\"status\": \"INVALID_JSON\", \"demographics\": {}, \"case_interpretation\": {}, \"clinical_assertions\": [], \"diagnoses\": [], \"treatments\": [], \"vaccinations\": [], \"field_warnings\": [], \"rejected\": [\"invalid_json\"]}\n    if not isinstance(value, dict):\n        return {\"status\": \"INVALID_SCHEMA\", \"demographics\": {}, \"case_interpretation\": {}, \"clinical_assertions\": [], \"diagnoses\": [], \"treatments\": [], \"vaccinations\": [], \"field_warnings\": [], \"rejected\": [\"root_not_object\"]}\n\n    allowed_domains = {domain for domain, _ in RISK_DOMAIN_RULES} | {\"HEMATOLOGIC_ABNORMALITY\", \"OTHER_COVERED\", \"UNKNOWN\"}\n    allowed_categories = {category_id for category_id, _, _ in SPECIAL_HEALTH_CATEGORIES}\n    allowed_treatments = {\n        \"CHEMOTHERAPY\", \"RADIOTHERAPY\", \"IMMUNOTHERAPY\", \"CORTICOSTEROID\",\n        \"IMMUNOSUPPRESSANT\", \"BIOLOGIC\", \"ANTIMICROBIAL\", \"IVIG\", \"HSCT\",\n        \"SOLID_ORGAN_TRANSPLANT\", \"ANTIEPILEPTIC\", \"BLOOD_PRODUCT\", \"OTHER\",\n    }\n    allowed_risk_features = {\n        \"IMMUNE_DEFICIENCY_POSSIBLE\", \"MALIGNANCY\", \"TRANSPLANT\",\n        \"ASPLENIA_OR_SPLENECTOMY\", \"IMMUNOSUPPRESSIVE_TREATMENT\",\n        \"TREATMENT_SENSITIVE_CONDITION\", \"ACUTE_INSTABILITY_POSSIBLE\",\n    }\n    accepted_diagnoses, accepted_treatments, accepted_vaccinations, accepted_assertions, field_warnings, rejected = [], [], [], [], [], []\n    demographics = {}\n    raw_demographics = value.get(\"demographics\") if isinstance(value.get(\"demographics\"), dict) else {}\n    age_source = str(raw_demographics.get(\"age_source_span\") or \"\").strip()\n    semantic_months = raw_demographics.get(\"age_months\")\n    if age_source and age_source.lower() in (age_text or \"\").lower() and isinstance(semantic_months, int) and 0 <= semantic_months <= 216:\n        demographics[\"age_source_span\"] = age_source\n        demographics[\"age_months\"] = semantic_months\n        demographics[\"age_precision\"] = raw_demographics.get(\"age_precision\") if raw_demographics.get(\"age_precision\") in {\"DAY\", \"MONTH\", \"YEAR\", \"APPROXIMATE\"} else \"MONTH\"\n    elif age_source or semantic_months is not None:\n        rejected.append(\"age_without_source_or_out_of_range\")\n    semantic_sex = str(raw_demographics.get(\"sex\") or \"\").upper()\n    if semantic_sex in {\"MALE\", \"FEMALE\", \"UNKNOWN\"}:\n        demographics[\"sex\"] = semantic_sex\n    case_interpretation = {}\n    raw_interpretation = value.get(\"case_interpretation\") if isinstance(value.get(\"case_interpretation\"), dict) else {}\n    diagnosis_state = str(raw_interpretation.get(\"diagnosis_state\") or \"\").upper()\n    semantic_acute_status = str(raw_interpretation.get(\"acute_status\") or \"\").upper()\n    interpretation_sources = [str(item).strip() for item in raw_interpretation.get(\"source_spans\", []) if str(item).strip()] if isinstance(raw_interpretation.get(\"source_spans\"), list) else []\n    evidence_text = full_text or \"\\n\".join(filter(None, [diagnosis_text, treatment_text, age_text, record_text]))\n    sources_valid = bool(interpretation_sources) and all(source.lower() in evidence_text.lower() for source in interpretation_sources)\n    if sources_valid and diagnosis_state in {\"EXPLICIT_HEALTHY\", \"DIAGNOSIS_PRESENT\", \"NO_INFORMATION\", \"AMBIGUOUS\"}:\n        case_interpretation[\"diagnosis_state\"] = diagnosis_state\n        case_interpretation[\"source_spans\"] = interpretation_sources\n    elif diagnosis_state:\n        rejected.append(\"case_interpretation_without_source\")\n    if sources_valid and semantic_acute_status in {\"ACTIVE\", \"RECOVERED\", \"ABSENT\", \"UNKNOWN\"}:\n        if semantic_acute_status != \"ACTIVE\" or any(_has_explicit_current_activity(source) for source in interpretation_sources):\n            case_interpretation[\"acute_status\"] = semantic_acute_status\n        else:\n            case_interpretation[\"acute_status\"] = \"UNKNOWN\"\n            rejected.append(\"active_status_without_current_evidence\")\n    for entry in value.get(\"clinical_assertions\", []) if isinstance(value.get(\"clinical_assertions\"), list) else []:\n        if not isinstance(entry, dict):\n            rejected.append(\"clinical_assertion_not_object\")\n            continue\n        source = str(entry.get(\"source_span\") or \"\").strip()\n        polarity = str(entry.get(\"polarity\") or \"\").upper()\n        assertion_type = str(entry.get(\"type\") or \"\").upper()\n        allowed_assertion_types = {\n            \"SYMPTOM\", \"ACUTE_DISEASE\", \"GENERAL_HEALTH\", \"DISEASE_ACTIVITY\",\n            \"DRUG_ALLERGY\", \"ALLERGY_HISTORY\", \"VACCINE_REACTION\", \"MATERNAL_HISTORY\", \"FAMILY_HISTORY\", \"PROCEDURE\",\n        }\n        if not source or source.lower() not in evidence_text.lower() or polarity not in {\"PRESENT\", \"ABSENT\", \"UNKNOWN\"} or assertion_type not in allowed_assertion_types:\n            rejected.append(\"clinical_assertion_without_source_or_invalid\")\n            continue\n        accepted_assertions.append({\n            \"type\": assertion_type, \"normalized_name\": str(entry.get(\"normalized_name\") or source).strip(),\n            \"polarity\": polarity, \"source_span\": source,\n            \"subject\": entry.get(\"subject\") if entry.get(\"subject\") in {\"CHILD\", \"MOTHER\", \"FATHER\", \"FAMILY\"} else \"CHILD\",\n            \"temporality\": entry.get(\"temporality\") if entry.get(\"temporality\") in {\"CURRENT\", \"HISTORICAL\", \"RESOLVED\", \"UNKNOWN\"} else \"UNKNOWN\",\n        })\n    for entry in value.get(\"diagnoses\", []) if isinstance(value.get(\"diagnoses\"), list) else []:\n        if not isinstance(entry, dict):\n            rejected.append(\"diagnosis_not_object\")\n            continue\n        source = str(entry.get(\"source_span\") or entry.get(\"raw_text\") or \"\").strip()\n        domain = str(entry.get(\"risk_domain\") or \"UNKNOWN\").strip().upper()\n        category = entry.get(\"category_id\")\n        if not source or source.lower() not in evidence_text.lower() or domain not in allowed_domains:\n            rejected.append(\"diagnosis_without_source_or_invalid_domain\")\n            continue\n        entry_subject = str(entry.get(\"subject\") or \"CHILD\").upper()\n        non_child_sources = [\n            fact[\"source_span\"] for fact in accepted_assertions\n            if fact.get(\"subject\") in {\"MOTHER\", \"FATHER\", \"FAMILY\"}\n        ]\n        if entry_subject != \"CHILD\" or any(source in value or value in source for value in non_child_sources):\n            rejected.append(\"non_child_diagnosis_rejected\")\n            continue\n        # Disease-state clauses describe an existing diagnosis; they are not additional diagnoses.\n        # This guard is deliberately phrased by semantics (negated symptom / stability / recovery),\n        # so every disease benefits instead of maintaining case-specific exclusions.\n        if _is_diagnosis_status_clause(source):\n            rejected.append(\"diagnosis_is_status_clause\")\n            continue\n        if category not in allowed_categories:\n            category = None\n        activity = entry.get(\"activity