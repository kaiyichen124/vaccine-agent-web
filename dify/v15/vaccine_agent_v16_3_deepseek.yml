            "code": "import json\n\n\nSTATE_LABELS = {\n    \"CONDITIONALLY_DUE\": \"已到年龄，待满足条件\",\n    \"NOW_DUE\": \"现在可以安排\",\n    \"CATCHUP_DUE\": \"现在可以安排\",\n    \"RECORDS_NEEDED\": \"需要核对接种记录\",\n    \"PRODUCT_NEEDED\": \"需要确认疫苗产品\",\n    \"HEALTH_STATUS_NEEDED\": \"需要补充当前健康状态\",\n    \"MEDICAL_REVIEW\": \"需要专业评估\",\n    \"TEMPORARILY_DEFERRED\": \"暂缓接种\",\n    \"COMPLETED\": \"已完成\",\n    \"NOT_YET_DUE\": \"尚未到接种时间\",\n    \"CATCHUP_WINDOW_CLOSED\": \"已超过补种年龄\",\n    \"POPULATION_NOT_APPLICABLE\": \"不属于适用人群\",\n    \"NO_INDICATION\": \"目前无明确接种指征\",\n}\n\nACTION_STATES = {\"NOW_DUE\", \"CATCHUP_DUE\"}\nREVIEW_STATES = {\n    \"CONDITIONALLY_DUE\",\n    \"RECORDS_NEEDED\", \"PRODUCT_NEEDED\", \"HEALTH_STATUS_NEEDED\",\n    \"MEDICAL_REVIEW\", \"TEMPORARILY_DEFERRED\",\n}\nHARD_CONFLICTS = {\n    \"HARD_AGE\", \"HARD_INTERVAL\", \"HARD_PRODUCT_WINDOW\", \"HARD_DOSE_VALIDITY\",\n    \"HARD_POPULATION\", \"HARD_CONTRAINDICATION\",\n}\nSOFT_CONFLICTS = {\n    \"SOFT_DUPLICATE_RECORD\", \"SOFT_DIAGNOSIS_MAPPING\", \"SOFT_DISEASE_STABILITY\",\n    \"SOFT_EVIDENCE_APPLICABILITY\", \"SOFT_PRIORITY\",\n}\nALLOWED_REVIEW_TARGETS = REVIEW_STATES\n\n\ndef _apply_review_state(item, proposed_state, reason, conflict_type):\n    \"\"\"DeepSeek may lower certainty or block an unsafe action; program arithmetic stays immutable.\"\"\"\n    if proposed_state not in ALLOWED_REVIEW_TARGETS:\n        return False\n    item.update(\n        decision_state=proposed_state,\n        final_decision_state=proposed_state,\n        final_state=STATE_LABELS[proposed_state],\n        caregiver_state=STATE_LABELS[proposed_state],\n        reason_code=\"DEEPSEEK_\" + conflict_type,\n        reason=reason or \"DeepSeek结合病例原文和证据复核后降低了本项结论的确定性。\",\n        caregiver_advice=reason or \"请按复核后的状态处理本项疫苗。\",\n    )\n    item.setdefault(\"readiness\", {}).update(\n        eligible_now=False,\n        blockers=[\"DeepSeek临床复核发现需要先处理的风险或信息缺口\"],\n    )\n    return True\n\n\ndef _loads(value):\n    try:\n        if isinstance(value, str):\n            cleaned = value.strip()\n            if cleaned.startswith(\"```\"):\n                cleaned = cleaned.removeprefix(\"```json\").removeprefix(\"```\").removesuffix(\"```\").strip()\n            if \"{\" in cleaned and \"}\" in cleaned:\n                cleaned = cleaned[cleaned.find(\"{\"):cleaned.rfind(\"}\") + 1]\n            parsed = json.loads(cleaned or \"{}\")\n        else:\n            parsed = value or {}\n        return parsed if isinstance(parsed, dict) else {}\n    except (TypeError, ValueError):\n        return {}\n\n\ndef _review_items(review):\n    items = review.get(\"vaccines\", [])\n    return items if isinstance(items, list) else []\n\n\ndef _validated_review(value):\n    review = _loads(value)\n    case = review.get(\"case_review\")\n    if not isinstance(case, dict) or case.get(\"semantic_consistency\") not in {\"CONSISTENT\", \"CONFLICT\", \"INSUFFICIENT\"}:\n        return {}\n    if not isinstance(review.get(\"vaccines\"), list) or not isinstance(review.get(\"global_conflicts\"), list):\n        return {}\n    review[\"vaccines\"] = [x for x in review[\"vaccines\"] if isinstance(x, dict) and isinstance(x.get(\"vaccine_id\"), str) and isinstance(x.get(\"evidence_ids\", []), list) and all(isinstance(e, str) for e in x.get(\"evidence_ids\", []))]\n    return review\n\n\ndef _summary(items, patient_decision):\n    ordered = sorted(\n        (item for item in items if item.get(\"decision_state\") in ACTION_STATES | REVIEW_STATES),\n        key=lambda item: (item.get(\"priority\", 90), item.get(\"vaccine_id\", \"\")),\n    )\n    acute_known = patient_decision.get(\"gate\") == \"ACUTE_DEFER\" or any(\n        item.get(\"decision_state\") == \"TEMPORARILY_DEFERRED\" for item in items\n    )\n    defer_count = sum(item.get(\"decision_state\") == \"TEMPORARILY_DEFERRED\" for item in items)\n    return {\n        \"action_count\": sum(item.get(\"decision_state\") in ACTION_STATES for item in items),\n        \"confirmation_count\": sum(item.get(\"decision_state\") in {\"RECORDS_NEEDED\", \"PRODUCT_NEEDED\", \"HEALTH_STATUS_NEEDED\"} for item in items),\n        \"medical_review_count\": sum(item.get(\"decision_state\") == \"MEDICAL_REVIEW\" for item in items),\n        \"critical_clinical_information_count\": len(patient_decision.get(\"critical_missing\", [])),\n        \"defer_count\": defer_count if acute_known else None,\n        \"defer_assessment\": \"KNOWN\" if acute_known else \"UNKNOWN_CURRENT_HEALTH_STATUS\",\n        \"items\": [\n            {key: item.get(key) for key in (\"vaccine_id\", \"display_name\", \"dose\", \"decision_state\", \"final_state\", \"reason_code\")}\n            for item in ordered[:4]\n        ],\n    }\n\n\ndef _parent_summary(items, visible_ids, patient_decision):\n    visible = [item for item in items if item.get(\"vaccine_id\") in set(visible_ids)]\n    return {\n        \"action_count\": sum(item.get(\"decision_state\") in ACTION_STATES for item in visible),\n        \"information_task_count\": sum(item.get(\"decision_state\") in {\"RECORDS_NEEDED\", \"PRODUCT_NEEDED\", \"HEALTH_STATUS_NEEDED\"} for item in visible),\n        \"record_items_to_verify\": sum(item.get(\"decision_state\") == \"RECORDS_NEEDED\" for item in visible),\n        \"product_items_to_verify\": sum(item.get(\"decision_state\") == \"PRODUCT_NEEDED\" for item in visible),\n        \"health_items_to_verify\": sum(item.get(\"decision_state\") == \"HEALTH_STATUS_NEEDED\" for item in visible),\n        \"medical_review_count\": sum(item.get(\"decision_state\") == \"MEDICAL_REVIEW\" for item in visible),\n        \"deferred_count\": sum(item.get(\"decision_state\") == \"TEMPORARILY_DEFERRED\" for item in visible),\n        \"critical_clinical_information_count\": len(patient_decision.get(\"critical_missing\", [])),\n        \"grouped_record_task\": False,\n    }\n\n\ndef _generation_context(decision):\n    visible = set(decision.get(\"parent_view\", {}).get(\"visible_vaccine_ids\", []))\n    return {\n        \"processing_status\": decision.get(\"processing_status\", \"READY\"),\n        \"critical_errors\": decision.get(\"critical_errors\", []),\n        \"case\": {\n            \"age_text\": decision.get(\"case_summary\", {}).get(\"age_text\", \"未知\"),\n            \"age_months\": decision.get(\"case_summary\", {}).get(\"age_months\"),\n            \"sex\": decision.get(\"case_summary\", {}).get(\"sex\", \"未知\"),\n        },\n        \"patient\": {\n            \"overall_recommendation_state\": decision.get(\"overall_recommendation_state\"),\n            \"standard_recommendation\": decision.get(\"patient_decision\", {}).get(\"standard_recommendation\"),\n            \"headline\": decision.get(\"patient_decision\", {}).get(\"headline\"),\n            \"alert\": decision.get(\"patient_decision\", {}).get(\"alert\"),\n            \"critical_missing\": decision.get(\"patient_decision\", {}).get(\"critical_missing\", []),\n        },\n        \"parent_view\": decision.get(\"parent_view\", {}),\n        \"priority_summary\": decision.get(\"priority_summary\", {}),\n        \"vaccines\": [\n            {key: item.get(key) for key in (\n                \"vaccine_id\", \"display_name\", \"decision_state\", \"caregiver_state\",\n                \"standard_recommendation_status\", \"reason\", \"caregiver_advice\", \"dose\", \"evidence_trace\",\n            )}\n            for item in decision.get(\"vaccines\", []) if item.get(\"vaccine_id\") in visible\n        ],\n        \"next_steps\": decision.get(\"next_steps\", []),\n        \"sources\": decision.get(\"sources\", []),\n        \"deepseek_review\": decision.get(\"deepseek_review\", {}),\n        \"conflict_audit\": decision.get(\"conflict_audit\", []),\n        \"invariant_audit\": decision.get(\"invariant_audit\", []),\n    }\n\n\ndef _post_review_invariants(decision):\n    \"\"\"DeepSeek may lower certainty, but cannot break structured clinical facts.\"\"\"\n    audit = decision.setdefault(\"invariant_audit\", [])\n    profile = decision.get(\"case_summary\", {}).get(\"health_profile\", {})\n    flags = profile.get(\"clinical_flags\", {})\n    gate = decision.get(\"patient_decision\", {}).get(\"gate\")\n    if flags.get(\"immune_deficiency_possible\") and gate == \"ROUTINE\":\n        decision[\"patient_decision\"].update(\n            gate=\"HIGH_RISK_INFORMATION_PENDING\",\n            headline=\"免疫功能相关风险尚待明确\",\n            alert=\"补齐免疫功能和当前治疗信息前，不生成减毒活疫苗或精确接种时间。\",\n        )\n        profile[\"patient_path\"] = profile[\"patient_gate\"] = \"HIGH_RISK_INFORMATION_PENDING\"\n        audit.append({\"rule_id\": \"INV_IMMUNE_RISK_NOT_ROUTINE\", \"action\": \"CORRECTED_POST_REVIEW\"})\n    if (flags.get(\"planned_splenectomy\") or flags.get(\"asplenia\")) and decision.get(\"patient_decision\", {}).get(\"gate\") == \"ROUTINE\":\n        decision[\"patient_decision\"].update(\n            gate=\"TARGETED_MODIFIER\",\n            headline=\"已识别无脾或计划脾切除相关接种需求\",\n            alert=\"重点核对肺炎球菌、脑膜炎球菌和Hib疫苗，并结合手术时间安排。\",\n        )\n        profile[\"patient_path\"] = profile[\"patient_gate\"] = \"TARGETED_MODIFIER\"\n        audit.append({\"rule_id\": \"INV_SPLENIC_RISK_NOT_ROUTINE\", \"action\": \"CORRECTED_POST_REVIEW\"})\n    if flags.get(\"hematologic_or_immune_review\") and decision.get(\"patient_decision\", {}).get(\"gate\") == \"ROUTINE\":\n        decision[\"patient_decision\"].update(\n            gate=\"HIGH_RISK_INFORMATION_PENDING\",\n            headline=\"血液或免疫相关风险尚待明确\",\n            alert=\"补齐血象、感染状态和近期治疗信息前，不直接生成受影响疫苗的精确接种时间。\",\n        )\n        profile[\"patient_path\"] = profile[\"patient_gate\"] = \"HIGH_RISK_INFORMATION_PENDING\"\n        audit.append({\"rule_id\": \"INV_HEMATOLOGIC_RISK_NOT_ROUTINE\", \"action\": \"CORRECTED_POST_REVIEW\"})\n    for item in decision.get(\"vaccines\", []):\n        if profile.get(\"severe_vaccine_allergy\") and item.get(\"decision_state\") in ACTION_STATES:\n            _apply_review_state(item, \"MEDICAL_REVIEW\", \"既往存在疫苗或疫苗成分相关严重过敏反应，核对具体疫苗和致敏成分前不得直接安排。\", \"HARD_CONTRAINDICATION\")\n            audit.append({\"rule_id\": \"INV_SEVERE_VACCINE_ALLERGY_NO_ACTION\", \"vaccine_id\": item.get(\"vaccine_id\"), \"action\": \"CORRECTED_POST_REVIEW\"})\n        if flags.get(\"immunosuppressive_treatment\") and item.get(\"vaccine_id\") in {\"bcg\", \"mmr\", \"varicella\"} and item.get(\"decision_state\") in ACTION_STATES:\n            _apply_review_state(item, \"TEMPORARILY_DEFERRED\", \"当前存在可能影响活疫苗安全性的免疫抑制治疗，需结合剂量、疗程和停药时间评估。\", \"HARD_CONTRAINDICATION\")\n            audit.append({\"rule_id\": \"INV_IMMUNOSUPPRESSION_NO_LIVE_ACTION\", \"vaccine_id\": item.get(\"vaccine_id\"), \"action\": \"CORRECTED_POST_REVIEW\"})\n    history = decision.get(\"history_normalization\", {}).get(\"antigen_facts\", {})\n    for item in decision.get(\"vaccines\", []):\n        calculation = item.get(\"program_calculation\", {})\n        earliest = calculation.get(\"earliest_date\")\n        age_due = calculation.get(\"age_due_months\")\n        age = decision.get(\"case_summary\", {}).get(\"age_months\")\n        too_young = isinstance(age_due, (int,float)) and isinstance(age, (int,float)) and age < age_due\n        if item.get(\"decision_state\") in ACTION_STATES and (too_young or earliest and earliest > decision.get(\"reference_date\", \"\")):\n            reason = f\"本剂最早接种日期为{earliest}，当前尚未到期。\" if earliest else \"本剂尚未达到对应程序的接种年龄。\"\n            item.update(decision_state=\"NOT_YET_DUE\", final_decision_state=\"NOT_YET_DUE\", final_state=STATE_LABELS[\"NOT_YET_DUE\"], caregiver_state=STATE_LABELS[\"NOT_YET_DUE\"], reason_code=\"FINAL_EARLIEST_DATE_GATE\", reason=reason, caregiver_advice=reason)\n            item.setdefault(\"readiness\", {}).update(eligible_now=False, blockers=[\"尚未达到最早接种日期\"])\n            audit.append({\"rule_id\": \"INV_NO_ACTION_BEFORE_EARLIEST_DATE\", \"vaccine_id\": item[\"vaccine_id\"], \"action\": \"CORRECTED_POST_REVIEW\"})\n    for vaccine_id, known in {\"je\": {\"je_live\", \"je_inactivated\"}, \"hep_a\": {\"hep_a_live\", \"hep_a_inactivated\"}}.items():\n        fact = history.get(vaccine_id, {})\n        item = next((x for x in decision.get(\"vaccines\", []) if x.get(\"vaccine_id\") == vaccine_id), None)\n        if item and set(fact.get(\"products\", [])) & known and item.get(\"decision_state\") == \"PRODUCT_NEEDED\":\n            item.update(\n                decision_state=\"RECORDS_NEEDED\", final_decision_state=\"RECORDS_NEEDED\",\n                final_state=STATE_LABELS[\"RECORDS_NEEDED\"], caregiver_state=STATE_LABELS[\"RECORDS_NEEDED\"],\n                reason_code=\"KNOWN_PRODUCT_HISTORY_VALIDATION_REQUIRED\",\n                reason=\"疫苗产品已经明确；当前只需按该产品程序核对剂次和逐剂日期。\",\n                caregiver_advice=\"产品无需重复确认，请核对该产品的剂次和逐剂日期。\",\n            )\n            audit.append({\"rule_id\": \"INV_KNOWN_PRODUCT_NOT_PRODUCT_NEEDED\", \"vaccine_id\": vaccine_id, \"action\": \"CORRECTED_POST_REVIEW\"})\n    return decision\n\n\ndef _audit(rule_decision_json: str, deepseek_review: str = \"\") -> dict:\n    decision = _loads(rule_decision_json)\n    review = _validated_review(deepseek_review)\n    items = decision.get(\"vaccines\", []) if isinstance(decision.get(\"vaccines\"), list) else []\n    by_id = {item.get(\"vaccine_id\"): item for item in items if item.get(\"vaccine_id\")}\n    audits = []\n\n    for proposal in _review_items(review):\n        if not isinstance(proposal, dict):\n            continue\n        vaccine_id = proposal.get(\"vaccine_id\")\n        item = by_id.get(vaccine_id)\n        if not item:\n            continue\n        review_state = proposal.get(\"review_state\", \"INSUFFICIENT\")\n        conflict_type = proposal.get(\"conflict_type\", \"NONE\")\n        proposed_state = proposal.get(\"proposed_state\")\n        reason = str(proposal.get(\"reason\") or \"\").strip()\n        rule_state = item.get(\"decision_state\")\n        final_state = rule_state\n        resolution = \"RULE_KEPT\"\n\n        if review_state == \"CONFLICT\" and conflict_type == \"HARD_CONTRAINDICATION\":\n            if _apply_review_state(item, proposed_state, reason, conflict_type):\n                final_state = proposed_state\n                resolution = \"DEEPSEEK_SAFETY_OVERRIDE_APPLIED\"\n            else:\n                resolution = \"HARD_CONFLICT_RECORDED_FOR_MANUAL_REVIEW\"\n        elif review_state == \"CONFLICT\" and conflict_type in HARD_CONFLICTS:\n            # 年龄、剂次、日期、间隔、产品窗口和人群硬规则继续由代码裁决。\n            resolution = \"DETERMINISTIC_PROGRAM_RULE_KEPT\"\n        elif review_state == \"CONFLICT\" and conflict_type in SOFT_CONFLICTS:\n            if _apply_review_state(item, proposed_state, reason, conflict_type):\n                final_state = proposed_state\n                resolution = \"DEEPSEEK_CLINICAL_OVERRIDE_APPLIED\"\n            else:\n                resolution = \"SOFT_CONFLICT_RECORDED_RULE_KEPT\"\n\n        audits.append({\n            \"vaccine_id\": vaccine_id,\n            \"rule_result\": rule_state,\n            \"deepseek_review_state\": review_state,\n            \"deepseek_proposed_state\": proposed_state,\n            \"final_result\": final_state,\n            \"conflict_type\": conflict_type,\n            \"resolution\": resolution,\n            \"reason\": reason,\n            \"evidence_ids\": proposal.get(\"evidence_ids\", []),\n        })\n\n    decision[\"schema_version\"] = decision.get(\"schema_version\", \"vaccine-decision-pipeline-v16.2\")\n    decision[\"decision_authority\"] = {\n        \"deepseek_participation_target\": 0.80,\n        \"deepseek_roles\": [\"clinical_fact_extraction\", \"risk_interpretation\", \"rag_evidence_review\", \"clinical_conflict_resolution\", \"caregiver_explanation\"],\n        \"deterministic_roles\": [\"age\", \"dose\", \"date\", \"minimum_interval\", \"product_window\", \"population_gate\", \"final_invariants\"],\n    }\n    decision[\"deepseek_review\"] = {\n        \"case_review\": review.get(\"case_review\", {}),\n        \"global_conflicts\": review.get(\"global_conflicts\", []),\n        \"review_status\": \"PARSED_AND_APPLIED\" if review else \"REVIEW_UNAVAILABLE\",\n    }\n    if decision.get(\"review_required\") and not review:\n        # Review is an audit channel.  Invalid model JSON cannot erase a safe,\n        # deterministic rule result or turn the whole caregiver page into ERROR.\n        decision[\"deepseek_review\"][\"fallback\"] = \"RULE_ENGINE_SAFE_RESULT_KEPT\"\n        decision[\"deepseek_review\"][\"manual_review_recommended\"] = True\n    if any(item.get(\"resolution\") in {\"HARD_CONFLICT_RECORDED_FOR_MANUAL_REVIEW\", \"DETERMINISTIC_PROGRAM_RULE_KEPT\"} and item.get(\"conflict_type\") == \"HARD_CONTRAINDICATION\" for item in audits):\n        decision[\"deepseek_review\"][\"manual_review_recommended\"] = True\n    decision[\"conflict_audit\"] = audits\n    decision = _post_review_invariants(decision)\n    patient_decision = decision.get(\"patient_decision\", {})\n    decision[\"priority_summary\"] = _summary(items, patient_decision)\n    parent_view = decision.setdefault(\"parent_view\", {})\n    visible_ids = parent_view.get(\"visible_vaccine_ids\", [])\n    parent_view.setdefault(\"summary\", {}).update(_parent_summary(items, visible_ids, patient_decision))\n    context = _generation_context(decision)\n    hard_count = sum(item.get(\"conflict_type\") in HARD_CONFLICTS and item.get(\"deepseek_review_state\") == \"CONFLICT\" for item in audits)\n    soft_count = sum(item.get(\"resolution\") == \"SOFT_CONFLICT_RECORDED_RULE_KEPT\" for item in audits)\n    return {\n        \"decision_json\": json.dumps(decision, ensure_ascii=False, separators=(\",\", \":\")),\n        \"generation_context\": json.dumps(context, ensure_ascii=False, separators=(\",\", \":\")),\n        \"conflict_summary\": json.dumps({\"hard_conflicts\": hard_count, \"soft_conflicts\": soft_count, \"review_items\": len(audits)}, ensure_ascii=False, separators=(\",\", \":\")),\n    }\n\n\ndef _cell(value):\n    return str(value or \"\").replace(\"|\", \"／\").replace(\"\\n\", \" \")\n\n\ndef _bind_retrieved_evidence(decision, retrieval_audit):\n    \"\"\"Bind claims only to chunks that were actually selected by the RAG audit.\"\"\"\n    records = retrieval_audit.get(\"records\", []) if isinstance(retrieval_audit, dict) else []\n    adopted = [record for record in records if isinstance(record, dict) and record.get(\"adopted\")]\n    by_evidence = {}\n    for record in adopted:\n        for evidence_id in record.get(\"matched_evidence_ids\", []):\n            by_evidence.setdefault(evidence_id, []).append({\n                \"evidence_id\": evidence_id,\n                \"chunk_id\": record.get(\"chunk_id\"),\n                \"document_id\": record.get(\"document_id\"),\n                \"file_name\": record.get(\"file_name\"),\n                \"section\": record.get(\"section\"),\n                \"location\": record.get(\"location\"),\n                \"source_version\": record.get(\"source_version\"),\n                \"original_text\": record.get(\"original_text\"),\n                \"retrieval_rank\": record.get(\"rank\"),\n                \"selection_rank\": record.get(\"selection_rank\"),\n            })\n\n    decision.setdefault(\"evidence_routing\", {})[\"actual_evidence_ids\"] = list(by_evidence)\n    decision[\"retrieved_sources\"] = [binding for values in by_evidence.values() for binding in values]\n    for item in decision.get(\"vaccines\", []):\n        expected = list(dict.fromkeys(item.get(\"evidence_ids\", [])))\n        support = [binding for evidence_id in expected for binding in by_evidence.get(evidence_id, [])]\n        special_expected = [evidence_id for evidence_id in expected if evidence_id != \"CN_NIP_2026\"]\n        special_supported = [evidence_id for evidence_id in special_expected if by_evidence.get(evidence_id)]\n        item[\"evidence_support\"] = support\n        item[\"actual_evidence_ids\"] = list(dict.fromkeys(binding[\"evidence_id\"] for binding in support))\n        item[\"evidence_status\"] = (\n            \"SUPPORTED_BY_RETRIEVED_CHUNK\" if support and (not special_expected or special_supported)\n            else \"SPECIAL_EVIDENCE_MISSING\" if special_expected\n            else \"PROGRAM_EVIDENCE_MISSING\" if expected\n            else \"NO_EVIDENCE_REQUIRED\"\n        )\n        # Missing clinical-topic evidence may lower certainty. A deterministic\n        # safety defer remains in force; it is safer than silently releasing it.\n        if special_expected and not special_supported and item.get(\"decision_state\") in ACTION_STATES | {\"CONDITIONALLY_DUE\"}:\n            item[\"rule_result_before_evidence_check\"] = item.get(\"decision_state\")\n            item.update(\n                decision_state=\"MEDICAL_REVIEW\", final_decision_state=\"MEDICAL_REVIEW\",\n                final_state=STATE_LABELS[\"MEDICAL_REVIEW\"], caregiver_state=STATE_LABELS[\"MEDICAL_REVIEW\"],\n                reason_code=\"RETRIEVED_SPECIAL_EVIDENCE_MISSING\",\n                reason=\"本项依赖的疾病或治疗专题原文尚未召回，需补充检索并由专业人员核对。\",\n                caregiver_advice=\"相关疾病或治疗专题依据尚未检索完整，请由接种专业人员核对后安排。\",\n            )\n            item.setdefault(\"readiness\", {}).update(eligible_now=False, blockers=[\"依赖的专题原文尚未召回\"])\n    return decision\n\n\ndef _render(decision):\n    if decision.get(\"processing_status\") != \"READY\":\n        return \"### 暂未生成接种建议\\n\\n病例信息未通过输入校验，请核对接种记录和健康资料后重新提交。未将解析失败当作未接种。\"\n    parent = decision.get(\"parent_view\", {})\n    patient = decision.get(\"patient_decision\", {})\n    overall_state = decision.get(\"overall_recommendation_state\") or patient.get(\"overall_recommendation_state\") or \"ROUTINE_CATCHUP\"\n    overall_label = {\n        \"ROUTINE_CATCHUP\": \"常规补种\",\n        \"INACTIVATED_ONLY\": \"建议接种灭活疫苗\",\n        \"DEFER\": \"暂缓接种\",\n        \"FURTHER_EVALUATION\": \"需进一步评估\",\n    }.get(overall_state, \"需进一步评估\")\n    lines = [\"### 孩子目前情况\", parent.get(\"health_summary\", \"本次按年龄、接种史和当前健康状态逐项评估。\"), f\"总体建议：{overall_label}\"]\n    if patient.get(\"gate\") != \"ROUTINE\":\n        lines += [patient.get(\"headline\", \"\"), patient.get(\"alert\", \"\")]\n    if patient.get(\"critical_missing\"):\n        lines += [\"### 关键待核实\", *[\"- \" + str(value) for value in patient[\"critical_missing\"]]]\n    if parent.get(\"recognized_history\"):\n        lines += [\"### 系统已读到的接种记录\", \"；\".join(parent[\"recognized_history\"])]\n    summary = parent.get(\"summary\", {})\n    lines += [\"### 本次最需要关注\", f\"{summary.get('action_count', 0)}项现在可以安排；{summary.get('conditional_count', 0)}项已到年龄、待满足条件。\"]\n    if summary.get(\"zero_action_explanation\"):\n        lines.append(summary[\"zero_action_explanation\"])\n    lines += [\"### 疫苗安排\"]\n    if overall_state in {\"DEFER\", \"FURTHER_EVALUATION\"}:\n        lines.append(\"当前不生成具体疫苗清单；完成上述处理或补齐关键信息后重新评估。\")\n    else:\n        table = [\"| 疫苗名称 | 面向看护人的介绍与建议 |\", \"|---|---|\"]\n        visible = set(parent.get(\"visible_vaccine_ids\", []))\n        for item in decision.get(\"vaccines\", []):\n            if item.get(\"vaccine_id\") not in visible:\n                continue\n            name = item.get(\"display_name\", item.get(\"vaccine_id\"))\n            if item.get(\"dose\"):\n                name += f\"（第{item['dose']}剂）\"\n            table.append(f\"| {_cell(name)} | {_cell(item.get('final_state'))}。{_cell(item.get('caregiver_advice') or item.get('reason'))} |\")\n        lines.append(\"\\n\".join(table))\n    lines += [\"### 下一步\", *[f\"{index}. {step}\" for index, step in enumerate(decision.get(\"next_steps\", []), 1)]]\n    lines += [\"### 提示\", \"本材料用于科研原型和疫苗接种宣教，需由研究人员或预防接种专业人员审核，接种安排以现场评估为准。\", \"### 主要依据\"]\n    lines.extend(\"- \" + source.get(\"title\", \"\") for source in decision.get(\"sources\", []))\n    return \"\\n\\n\".join(lines)\n\n\ndef main(rule_decision_json: str, deepseek_review: str = \"\", retrieval_audit_json: str = \"\") -> dict:\n    raw = _loads(rule_decision_json)\n    if not raw or not isinstance(raw.get(\"vaccines\"), list):\n        raw = {\"processing_status\": \"ERROR\", \"critical_errors\": [\"INVALID_RULE_OUTPUT\"], \"vaccines\": [], \"parent_view\": {}}\n        rule_decision_json = json.dumps(raw, ensure_ascii=False)\n    audited = _audit(rule_decision_json, deepseek_review)\n    decision = _loads(audited[\"decision_json\"])\n    retrieval_audit = _loads(retrieval_audit_json)\n    decision[\"retrieval_audit\"] = retrieval_audit\n    if retrieval_audit.get(\"status\") == \"SPECIAL_EVIDENCE_INSUFFICIENT\":\n        decision.setdefault(\"evidence_routing\", {})[\"retrieval_status\"] = \"SPECIAL_EVIDENCE_INSUFFICIENT\"\n        decision[\"evidence_routing\"][\"special_evidence_insufficient\"] = True\n        decision.setdefault(\"patient_decision\", {}).setdefault(\n            \"evidence_warning\", \"专题证据不足：当前未命中特殊健康状态资料，需人工核对该疾病及治疗相关证据。\"\n        )\n    if isinstance(retrieval_audit.get(\"records\"), list):\n        decision = _bind_retrieved_evidence(decision, retrieval_audit)\n    # Preserve the deterministic result and surface verified hard audit conflicts\n    # as unresolved safety blockers, never as model-authored dose corrections.\n    allowed = set(decision.get(\"evidence_routing\", {}).get(\"allowed_evidence_ids\", []))\n    blocked_ids = {x[\"vaccine_id\"] for x in decision.get(\"conflict_audit\", []) if x.get(\"deepseek_review_state\") == \"CONFLICT\" and x.get(\"conflict_type\") in HARD_CONFLICTS and x.get(\"reason\") and allowed.intersection(x.get(\"evidence_ids\", []))}\n    for item in decision.get(\"vaccines\", []):\n        if item.get(\"vaccine_id\") in blocked_ids and item.get(\"decision_state\") in ACTION_STATES | {\"CONDITIONALLY_DUE\"}:\n            item[\"rule_result_before_audit\"] = item[\"decision_state\"]\n            item.update(decision_state=\"MEDICAL_REVIEW\", final_decision_state=\"MEDICAL_REVIEW\", final_state=\"需要专业评估\", caregiver_state=\"需要专业评估\", reason_code=\"UNRESOLVED_HARD_AUDIT_CONFLICT\", caregiver_advice=\"本项存在尚未解决的安全条件差异，请由接种专业人员核对后安排。\")\n            item.setdefault(\"readiness\", {})[\"eligible_now\"] = False\n            for audit in decision.get(\"conflict_audit\", []):\n                if audit.get(\"vaccine_id\") == item[\"vaccine_id\"]:\n                    audit.update(final_result=\"MEDICAL_REVIEW\", resolution=\"HARD_CONFLICT_BLOCKED_FOR_REVIEW\")\n    parent = decision.setdefault(\"parent_view\", {})\n    visible = set(parent.get(\"visible_vaccine_ids\", []))\n    counts = {}\n    recommendation_statuses = {\n        \"NOW_DUE\": \"常规接种\", \"CATCHUP_DUE\": \"常规补种\",\n        \"CONDITIONALLY_DUE\": \"需进一步评估\", \"RECORDS_NEEDED\": \"需进一步评估\",\n        \"PRODUCT_NEEDED\": \"需进一步评估\", \"HEALTH_STATUS_NEEDED\": \"需进一步评估\",\n        \"MEDICAL_REVIEW\": \"需进一步评估\", \"TEMPORARILY_DEFERRED\": \"暂缓接种\",\n    }\n    for item in decision.get(\"vaccines\", []):\n        state = item.get(\"decision_state\")\n        status = item.get(\"standard_recommendation_status\")\n        if status not in {\"常规接种\", \"常规补种\", \"建议接种灭活疫苗\", \"暂缓接种\", \"需进一步评估\"}:\n            status = recommendation_statuses.get(state)\n        item[\"recommendation_status\"] = status\n        item[\"program_status\"] = item.get(\"final_state\") if status is None else None\n        item[\"standard_recommendation_status\"] = status\n        if item.get(\"vaccine_id\") in visible:\n            counts[item[\"decision_state\"]] = counts.get(item[\"decision_state\"], 0) + 1\n    parent.setdefault(\"summary\", {}).update(_parent_summary(decision[\"vaccines\"], list(visible), decision.get(\"patient_decision\", {})))\n    parent[\"summary\"][\"conditional_count\"] = counts.get(\"CONDITIONALLY_DUE\", 0)\n    labels = [(\"CONDITIONALLY_DUE\", \"已到年龄、待满足条件\"), (\"RECORDS_NEEDED\", \"接种史或日期待核实\"), (\"PRODUCT_NEEDED\", \"产品或适龄程序待核实\"), (\"HEALTH_STATUS_NEEDED\", \"关键健康信息待核实\"), (\"MEDICAL_REVIEW\", \"需要专业评估\"), (\"TEMPORARILY_DEFERRED\", \"需要暂缓\"), (\"COMPLETED\", \"已完成\"), (\"NOT_YET_DUE\", \"尚未到期\")]\n    reasons = [{\"count\": counts[key], \"label\": label} for key, label in labels if counts.get(key)]\n    parent[\"summary\"][\"zero_action_reasons\"] = reasons\n    parent[\"summary\"][\"zero_action_explanation\"] = \"\" if parent[\"summary\"][\"action_count\"] else \"当前没有可直接安排的项目：\" + (\"；\".join(f\"{x['count']}项{x['label']}\" for x in reasons) or \"本次尚无满足安排条件的适龄项目\") + \"。\"\n    decision[\"priority_summary\"] = _summary(decision[\"vaccines\"], decision.get(\"patient_decision\", {}))\n    result = _render(decision)\n    validation = {\"passed\": decision.get(\"processing_status\") == \"READY\", \"issues\": decision.get(\"critical_errors\", []), \"render_mode\": \"DEEPSEEK_GENERATION_WITH_DETERMINISTIC_FALLBACK\"}\n    return {\n        \"result\": result,\n        \"result_json\": json.dumps(decision, ensure_ascii=False, separators=(\",\", \":\")),\n        \"generation_context\": json.dumps(_generation_context(decision), ensure_ascii=False, separators=(\",\", \":\")),\n        \"validation_report\": json.dumps(validation, ensure_ascii=False),\n    }\n",
