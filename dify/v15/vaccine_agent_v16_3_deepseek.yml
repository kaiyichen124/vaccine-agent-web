          "id": "fusion_case_rules_v8",
          "type": "custom",
          "data": {
            "code": "import json\nimport re\nfrom datetime import date, timedelta, datetime, timezone\nfrom contextvars import ContextVar\nfrom calendar import monthrange\n\n\nTODAY = date.today()\n_REFERENCE_DATE = ContextVar(\"assessment_date\", default=None)\n\n\ndef _today():\n    return _REFERENCE_DATE.get() or datetime.now(timezone(timedelta(hours=8))).date()\n\n\ndef _current_influenza_season():\n    today = _today()\n    start_year = today.year if today.month >= 7 else today.year - 1\n    return f\"{start_year}-{start_year + 1}\"\n\n# Dify's Monaco editor can retain this harmless Chinese identifier as an IME\n# composition artifact after replacing a very large code block.\n不再把所有 = None\n\n# 家长端状态与内部原因分开。reason_code 用于界面解释“为什么”，不再把所有\n# 不确定性压进一个“接种前需确认”。\nSTATE_LABELS = {\n    \"CONDITIONALLY_DUE\": \"已到年龄，待满足条件\",\n    \"NOW_DUE\": \"现在可以安排\",\n    \"CATCHUP_DUE\": \"现在可以安排\",\n    \"RECORDS_NEEDED\": \"需要核对接种记录\",\n    \"PRODUCT_NEEDED\": \"需要确认疫苗产品\",\n    \"HEALTH_STATUS_NEEDED\": \"需要补充当前健康状态\",\n    \"MEDICAL_REVIEW\": \"需要专业评估\",\n    \"TEMPORARILY_DEFERRED\": \"暂缓接种\",\n    \"COMPLETED\": \"已完成\",\n    \"NOT_YET_DUE\": \"尚未到接种时间\",\n    \"CATCHUP_WINDOW_CLOSED\": \"已超过补种年龄\",\n    \"POPULATION_NOT_APPLICABLE\": \"不属于适用人群\",\n    \"NO_INDICATION\": \"目前无明确接种指征\",\n}\n\nACTION_STATES = {\"NOW_DUE\", \"CATCHUP_DUE\"}\nREVIEW_STATES = {\n    \"CONDITIONALLY_DUE\",\n    \"RECORDS_NEEDED\", \"PRODUCT_NEEDED\", \"HEALTH_STATUS_NEEDED\",\n    \"MEDICAL_REVIEW\", \"TEMPORARILY_DEFERRED\",\n}\n\n# 研究端保留稳定 reason_code；家长端只读取这里生成的中文标签。\n# 未登记的新代码统一显示为中性中文，禁止把内部枚举泄漏到页面。\nPARENT_REASON_LABELS = {\n    \"DOSE_HISTORY_INSUFFICIENT\": \"剂次记录待核实\",\n    \"PRODUCT_PROGRAM_DEPENDENT\": \"产品影响接种程序\",\n    \"AGE_MISSING\": \"年龄信息待补充\",\n    \"ROUTINE_DUE\": \"常规到期\",\n    \"EXPLICIT_GAP\": \"明确存在未完成剂次\",\n    \"CURRENT_ACUTE_ILLNESS\": \"当前处于急性期\",\n    \"AGE_LIMIT\": \"已超过适用年龄窗口\",\n    \"POPULATION\": \"当前不属于适用人群\",\n    \"RECORD_COMPLETE\": \"接种记录显示已完成\",\n    \"DOSE_COUNT_COMPLETE\": \"记录剂次已完成\",\n    \"AGE_NOT_DUE\": \"尚未到接种年龄\",\n    \"NEXT_DOSE_NOT_DUE\": \"下一剂尚未到期\",\n    \"COMPONENT_OVERLAP_DATE_REQUIRED\": \"成分记录需按日期合并\",\n    \"LAST_DOSE_DATE_REQUIRED\": \"需核对上一剂日期\",\n    \"POLIO_PRODUCT_PATH_AND_DATE\": \"需确认脊灰产品路径和日期\",\n    \"MINIMUM_INTERVAL_NOT_MET\": \"尚未达到最小间隔\",\n    \"EPILEPSY_CONTROL_REQUIRED\": \"需确认癫痫控制情况\",\n    \"CHD_STABILITY_REQUIRED\": \"需确认先心病稳定性\",\n    \"CHD_UNSTABLE\": \"当前心脏状态需先评估\",\n    \"PRETERM_CURRENT_STABILITY_REQUIRED\": \"需确认当前临床稳定性\",\n    \"HIGH_RISK_ACTIVE_PATH\": \"当前处于高风险治疗路径\",\n    \"HIGH_RISK_LIVE_VACCINE_DEFER\": \"高风险期暂缓减毒活疫苗\",\n    \"HIGH_RISK_TREATMENT_INFORMATION_REQUIRED\": \"关键治疗信息待补充\",\n    \"UNMAPPED_DIAGNOSIS_RISK_REVIEW\": \"当前诊断的接种风险待判定\",\n    \"INFECTIOUS_CURRENT_STATUS_REQUIRED\": \"需确认急性感染是否恢复\",\n    \"IVIG_INJECTABLE_LIVE_INTERVAL\": \"需按IVIG日期计算间隔\",\n    \"OPTIONAL_PRODUCT_AGE_CLOSED\": \"已超过产品年龄窗口\",\n}\n\n\ndef _attach_parent_labels(items):\n    for item in items:\n        item[\"parent_reason_label\"] = PARENT_REASON_LABELS.get(item.get(\"reason_code\"), \"接种程序判断\")\n    return items\n\n# 月龄程序只表达本系统有确定规则的抗原。联合疫苗不在任务目录中。\nSERIES = [\n    {\"id\": \"hep_b\", \"name\": \"乙肝疫苗\", \"schedule\": [0, 1, 6], \"aliases\": [\"乙肝疫苗\", \"乙肝\"]},\n    {\"id\": \"bcg\", \"name\": \"卡介苗\", \"schedule\": [0], \"aliases\": [\"卡介苗\"], \"catchup_max\": 47},\n    {\"id\": \"polio\", \"name\": \"脊灰疫苗\", \"schedule\": [2, 3, 4, 48], \"aliases\": [\"脊灰疫苗\", \"脊灰\", \"IPV\", \"OPV\"]},\n    {\"id\": \"dtap\", \"name\": \"百白破疫苗\", \"schedule\": [2, 4, 6, 18, 72], \"aliases\": [\"百白破疫苗\", \"百白破\"]},\n    {\"id\": \"mmr\", \"name\": \"麻腮风疫苗\", \"schedule\": [8, 18], \"aliases\": [\"麻腮风疫苗\", \"麻腮风\", \"MMR\"]},\n    {\"id\": \"je\", \"name\": \"乙脑疫苗\", \"schedule\": None, \"aliases\": [\"乙脑疫苗\", \"乙脑\"], \"product_dependent\": True},\n    {\"id\": \"meningococcal\", \"name\": \"流脑疫苗\", \"schedule\": None, \"aliases\": [\"流脑疫苗\", \"流脑\", \"A群\", \"AC群\", \"A群C群\"], \"product_dependent\": True},\n    {\"id\": \"hep_a\", \"name\": \"甲肝疫苗\", \"schedule\": None, \"aliases\": [\"甲肝疫苗\", \"甲肝\"], \"product_dependent\": True},\n    {\"id\": \"hpv_nip\", \"name\": \"国家免疫规划双价HPV疫苗\", \"schedule\": [156, 162], \"aliases\": [\"双价HPV\", \"HPV\", \"人乳头瘤\"], \"sex\": \"女\", \"min_age\": 156, \"catchup_max\": 215},\n]\n\nCOMBINATIONS = [\n    {\"name\": \"四联疫苗\", \"pattern\": r\"四联(?:疫苗)?\", \"components\": [\"dtap\", \"hib\"]},\n    {\"name\": \"五联疫苗\", \"pattern\": r\"五联(?:疫苗)?\", \"components\": [\"dtap\", \"polio\", \"hib\"]},\n    {\"name\": \"六联疫苗\", \"pattern\": r\"六联(?:疫苗)?\", \"components\": [\"dtap\", \"polio\", \"hib\", \"hep_b\"]},\n    {\"name\": \"A群C群流脑-Hib联合疫苗\", \"pattern\": r\"(?:AC|A群C群).{0,8}(?:流脑|脑膜炎球菌).{0,8}Hib\", \"components\": [\"meningococcal\", \"hib\"]},\n    {\"name\": \"甲乙肝联合疫苗\", \"pattern\": r\"甲乙肝联合(?:疫苗)?|甲型乙型肝炎联合疫苗\", \"components\": [\"hep_a\", \"hep_b\"]},\n]\n\nOPTIONAL = [\n    {\"id\": \"flu\", \"name\": \"流感疫苗\", \"pattern\": r\"流感疫苗\", \"min_age\": 6, \"risk_domains\": [\"HEMATOLOGIC_MALIGNANCY\", \"SOLID_MALIGNANCY\", \"TRANSPLANT\", \"PRIMARY_OR_SECONDARY_IMMUNODEFICIENCY\"]},\n    {\"id\": \"varicella\", \"name\": \"水痘疫苗\", \"pattern\": r\"水痘疫苗\", \"min_age\": 12, \"live\": True, \"risk_domains\": [\"HEMATOLOGIC_MALIGNANCY\", \"SOLID_MALIGNANCY\", \"TRANSPLANT\", \"PRIMARY_OR_SECONDARY_IMMUNODEFICIENCY\"]},\n    {\"id\": \"pcv\", \"name\": \"肺炎球菌结合疫苗\", \"pattern\": r\"肺炎球菌|肺炎疫苗|肺炎(?=\\s*[一二两三四五六七八九十\\d]+\\s*(?:针|剂))|PCV|(?:13|15|20)价肺炎\", \"product_dependent\": True, \"risk_domains\": [\"HEMATOLOGIC_MALIGNANCY\", \"SOLID_MALIGNANCY\", \"TRANSPLANT\", \"PRIMARY_OR_SECONDARY_IMMUNODEFICIENCY\"]},\n    {\"id\": \"hib\", \"name\": \"Hib疫苗\", \"pattern\": r\"Hib|乙型流感嗜血杆菌\", \"min_age\": 2, \"product_dependent\": True, \"risk_domains\": [\"HEMATOLOGIC_MALIGNANCY\", \"SOLID_MALIGNANCY\", \"TRANSPLANT\", \"PRIMARY_OR_SECONDARY_IMMUNODEFICIENCY\"]},\n    {\"id\": \"rotavirus\", \"name\": \"轮状病毒疫苗\", \"pattern\": r\"轮状病毒疫苗|轮状疫苗\", \"min_age\": 1, \"max_age\": 47, \"product_dependent\": True},\n    {\"id\": \"ev71\", \"name\": \"EV71灭活疫苗\", \"pattern\": r\"EV71|肠道病毒71|手足口疫苗\", \"min_age\": 6, \"max_age\": 71, \"product_dependent\": True},\n    {\"id\": \"ppsv23\", \"name\": \"23价肺炎球菌多糖疫苗\", \"pattern\": r\"23价肺炎|PPSV23\", \"min_age\": 24, \"high_risk_only\": True, \"risk_domains\": [\"HEMATOLOGIC_MALIGNANCY\", \"SOLID_MALIGNANCY\", \"TRANSPLANT\", \"PRIMARY_OR_SECONDARY_IMMUNODEFICIENCY\"]},\n    {\"id\": \"mpcv_ac\", \"name\": \"A群C群流脑结合疫苗\", \"pattern\": r\"A群C群(?:流脑|脑膜炎球菌)(?:多糖)?结合疫苗|MPCV[-—]?AC\", \"product_dependent\": True},\n    {\"id\": \"mpsv_acyw\", \"name\": \"ACYW群流脑多糖疫苗\", \"pattern\": r\"ACYW(?:135)?群?(?:流脑|脑膜炎球菌)多糖疫苗|MPSV[-—]?ACYW\", \"product_dependent\": True},\n    {\"id\": \"mpcv_acyw\", \"name\": \"ACYW群流脑结合疫苗\", \"pattern\": r\"ACYW(?:135)?群?(?:流脑|脑膜炎球菌)(?:多糖)?结合疫苗|MPCV[-—]?ACYW\", \"product_dependent\": True},\n    {\"id\": \"hpv4\", \"name\": \"四价HPV疫苗\", \"pattern\": r\"四价HPV疫苗|4价HPV疫苗\", \"product_dependent\": True},\n    {\"id\": \"hpv9\", \"name\": \"九价HPV疫苗\", \"pattern\": r\"九价HPV疫苗|9价HPV疫苗\", \"product_dependent\": True},\n]\n\n\n# 甲方知识库“特殊健康状态儿童预防接种专家共识”1—26的统一分类。\n# pattern只负责病例事实归一化；接种结论由后续状态机和疫苗规则决定。\nSPECIAL_HEALTH_CATEGORIES = [\n    (\"PRETERM\", \"早产儿\", r\"早产|极低出生体重|低出生体重\"),\n    (\"ASTHMA\", \"支气管哮喘\", r\"支气管哮喘|哮喘\"),\n    (\"PRIMARY_IMMUNODEFICIENCY\", \"原发性免疫缺陷病\", r\"原发性免疫缺陷|先天性免疫缺陷|联合免疫缺陷|无丙种球蛋白血症\"),\n    (\"FOOD_ALLERGY\", \"食物过敏\", r\"食物过敏|牛奶蛋白过敏|鸡蛋过敏\"),\n    (\"CONGENITAL_HEART_DISEASE\", \"先天性心脏病\", r\"先天性心脏病|先心病|房间隔缺损|室间隔缺损|动脉导管未闭|大动脉(?:转位|错位)|法洛四联症|单心室|肺动脉闭锁|主动脉缩窄|\\bASD\\b|\\bVSD\\b|\\bPDA\\b\"),\n    (\"ECZEMA\", \"湿疹\", r\"湿疹|特应性皮炎\"),\n    (\"FEBRILE_SEIZURE\", \"热性惊厥\", r\"热性惊厥|高热惊厥\"),\n    (\"EPILEPSY\", \"癫痫\", r\"癫痫|无热性惊厥|反复惊厥|惊厥性疾病\"),\n    (\"CEREBRAL_PALSY\", \"脑性瘫痪\", r\"脑性瘫痪|脑瘫\"),\n    (\"NEONATAL_INTRACRANIAL_HEMORRHAGE\", \"新生儿颅内出血\", r\"新生儿颅内出血|颅内出血\"),\n    (\"INFANT_JAUNDICE\", \"婴儿黄疸\", r\"新生儿黄疸|婴儿黄疸|高胆红素血症\"),\n    (\"INFECTIOUS_DISEASE\", \"感染性疾病\", r\"感染性疾病|急性感染|支气管炎|肺炎|肾炎|脑炎|脑膜炎\"),\n    (\"PERIANAL_ABSCESS\", \"肛周脓肿\", r\"肛周脓肿\"),\n    (\"IGA_VASCULITIS\", \"IgA血管炎\", r\"IgA血管炎|过敏性紫癜\"),\n    (\"AUTOIMMUNE_DISEASE\", \"自身免疫性疾病\", r\"系统性红斑狼疮|\\bSLE\\b|幼年特发性关节炎|类风湿|干燥综合征|重症肌无力|多发性硬化|自身免疫性(?:溶血性贫血|疾病)|免疫性溶血性贫血|\\bAIHA\\b|炎症性肠病|克罗恩病|溃疡性结肠炎|\\bIBD\\b\"),\n    (\"KIDNEY_DISEASE\", \"肾脏疾病\", r\"肾病综合征|慢性肾病|肾功能不全|肾脏疾病|肾小球肾炎\"),\n    (\"LEUKEMIA_CHEMOTHERAPY\", \"白血病化疗\", r\"白血病|急性淋巴细胞白血病|\\bALL\\b|急性髓系白血病|\\bAML\\b\"),\n    (\"ANEMIA\", \"儿童贫血\", r\"贫血|地中海贫血\"),\n    (\"IMMUNOSUPPRESSANT_USE\", \"免疫抑制剂使用\", r\"免疫抑制剂|免疫抑制治疗|糖皮质激素|泼尼松|甲泼尼龙|生物制剂|利妥昔单抗\"),\n    (\"IVIG_USE\", \"静脉注射免疫球蛋白使用\", r\"IVIG|静脉注射免疫球蛋白\"),\n    (\"INHERITED_METABOLIC_DISEASE\", \"遗传代谢病\", r\"遗传代谢病|苯丙酮尿症|甲基丙二酸血症|糖原累积病\"),\n    (\"LIVER_DISEASE\", \"儿童肝病\", r\"儿童肝病|慢性肝病|肝功能异常|胆道闭锁|肝炎\"),\n    (\"ALLOGENEIC_HSCT\", \"异体造血干细胞移植\", r\"异体(?:造血干细胞|骨髓)?移植|allo[- ]?HSCT\"),\n    (\"SOLID_ORGAN_TRANSPLANT\", \"实体器官移植\", r\"实体器官移植|肝移植|肾移植|心脏移植|肺移植\"),\n    (\"INFANT_CMV\", \"婴儿巨细胞病毒感染\", r\"巨细胞病毒|CMV感染\"),\n    (\"CHROMOSOMAL_DISEASE\", \"常见染色体病\", r\"染色体病|唐氏综合征|21三体|特纳综合征|Turner|22q11(?:\\.2)?缺失|(?:基因)?22号(?:染色体)?(?:q11(?:\\.2)?)?(?:缺失|微缺失)\"),\n]\n\n\n# 临床风险域与26类知识库目录是两个维度。前者决定是否可以进入普通路径，\n# 后者只决定可检索哪些专项资料。未知诊断必须保留，不能因未命中目录而消失。\nRISK_DOMAIN_RULES = [\n    (\"HEMATOLOGIC_MALIGNANCY\", r\"白血病|淋巴瘤|骨髓增生异常|恶性血液病|多发性骨髓瘤\"),\n    (\"SOLID_MALIGNANCY\", r\"神经母细胞瘤|肾母细胞瘤|肝母细胞瘤|视网膜母细胞瘤|髓母细胞瘤|母细胞瘤|肉瘤|恶性肿瘤|癌(?:症|病|瘤)?\"),\n    (\"PRIMARY_OR_SECONDARY_IMMUNODEFICIENCY\", r\"免疫缺陷|免疫功能低下|HIV感染|艾滋病|低丙种球蛋白血症|22q11(?:\\.2)?缺失|(?:基因)?22号(?:染色体)?(?:q11(?:\\.2)?)?(?:缺失|微缺失)|DiGeorge|胸腺(?:发育不全|缺如)|T细胞免疫异常\"),\n    (\"AUTOIMMUNE_OR_INFLAMMATORY\", r\"系统性红斑狼疮|\\bSLE\\b|幼年特发性关节炎|类风湿|自身免疫(?:性)?|血管炎|肾病综合征|炎症性肠病|克罗恩病|溃疡性结肠炎|\\bIBD\\b\"),\n    (\"TRANSPLANT\", r\"造血干细胞移植|骨髓移植|\\bHSCT\\b|\\bHCT\\b|实体器官移植|肝移植|肾移植|心脏移植|肺移植\"),\n    (\"ACUTE_OR_INFECTIOUS\", r\"支气管炎|肺炎|感染|发热|脑炎|脑膜炎|肾炎\"),\n    (\"NEUROLOGIC\", r\"癫痫|惊厥|脑瘫|发育迟缓|发育落后|神经系统\"),\n    (\"CARDIOPULMONARY\", r\"先天性心脏病|房间隔缺损|室间隔缺损|动脉导管未闭|肺动脉高压|心功能|支气管肺发育不良|ARDS|急性呼吸窘迫\"),\n    (\"PREMATURITY\", r\"早产|极低出生体重|低出生体重\"),\n]\n\nHEMATOLOGIC_ABNORMALITY_PATTERN = re.compile(\n    r\"血小板(?:减少|增多|异常)|白细胞(?:减少|增多|异常)|中性粒细胞(?:减少|增多|异常)|贫血|血红蛋白(?:降低|异常)\"\n)\n\nFACT_TYPE_RULES = [\n    (\"MATERNAL_HISTORY\", r\"(?:母亲|妈妈|孕母|母系).{0,30}(?:患有|诊断|病史|综合征|疾病|强直性脊柱炎|自身免疫|用药)\"),\n    (\"FAMILY_HISTORY\", r\"(?:父亲|爸爸|父母|家族|兄弟姐妹).{0,30}(?:患有|诊断|病史)\"),\n    (\"VACCINE_REACTION\", r\"(?:接种后|接种部位|疫苗反应|异常反应).{0,30}(?:硬结|硬肿|红肿|疼痛|发热|皮疹|过敏|抽搐)\"),\n    (\"DRUG_ALLERGY\", r\"(?:青霉素|头孢|阿莫西林|药物|抗生素).{0,12}过敏|药物过敏史\"),\n    (\"ALLERGY_HISTORY\", r\"^(?:有)?过敏(?:反应|史)?(?:不详|不清|未知)?$\"),\n    (\"PROCEDURE\", r\"(?:拟|计划|准备|待|已经|曾经).{0,8}(?:行)?(?:脾切除|手术)|(?:脾切除|手术)(?:术后|史)\"),\n    (\"TREATMENT\", r\"化疗|放疗|免疫治疗|免疫抑制剂|糖皮质激素|生物制剂|IVIG|造血干细胞移植|器官移植|血液透析|腹膜透析|胰岛素|促红细胞生成素\"),\n    (\"CURRENT_SYMPTOM\", r\"发热|咳嗽|流涕|鼻塞|腹泻|喘息|呕吐|皮疹|精神欠佳|食欲下降\"),\n    (\"CLINICAL_STATUS\", r\"现已恢复|已经恢复|症状已消失|生长稳定|目前稳定|控制稳定|病情稳定|无氧疗|心功能正常|无肺动脉高压|无手术计划|无急性发作|无活动性出血|血糖控制稳定|无酮症酸中毒|尚未完成分型|治疗方案正在调整|已\\s*\\d+\\s*个月无发作|过去\\s*\\d+\\s*(?:天|周|月).{0,8}发作\"),\n    (\"DEVICE_OR_ANATOMICAL_RISK\", r\"人工耳蜗|脑脊液(?:鼻)?漏|无脾|功能性无脾\"),\n]\n\n\ndef _fact_types(fragment):\n    \"\"\"Classify statement type before disease mapping.\"\"\"\n    matched = [fact_type for fact_type, pattern in FACT_TYPE_RULES if re.search(pattern, fragment or \"\", re.I)]\n    return matched or [\"CHILD_DIAGNOSIS\"]\n\n\ndef _positive_concept(text, pattern):\n    for match in re.finditer(pattern, text or \"\", re.I):\n        prefix = (text or \"\")[max(0, match.start() - 8):match.start()]\n        if not re.search(r\"(?:无|未见|未提供|未记录|否认|排除|没有)[^，；;。\\n]{0,6}$\", prefix):\n            return True\n    return False\n\n\ndef _clinical_risk_flags(text, diagnoses, treatments):\n    \"\"\"Derive safety-relevant facts independently from the disease catalogue.\n\n    These facts are the risk gate's input.  A missed catalogue label therefore\n    cannot silently turn an explicit immune-risk or splenic-risk statement into\n    a routine case.\n    \"\"\"\n    source = text or \"\"\n    diagnosis_domains = {item.get(\"risk_domain\") for item in diagnoses}\n    semantic_features = {feature for item in diagnoses for feature in item.get(\"risk_features\", [])}\n    treatment_types = {item.get(\"type\") for item in treatments}\n    diagnosis_text = \"\\n\".join(str(item.get(\"normalized_name\") or item.get(\"raw_text\") or \"\") for item in diagnoses)\n    return {\n        \"immune_deficiency_possible\": (\n            \"PRIMARY_OR_SECONDARY_IMMUNODEFICIENCY\" in diagnosis_domains\n            or \"IMMUNE_DEFICIENCY_POSSIBLE\" in semantic_features\n            or _positive_concept(source, r\"免疫缺陷|免疫功能低下|低丙种球蛋白|22q11(?:\\.2)?缺失|(?:基因)?22号(?:染色体)?(?:q11(?:\\.2)?)?(?:缺失|微缺失)|DiGeorge|胸腺(?:发育不全|缺如)|T细胞免疫异常|反复感染\")\n        ),\n        \"planned_splenectomy\": bool(re.search(r\"(?:拟|计划|准备|待).{0,8}(?:行)?脾切除|脾切除.{0,8}(?:拟行|计划|准备|待)\", source)),\n        \"asplenia\": \"ASPLENIA_OR_SPLENECTOMY\" in semantic_features or bool(re.search(r\"无脾|功能性无脾|脾切除术后|既往.{0,8}脾切除\", source)),\n        \"malignancy\": \"MALIGNANCY\" in semantic_features or bool({\"HEMATOLOGIC_MALIGNANCY\", \"SOLID_MALIGNANCY\"} & diagnosis_domains),\n        \"hsct\": \"HSCT\" in treatment_types or \"TRANSPLANT\" in diagnosis_domains and bool(re.search(r\"造血干细胞移植|骨髓移植|\\bHSCT\\b|\\bHCT\\b\", source, re.I)),\n        \"solid_organ_transplant\": \"SOLID_ORGAN_TRANSPLANT\" in treatment_types,\n        \"immunosuppressive_treatment\": any(_is_immunosuppressive_treatment(item) for item in treatments),\n        # Conditions whose vaccine risk depends materially on current treatment\n        # cannot inherit a low-risk label merely from a broad catalogue category.\n        \"treatment_sensitive_condition\": \"TREATMENT_SENSITIVE_CONDITION\" in semantic_features or bool(re.search(\n            r\"再生障碍性贫血|再障|骨髓衰竭|自身免疫性溶血性贫血|免疫性溶血性贫血|AIHA|噬血细胞综合征|组织细胞增生症|炎症性肠病|克罗恩病|溃疡性结肠炎\",\n            diagnosis_text,\n            re.I,\n        )),\n        \"hematologic_or_immune_review\": bool(re.search(r\"血液系统疾病|白细胞减少|中性粒细胞减少|淋巴细胞减少|骨髓衰竭\", source, re.I)),\n        \"cochlear_implant\": bool(re.search(r\"人工耳蜗\", source)),\n        \"csf_leak\": bool(re.search(r\"脑脊液(?:鼻)?漏\", source)),\n        \"dialysis\": bool(re.search(r\"血液透析|腹膜透析|规律透析\", source)),\n    }\n\n\ndef _is_inhaled_or_local_steroid(item):\n    source = \"\\n\".join(str(item.get(key) or \"\") for key in (\"raw_text\", \"source_span\", \"route\", \"dose\"))\n    return bool(re.search(r\"吸入|雾化|鼻喷|外用|局部|低剂量吸入\", source, re.I))\n\n\ndef _is_non_immunosuppressive_biologic_label(item):\n    source = \"\\n\".join(str(item.get(key) or \"\") for key in (\"raw_text\", \"source_span\"))\n    return bool(re.search(r\"胰岛素|促红细胞生成素|EPO|降压药\", source, re.I))\n\n\ndef _is_immunosuppressive_treatment(item):\n    treatment_type = item.get(\"type\")\n    if treatment_type in {\"CHEMOTHERAPY\", \"RADIOTHERAPY\", \"IMMUNOTHERAPY\", \"IMMUNOSUPPRESSANT\"}:\n        return True\n    if treatment_type == \"BIOLOGIC\":\n        return not _is_non_immunosuppressive_biologic_label(item)\n    if treatment_type == \"CORTICOSTEROID\":\n        return not _is_inhaled_or_local_steroid(item)\n    return False\n\n\ndef _antibody_product_relevant(item):\n    if item.get(\"type\") not in {\"IVIG\", \"BLOOD_PRODUCT\"}:\n        return False\n    source = \"\\n\".join(str(item.get(key) or \"\") for key in (\"raw_text\", \"source_span\", \"date\", \"last_date\"))\n    years = re.search(r\"(\\d+)\\s*年前\", source)\n    months = re.search(r\"(\\d+)\\s*个月?前\", source)\n    if years and int(years.group(1)) >= 1:\n        return False\n    if months and int(months.group(1)) >= 11:\n        return False\n    return True\n\n\ndef _has_explicit_current_activity(text):\n    return bool(re.search(\n        r\"目前|当前|正在|仍(?:有|在)|持续|今天|尚未恢复|未缓解|急性期|活动期|住院\",\n        text or \"\",\n    ))\n\nCATEGORY_RISK_DOMAINS = {\n    \"LEUKEMIA_CHEMOTHERAPY\": \"HEMATOLOGIC_MALIGNANCY\",\n    \"PRIMARY_IMMUNODEFICIENCY\": \"PRIMARY_OR_SECONDARY_IMMUNODEFICIENCY\",\n    \"AUTOIMMUNE_DISEASE\": \"AUTOIMMUNE_OR_INFLAMMATORY\",\n    \"IGA_VASCULITIS\": \"AUTOIMMUNE_OR_INFLAMMATORY\",\n    \"KIDNEY_DISEASE\": \"AUTOIMMUNE_OR_INFLAMMATORY\",\n    \"ALLOGENEIC_HSCT\": \"TRANSPLANT\",\n    \"SOLID_ORGAN_TRANSPLANT\": \"TRANSPLANT\",\n    \"INFECTIOUS_DISEASE\": \"ACUTE_OR_INFECTIOUS\",\n    \"INFANT_CMV\": \"ACUTE_OR_INFECTIOUS\",\n    \"EPILEPSY\": \"NEUROLOGIC\",\n    \"FEBRILE_SEIZURE\": \"NEUROLOGIC\",\n    \"CEREBRAL_PALSY\": \"NEUROLOGIC\",\n    \"NEONATAL_INTRACRANIAL_HEMORRHAGE\": \"NEUROLOGIC\",\n    \"CONGENITAL_HEART_DISEASE\": \"CARDIOPULMONARY\",\n    \"PRETERM\": \"PREMATURITY\",\n}\n\nHIGH_RISK_DOMAINS = {\n    \"HEMATOLOGIC_MALIGNANCY\", \"SOLID_MALIGNANCY\",\n    \"PRIMARY_OR_SECONDARY_IMMUNODEFICIENCY\", \"TRANSPLANT\",\n}\n\nTREATMENT_DEPENDENCIES = {\n    \"HEMATOLOGIC_MALIGNANCY\": [\"化疗或放疗阶段\", \"疾病缓解状态\", \"免疫功能恢复情况\"],\n    \"SOLID_MALIGNANCY\": [\"是否已开始化疗、放疗、免疫治疗或其他免疫抑制治疗\", \"当前治疗阶段\", \"肿瘤控制情况\"],\n    \"AUTOIMMUNE_OR_INFLAMMATORY\": [\"疾病目前处于活动期还是稳定期\", \"当前及近期激素剂量、免疫抑制剂和生物制剂\"],\n    \"TRANSPLANT\": [\"移植类型和日期\", \"目前是否仍使用免疫抑制药物\", \"医生是否已评估免疫功能恢复\"],\n    \"ACUTE_OR_INFECTIOUS\": [\"目前是否仍发热或有明显急性症状\", \"病情是否已经稳定或恢复\"],\n}\n\nEVIDENCE_REGISTRY = {\n    \"CDC_ANTIBODY_PRODUCTS\": {\"title\": \"CDC：疫苗与含抗体制品的间隔（补充证据）\", \"url\": \"https://www.cdc.gov/vaccines/hcp/imz-best-practices/timing-spacing-immunobiologics.html\", \"section\": \"Spacing of vaccines and antibody-containing products\", \"verified_source\": True},\n    \"CN_NIP_2026\": {\"title\": \"国家免疫规划疫苗儿童免疫程序及说明（2026年版）\", \"url\": \"https://www.ndcpa.gov.cn/jbkzzx/c100014/2073005020766703616/BXZA3kH5.pdf\"},\n    \"CN_AUTOIMMUNE_2019\": {\"title\": \"特殊健康状态儿童预防接种专家共识之十五：自身免疫性疾病与预防接种\", \"category\": \"AUTOIMMUNE_DISEASE\", \"url\": \"https://doi.org/10.19538/j.ek2019030605\"},\n    \"CN_LEUKEMIA_CHEMO_2019\": {\"title\": \"特殊健康状态儿童预防接种专家共识之十七：白血病化疗与预防接种\", \"category\": \"LEUKEMIA_CHEMOTHERAPY\", \"url\": \"https://doi.org/10.19538/j.ek2019040604\"},\n    \"CN_IMMUNOSUPPRESSANT_2019\": {\"title\": \"特殊健康状态儿童预防接种专家共识之十九：免疫抑制剂与预防接种\", \"category\": \"IMMUNOSUPPRESSANT_USE\", \"url\": \"https://doi.org/10.19538/j.ek2019050602\"},\n    \"CN_IVIG_2019\": {\"title\": \"特殊健康状态儿童预防接种专家共识之二十：静脉注射免疫球蛋白使用者的预防接种\", \"category\": \"IVIG_USE\", \"url\": \"https://doi.org/10.19538/j.ek2019050603\"},\n    \"CN_ALLO_HSCT_2019\": {\"title\": \"特殊健康状态儿童预防接种专家共识之二十三：异体造血干细胞移植与预防接种\", \"category\": \"ALLOGENEIC_HSCT\", \"hsct_type\": \"ALLOGENEIC\", \"url\": \"https://doi.org/10.19538/j.ek2019070602\"},\n    \"CN_SOLID_ORGAN_TRANSPLANT_2019\": {\"title\": \"特殊健康状态儿童预防接种专家共识之二十四：实体器官移植与预防接种\", \"category\": \"SOLID_ORGAN_TRANSPLANT\", \"url\": \"https://doi.org/10.19538/j.ek2019070603\"},\n    \"CN_EPILEPSY_2019\": {\"title\": \"特殊健康状态儿童预防接种专家共识之八：癫痫与预防接种\", \"category\": \"EPILEPSY\", \"url\": \"https://doi.org/10.19538/j.ek2019020602\"},\n    \"CN_CHD_2019\": {\"title\": \"特殊健康状态儿童预防接种专家共识之五：先天性心脏病与预防接种\", \"category\": \"CONGENITAL_HEART_DISEASE\", \"url\": \"https://doi.org/10.19538/j.ek2019010602\"},\n    \"CN_PRETERM_2018\": {\"title\": \"特殊健康状态儿童预防接种专家共识之一：早产儿与预防接种\", \"category\": \"PRETERM\", \"url\": \"https://doi.org/10.19538/j.ek2018100601\"},\n    \"CN_INFECTIOUS_2019\": {\"title\": \"特殊健康状态儿童预防接种专家共识之十二：感染性疾病与预防接种\", \"category\": \"INFECTIOUS_DISEASE\", \"section\": \"3 接种建议\", \"location\": \"PDF第1-2页\"},\n    \"CN_GD_TUMOR_2020\": {\"title\": \"特殊状态儿童预防接种（广东）专家共识：肿瘤患儿章节\", \"risk_domain\": \"MALIGNANCY\", \"section\": \"3 肿瘤患儿的预防接种\", \"location\": \"第3章及表4\", \"url\": \"https://seleguide.yiigle.com/uploads/guide_html/%E7%89%B9%E6%AE%8A%E7%8A%B6%E6%80%81%E5%84%BF%E7%AB%A5%E9%A2%84%E9%98%B2%E6%8E%A5%E7%A7%8D(%E5%B9%BF%E4%B8%9C)%E4%B8%93%E5%AE%B6%E5%85%B1%E8%AF%86.html\"},\n    \"CN_GD_HCT_2020\": {\"title\": \"特殊状态儿童预防接种（广东）专家共识：HCT章节\", \"risk_domain\": \"TRANSPLANT\", \"section\": \"7 HCT的预防接种\", \"location\": \"第7章及表7\", \"url\": \"https://seleguide.yiigle.com/uploads/guide_html/%E7%89%B9%E6%AE%8A%E7%8A%B6%E6%80%81%E5%84%BF%E7%AB%A5%E9%A2%84%E9%98%B2%E6%8E%A5%E7%A7%8D(%E5%B9%BF%E4%B8%9C)%E4%B8%93%E5%AE%B6%E5%85%B1%E8%AF%86.html\"},\n}\n\n# 这是对仓库中26份已核验PDF的静态清单。每个ID都对应真实文件，禁止在检索时\n# 根据疾病名称临时拼出来源标题。\nSPECIAL_EVIDENCE_INDEX = {\n    \"PRETERM\": (\"CN_PRETERM_2018\", \"01_早产儿与预防接种.pdf\"),\n    \"ASTHMA\": (\"CN_ASTHMA_2018\", \"02_支气管哮喘与预防接种.pdf\"),\n    \"PRIMARY_IMMUNODEFICIENCY\": (\"CN_PID_2018\", \"03_原发性免疫缺陷病的预防接种.pdf\"),\n    \"FOOD_ALLERGY\": (\"CN_FOOD_ALLERGY_2018\", \"04_食物过敏与预防接种.pdf\"),\n    \"CONGENITAL_HEART_DISEASE\": (\"CN_CHD_2019\", \"05_先天性心脏病与预防接种.pdf\"),\n    \"ECZEMA\": (\"CN_ECZEMA_2019\", \"06_湿疹与预防接种.pdf\"),\n    \"FEBRILE_SEIZURE\": (\"CN_FEBRILE_SEIZURE_2019\", \"07_热性惊厥与预防接种.pdf\"),\n    \"EPILEPSY\": (\"CN_EPILEPSY_2019\", \"08_癫痫与预防接种.pdf\"),\n    \"CEREBRAL_PALSY\": (\"CN_CEREBRAL_PALSY_2019\", \"09_脑性瘫痪与预防接种.pdf\"),\n    \"NEONATAL_INTRACRANIAL_HEMORRHAGE\": (\"CN_NEONATAL_ICH_2019\", \"10_新生儿颅内出血与预防接种.pdf\"),\n    \"INFANT_JAUNDICE\": (\"CN_INFANT_JAUNDICE_2019\", \"11_婴儿黄疸与预防接种.pdf\"),\n    \"INFECTIOUS_DISEASE\": (\"CN_INFECTIOUS_2019\", \"12_感染性疾病与预防接种.pdf\"),\n    \"PERIANAL_ABSCESS\": (\"CN_PERIANAL_ABSCESS_2019\", \"13_肛周脓肿与预防接种.pdf\"),\n    \"IGA_VASCULITIS\": (\"CN_IGA_VASCULITIS_2019\", \"14_IgA血管炎与预防接种.pdf\"),\n    \"AUTOIMMUNE_DISEASE\": (\"CN_AUTOIMMUNE_2019\", \"15_自身免疫性疾病与预防接种.pdf\"),\n    \"KIDNEY_DISEASE\": (\"CN_KIDNEY_DISEASE_2019\", \"16_肾脏疾病与预防接种.pdf\"),\n    \"LEUKEMIA_CHEMOTHERAPY\": (\"CN_LEUKEMIA_CHEMO_2019\", \"17_白血病化疗与预防接种.pdf\"),\n    \"ANEMIA\": (\"CN_ANEMIA_2019\", \"18_儿童贫血与预防接种.pdf\"),\n    \"IMMUNOSUPPRESSANT_USE\": (\"CN_IMMUNOSUPPRESSANT_2019\", \"19_免疫抑制剂与预防接种.pdf\"),\n    \"IVIG_USE\": (\"CN_IVIG_2019\", \"20_静脉注射免疫球蛋白使用者的预防接种.pdf\"),\n    \"INHERITED_METABOLIC_DISEASE\": (\"CN_METABOLIC_DISEASE_2019\", \"21_遗传代谢病与预防接种.pdf\"),\n    \"LIVER_DISEASE\": (\"CN_LIVER_DISEASE_2019\", \"22_儿童肝病与预防接种.pdf\"),\n    \"ALLOGENEIC_HSCT\": (\"CN_ALLO_HSCT_2019\", \"23_异体造血干细胞移植与预防接种.pdf\"),\n    \"SOLID_ORGAN_TRANSPLANT\": (\"CN_SOLID_ORGAN_TRANSPLANT_2019\", \"24_实体器官移植与预防接种.pdf\"),\n    \"INFANT_CMV\": (\"CN_INFANT_CMV_2019\", \"25_婴儿巨细胞病毒感染与预防接种.pdf\"),\n    \"CHROMOSOMAL_DISEASE\": (\"CN_CHROMOSOMAL_DISEASE_2019\", \"26_常见染色体病与预防接种.pdf\"),\n}\n_special_category_names = {category_id: category_name for category_id, category_name, _ in SPECIAL_HEALTH_CATEGORIES}\nfor _category_id, (_evidence_id, _file_name) in SPECIAL_EVIDENCE_INDEX.items():\n    EVIDENCE_REGISTRY.setdefault(_evidence_id, {\n        \"title\": f\"特殊健康状态儿童预防接种专家共识：{_special_category_names[_category_id]}\",\n        \"category\": _category_id,\n        \"section\": \"3 接种建议\",\n        \"location\": \"对应共识接种建议章节\",\n        \"local_path\": f\"knowledge_base/B_中国特殊健康状态_共识/{_file_name}\",\n        \"verified_source\": True,\n    })\n    EVIDENCE_REGISTRY[_evidence_id].setdefault(\"local_path\", f\"knowledge_base/B_中国特殊健康状态_共识/{_file_name}\")\n    EVIDENCE_REGISTRY[_evidence_id].setdefault(\"verified_source\", True)\n\n\ndef _fields(text):\n    # Only known top-level labels start a field. Colon-bearing report lines and\n    # medication details belong to their containing textarea, never a new field.\n    values = {}\n    current = None\n    labels = r\"年龄或出生日期|年龄|出生日期|性别|主要诊断和当前病情|主要诊断及当前健康状况|疾病及当前健康状况|诊断|疾病|病情|近期用药或治疗|近1年用药及治疗|近一年用药及治疗|用药|治疗|免疫功能及相关检查结果|免疫功能及相关检查|接种记录|接种史|接种记录结构化JSON|严重过敏、接种后异常反应和其他说明|过敏、接种后异常反应和其他说明|其他|评估日期|评测日期|参考日期\"\n    for line in (text or \"\").splitlines():\n        match = re.match(r\"^\\s*(\" + labels + r\"|主要疾病和目前情况)(?:[（(][^）)]*[）)])?[：:]\\s*(.*)$\", line)\n        if match:\n            current = match.group(1).strip()\n            values[current] = match.group(2).strip()\n        elif current:\n            values[current] += \"\\n\" + line.strip()\n    return values\n\n\ndef _field(fields, *keys):\n    for name, value in fields.items():\n        if value and any(key in name for key in keys):\n            return value\n    return \"\"\n\n\ndef _exact_field(fields, name):\n    return fields.get(name, \"\")\n\n\ndef _chinese_integer(value):\n    digits = {\"零\": 0, \"〇\": 0, \"一\": 1, \"二\": 2, \"两\": 2, \"三\": 3, \"四\": 4, \"五\": 5,\n              \"六\": 6, \"七\": 7, \"八\": 8, \"九\": 9}\n    value = (value or \"\").strip()\n    if not value:\n        return None\n    if value in digits:\n        return digits[value]\n    if \"十\" in value:\n        left, right = value.split(\"十\", 1)\n        tens = digits.get(left, 1) if left else 1\n        ones = digits.get(right, 0) if right else 0\n        return tens * 10 + ones\n    return None\n\n\ndef _age_number(value):\n    if not value:\n        return None\n    if re.fullmatch(r\"\\d+(?:\\.\\d+)?\", value):\n        return float(value)\n    return _chinese_integer(value)\n\n\ndef _age_months(value):\n    value = (value or \"\").strip().translate(str.maketrans(\"０１２３４５６７８９．\", \"0123456789.\"))\n    birth = re.search(r\"(19\\d{2}|20\\d{2})[年\\-/.](\\d{1,2})[月\\-/.](\\d{1,2})\", value)\n    if not birth:\n        compact = re.search(r\"(?<!\\d)(19\\d{6}|20\\d{6})(?!\\d)\", value)\n        if compact:\n            birth = re.match(r\"(\\d{4})(\\d{2})(\\d{2})\", compact.group(1))\n    if birth:\n        try:\n            born = date(*map(int, birth.groups()))\n            today = _today()\n            months = (today.year - born.year) * 12 + today.month - born.month\n            months -= today.day < born.day\n            return months if 0 <= months <= 216 else None\n        except ValueError:\n            return None\n    number_pattern = r\"(\\d+(?:\\.\\d+)?|[零〇一二两三四五六七八九十]+)\"\n    years = re.search(number_pattern + r\"\\s*(?:周?岁|年)\", value)\n    extra_months = re.search(number_pattern + r\"\\s*(?:个?月|月龄|月大)\", value)\n    if years or extra_months:\n        years_value = _age_number(years.group(1)) if years else 0\n        months_value = _age_number(extra_months.group(1)) if extra_months else 0\n        if years_value is None or months_value is None:\n            return None\n        total = int(float(years_value) * 12) + int(months_value)\n        if years and re.search(r\"岁\\s*半|年\\s*半\", value):\n            total += 6\n        return total if 0 <= total <= 216 else None\n    weeks = re.search(number_pattern + r\"\\s*(?:周龄|周大|周)(?!岁)\", value)\n    days = re.search(number_pattern + r\"\\s*(?:日龄|天大|天)\", value)\n    if weeks or days:\n        week_value = _age_number(weeks.group(1)) if weeks else 0\n        day_value = _age_number(days.group(1)) if days else 0\n        if week_value is None or day_value is None:\n            return None\n        total_days = int(week_value) * 7 + int(day_value)\n        return min(total_days // 30, 216)\n    return None\n\n\ndef _record_mode(record):\n    if not record or re.fullmatch(r\"\\s*(?:未知|不详|不清楚|未填写|无记录|接种证遗失|记不清)\\s*\", record):\n        return \"UNKNOWN\"\n    # 前端会同时发送结构化 record_state；保留这条文本兜底，避免工作流变量\n    # 接线遗漏时把“接种证完整录入”降级成 PARTIAL，进而把所有未列项目\n    # 错写成“需要核对接种记录”。\n    if re.search(r\"接种证(?:已)?完整录入|以上为接种证全部记录|未列项目无接种记录\", record):\n        return \"COMPLETE\"\n    if _nip_completion_cutoff(record) is not None:\n        return \"NIP_COMPLETE_TO_AGE\"\n    if re.search(r\"国家免疫规划.{0,12}(?:已按程序完成|已完成|全程完成)|(?:已按程序完成|已完成|全程完成).{0,12}国家免疫规划\", record):\n        return \"NIP_COMPLETE\"\n    return \"PARTIAL\"\n\n\ndef _nip_completion_cutoff(record):\n    patterns = [\n        r\"(?:已按程序)?完成\\s*(\\d+)\\s*(?:周?岁|年)前.{0,12}国家免疫规划\",\n        r\"国家免疫规划.{0,12}(?:已按程序)?完成\\s*(\\d+)\\s*(?:周?岁|年)前\",\n        r\"(?:已按程序)?完成\\s*(\\d+)\\s*(?:个?月|月龄)前.{0,12}国家免疫规划\",\n        r\"国家免疫规划.{0,12}(?:已按程序)?完成\\s*(\\d+)\\s*(?:个?月|月龄)前\",\n        r\"(?:已按时|已按程序)?完成.{0,100}?(\\d+)\\s*(?:周?岁|年)(?:前|及以前)?(?:的)?国家免疫规划疫苗?\",\n    ]\n    for index, pattern in enumerate(patterns):\n        match = re.search(pattern, record or \"\")\n        if match:\n            value = int(match.group(1))\n            return value * 12 if index < 2 or index == 4 else value\n    return None\n\n\ndef _dose_number_value(value):\n    digit_words = {\"一\": 1, \"二\": 2, \"两\": 2, \"三\": 3, \"四\": 4, \"五\": 5, \"六\": 6, \"七\": 7, \"八\": 8, \"九\": 9, \"十\": 10}\n    value = str(value or \"\").strip()\n    return int(value) if value.isdigit() else digit_words.get(value)\n\n\ndef _dose_expression(text):\n    \"\"\"返回记录强度。提及名称只证明接种过，绝不自动等于完成全程。\"\"\"\n    if not text:\n        return {\"kind\": \"UNMENTIONED\", \"doses\": None, \"missing\": None}\n    if re.search(r\"未知|不清|记不清|剂次不明|未填写\", text):\n        return {\"kind\": \"UNKNOWN\", \"doses\": None, \"missing\": None}\n    missing = re.search(r\"第?\\s*([一二两三四五六七八九十\\d]+)\\s*(?:针|剂).{0,10}(?:未接种|没打|漏种|未完成)\", text)\n    if missing:\n        dose = _dose_number_value(missing.group(1))\n        return {\"kind\": \"EXPLICIT_MISSING\", \"doses\": max(dose - 1, 0), \"missing\": dose}\n    if re.search(r\"从未接种|未接种|没打过|零剂\", text):\n        return {\"kind\": \"EXPLICIT_MISSING\", \"doses\": 0, \"missing\": 1}\n    count = re.search(r\"(?:已接种|接种|完成|打过)\\s*([一二两三四五六七八九十\\d]+)\\s*(?:针|剂)\", text)\n    if not count:\n        count = re.search(r\"([一二两三四五六七八九十\\d]+)\\s*(?:针|剂).{0,8}(?:已接种|已完成|打过)\", text)\n    if not count:\n        # 接种史字段中的“乙肝3针”“五联三剂”本身就是明确剂次数。\n        count = re.search(r\"(?<!第)([一二两三四五六七八九十\\d]+)\\s*(?:针|剂)\", text)\n    if count:\n        return {\"kind\": \"COUNTED\", \"doses\": _dose_number_value(count.group(1)), \"missing\": None}\n    if re.search(r\"已完成|全程|按程序完成\", text):\n        return {\"kind\": \"COMPLETE\", \"doses\": None, \"missing\": None}\n    return {\"kind\": \"ANY_DOSE\", \"doses\": None, \"missing\": None}\n\n\ndef _parse_dates(text):\n    dates = []\n    for year, month, day in re.findall(r\"(20\\d{2})[年\\-/.](\\d{1,2})[月\\-/.](\\d{1,2})日?\", text or \"\"):\n        try:\n            dates.append(date(int(year), int(month), int(day)).isoformat())\n        except ValueError:\n            pass\n    return list(dict.fromkeys(dates))\n\n\ndef _product_definitions():\n    definitions = [\n        {\"id\": \"five_in_one\", \"name\": \"五联疫苗\", \"pattern\": r\"五联(?:疫苗)?\", \"components\": [\"dtap\", \"polio\", \"hib\"], \"combination\": True},\n        {\"id\": \"four_in_one\", \"name\": \"四联疫苗\", \"pattern\": r\"四联(?:疫苗)?\", \"components\": [\"dtap\", \"hib\"], \"combination\": True},\n        {\"id\": \"six_in_one\", \"name\": \"六联疫苗\", \"pattern\": r\"六联(?:疫苗)?\", \"components\": [\"dtap\", \"polio\", \"hib\", \"hep_b\"], \"combination\": True},\n        {\"id\": \"men_hib\", \"name\": \"A群C群流脑-Hib联合疫苗\", \"pattern\": r\"(?:AC|A群C群).{0,8}(?:流脑|脑膜炎球菌).{0,8}Hib\", \"components\": [\"meningococcal\", \"hib\"], \"combination\": True},\n        {\"id\": \"hep_ab\", \"name\": \"甲乙肝联合疫苗\", \"pattern\": r\"甲乙肝联合(?:疫苗)?|甲型乙型肝炎联合疫苗\", \"components\": [\"hep_a\", \"hep_b\"], \"combination\": True},\n        {\"id\": \"ppsv23\", \"name\": \"23价肺炎球菌多糖疫苗\", \"pattern\": r\"23价肺炎球菌(?:多糖)?疫苗|PPSV[-—]?23\", \"components\": [\"ppsv23\"]},\n        {\"id\": \"pcv\", \"name\": \"肺炎球菌疫苗\", \"pattern\": r\"(?:(?:13|15|20)价)?肺炎球菌结合疫苗|PCV(?:13|15|20)?|肺炎疫苗|肺炎(?=\\s*[一二两三四五六七八九十\\d]+\\s*(?:针|剂))\", \"components\": [\"pcv\"], \"product_unknown\": True},\n        {\"id\": \"hep_b\", \"name\": \"乙肝疫苗\", \"pattern\": r\"乙肝(?:疫苗)?\", \"components\": [\"hep_b\"]},\n        {\"id\": \"bcg\", \"name\": \"卡介苗\", \"pattern\": r\"卡介苗\", \"components\": [\"bcg\"]},\n        {\"id\": \"ipv\", \"name\": \"脊灰灭活疫苗（IPV）\", \"pattern\": r\"脊(?:髓灰质炎|灰)灭活疫苗|(?<![A-Za-z])IPV(?![A-Za-z])\", \"components\": [\"polio\"]},\n        {\"id\": \"bopv\", \"name\": \"脊灰减毒活疫苗（bOPV）\", \"pattern\": r\"脊(?:髓灰质炎|灰)减毒活疫苗|(?<![A-Za-z])b?OPV(?![A-Za-z])\", \"components\": [\"polio\"]},\n        {\"id\": \"polio\", \"name\": \"脊灰疫苗\", \"pattern\": r\"脊(?:髓灰质炎|灰)(?:疫苗)?\", \"components\": [\"polio\"], \"product_unknown\": True},\n        {\"id\": \"dtap\", \"name\": \"百白破疫苗\", \"pattern\": r\"百白破(?:疫苗)?\", \"components\": [\"dtap\"]},\n        {\"id\": \"dt\", \"name\": \"白破疫苗（DT）\", \"pattern\": r\"(?<!百)白破(?:疫苗)?|\\bDT\\b\", \"components\": [\"dtap\"]},\n        {\"id\": \"mmr\", \"name\": \"麻腮风疫苗\", \"pattern\": r\"麻腮风(?:疫苗)?|MMR\", \"components\": [\"mmr\"]},\n        {\"id\": \"je_live\", \"name\": \"乙脑减毒活疫苗\", \"pattern\": r\"乙脑减毒活疫苗|JE[-—]?L\", \"components\": [\"je\"], \"live\": True},\n        {\"id\": \"je_inactivated\", \"name\": \"乙脑灭活疫苗\", \"pattern\": r\"乙脑灭活疫苗|JE[-—]?I\", \"components\": [\"je\"]},\n        {\"id\": \"je\", \"name\": \"乙脑疫苗\", \"pattern\": r\"乙脑(?:疫苗)?\", \"components\": [\"je\"], \"product_unknown\": True},\n        {\"id\": \"mpcv_acyw\", \"name\": \"ACYW群流脑结合疫苗\", \"pattern\": r\"ACYW(?:135)?群?(?:流脑|脑膜炎球菌)(?:多糖)?结合疫苗|MPCV[-—]?ACYW\", \"components\": [\"meningococcal\", \"mpcv_acyw\"]},\n        {\"id\": \"mpsv_acyw\", \"name\": \"ACYW群流脑多糖疫苗\", \"pattern\": r\"ACYW(?:135)?群?(?:流脑|脑膜炎球菌)多糖疫苗|MPSV[-—]?ACYW\", \"components\": [\"meningococcal\", \"mpsv_acyw\"]},\n        {\"id\": \"mpcv_ac\", \"name\": \"A群C群流脑结合疫苗\", \"pattern\": r\"A群C群(?:流脑|脑膜炎球菌)(?:多糖)?结合疫苗|MPCV[-—]?AC\", \"components\": [\"meningococcal\", \"mpcv_ac\"]},\n        {\"id\": \"mpsv_ac\", \"name\": \"A群C群流脑多糖疫苗\", \"pattern\": r\"A群C群(?:流脑|脑膜炎球菌)多糖疫苗|MPSV[-—]?AC\", \"components\": [\"meningococcal\"]},\n        {\"id\": \"men_ac_unknown\", \"name\": \"A群C群流脑疫苗（剂型待核实）\", \"pattern\": r\"A\\s*\\+\\s*C(?:流脑(?:疫苗)?)?\", \"components\": [\"meningococcal\"], \"product_unknown\": True},\n        {\"id\": \"mpsv_a\", \"name\": \"A群流脑多糖疫苗\", \"pattern\": r\"A群(?:流脑|脑膜炎球菌)多糖疫苗|MPSV[-—]?A(?!C)\", \"components\": [\"meningococcal\"]},\n        {\"id\": \"meningococcal\", \"name\": \"流脑疫苗\", \"pattern\": r\"流脑(?:疫苗)?|脑膜炎球菌疫苗\", \"components\": [\"meningococcal\"], \"product_unknown\": True},\n        {\"id\": \"hep_a_live\", \"name\": \"甲肝减毒活疫苗\", \"pattern\": r\"甲肝减毒活疫苗|HepA[-—]?L\", \"components\": [\"hep_a\"], \"live\": True},\n        {\"id\": \"hep_a_inactivated\", \"name\": \"甲肝灭活疫苗\", \"pattern\": r\"甲肝灭活疫苗|HepA[-—]?I\", \"components\": [\"hep_a\"]},\n        {\"id\": \"hep_a\", \"name\": \"甲肝疫苗\", \"pattern\": r\"甲肝(?:疫苗)?\", \"components\": [\"hep_a\"], \"product_unknown\": True},\n        {\"id\": \"hpv2_nip\", \"name\": \"国家免疫规划双价HPV疫苗\", \"pattern\": r\"国家免疫规划双价HPV疫苗|双价HPV疫苗|2价HPV疫苗\", \"components\": [\"hpv_nip\"]},\n        {\"id\": \"hpv4\", \"name\": \"四价HPV疫苗\", \"pattern\": r\"四价HPV疫苗|4价HPV疫苗\", \"components\": [\"hpv4\"]},\n        {\"id\": \"hpv9\", \"name\": \"九价HPV疫苗\", \"pattern\": r\"九价HPV疫苗|9价HPV疫苗\", \"components\": [\"hpv9\"]},\n        {\"id\": \"hpv_nip\", \"name\": \"HPV疫苗\", \"pattern\": r\"HPV疫苗|人乳头瘤病毒疫苗\", \"components\": [\"hpv_nip\"], \"product_unknown\": True},\n        {\"id\": \"flu\", \"name\": \"流感疫苗\", \"pattern\": r\"流感疫苗\", \"components\": [\"flu\"]},\n        {\"id\": \"varicella\", \"name\": \"水痘疫苗\", \"pattern\": r\"水痘疫苗\", \"components\": [\"varicella\"]},\n        {\"id\": \"hib\", \"name\": \"Hib疫苗\", \"pattern\": r\"Hib疫苗|乙型流感嗜血杆菌疫苗\", \"components\": [\"hib\"]},\n        {\"id\": \"rotavirus\", \"name\": \"轮状病毒疫苗\", \"pattern\": r\"轮状病毒疫苗|轮状疫苗\", \"components\": [\"rotavirus\"]},\n        {\"id\": \"ev71\", \"name\": \"EV71灭活疫苗\", \"pattern\": r\"EV71(?:灭活)?疫苗|肠道病毒71型灭活疫苗|手足口疫苗\", \"components\": [\"ev71\"]},\n    ]\n    return definitions\n\n\ndef _administration_records(record):\n    candidates = []\n    for order, product in enumerate(_product_definitions()):\n        for match in re.finditer(product[\"pattern\"], record or \"\", re.I):\n            candidates.append((match.start(), match.end(), order, product, match.group(0)))\n    candidates.sort(key=lambda item: (item[0], -(item[1] - item[0]), item[2]))\n    selected = []\n    for candidate in candidates:\n        if selected and candidate[0] < selected[-1][1]:\n            continue\n        selected.append(candidate)\n    events = []\n    seen_clause_products = set()\n    for index, (start, end, _, product, matched_name) in enumerate(selected):\n        next_start = selected[index + 1][0] if index + 1 < len(selected) else len(record or \"\")\n        # Section labels (脊灰：脊灰1...) do not represent administrations.\n        if index + 1 < len(selected) and selected[index + 1][3][\"id\"] == product[\"id\"] and re.fullmatch(r\"\\s*(?:[（(][^）)]*[）)])?\\s*[：:]\\s*|\\s*\", (record or \"\")[end:next_start]):\n            continue\n        # Keep polarity/dose words immediately before the vaccine name. Starting at the\n        # product match would turn “未接种EV71疫苗” into the positive phrase “EV71疫苗”.\n        clause_start = max(((record or \"\").rfind(delimiter, 0, start) for delimiter in \"、，,；;。\\n\"), default=-1) + 1\n        clause_key = (clause_start, product[\"id\"])\n        # A displayed name such as “脊灰灭活疫苗（IPV）” contains both a Chinese\n        # name and its acronym. They describe one record and must emit one event.\n        if clause_key in seen_clause_products:\n            continue\n        seen_clause_products.add(clause_key)\n        segment = (record or \"\")[clause_start:next_start].strip(\" 、，,；;。\\n\")\n        fact = _dose_expression(segment)\n        # A common compact record names the vaccine once and then lists several\n        # numbered administrations, for example:\n        # “乙肝第1剂2024-09-01、第2剂2024-10-01、第3剂2025-03-01”.\n        # Preserve every numbered administration instead of degrading the whole\n        # clause to ANY_DOSE merely because the vaccine name is not repeated.\n        numbered_pairs = []\n        for dose_text, dose_date in re.findall(\n            r\"(?:第\\s*)?([一二两三四五六七八九十\\d]+)\\s*(?:针|剂)\\s*[:：]?\\s*\"\n            r\"((?:19|20)\\d{2}[年\\-/.]\\d{1,2}[月\\-/.]\\d{1,2}日?)\",\n            segment,\n        ):\n            dose_number = _dose_number_value(dose_text)\n            parsed = _parse_dates(dose_date)\n            if dose_number and 1 <= dose_number <= 10 and parsed:\n                numbered_pairs.append({\"dose_number\": dose_number, \"date\": parsed[0]})\n        unique_numbered_pairs = []\n        seen_numbered_pairs = set()\n        for row in numbered_pairs:\n            key = (row[\"dose_number\"], row[\"date\"])\n            if key not in seen_numbered_pairs:\n                seen_numbered_pairs.add(key)\n                unique_numbered_pairs.append(row)\n        numbered_pairs = unique_numbered_pairs\n        if len(numbered_pairs) >= 2:\n            fact = {\"kind\": \"COUNTED\", \"doses\": len(numbered_pairs), \"missing\": None}\n        # “脊灰1 2020-03-01”“A+C2 2021-03-01”中的数字是剂次编号。\n        # 产品类型未知不影响剂次编号本身的确定性。\n        numbered_match = re.search(\n            re.escape(matched_name) + r\"\\s*(?:第)?([一二两三四五六七八九十\\d]+)(?!\\s*(?:针|剂))\",\n            segment,\n            re.I,\n        )\n        explicit_dose_number = _dose_number_value(numbered_match.group(1)) if numbered_match else None\n        if explicit_dose_number and not 1 <= explicit_dose_number <= 10:\n            explicit_dose_number = None\n        if explicit_dose_number and fact[\"kind\"] == \"ANY_DOSE\":\n            fact = {\"kind\": \"COUNTED\", \"doses\": 1, \"missing\": None}\n        if product[\"id\"] == \"bcg\" and fact[\"kind\"] == \"ANY_DOSE\":\n            fact = {\"kind\": \"COUNTED\", \"doses\": 1, \"missing\": None}\n        dates = [row[\"date\"] for row in numbered_pairs] if len(numbered_pairs) >= 2 else _parse_dates(segment)\n        dose_events = numbered_pairs if len(numbered_pairs) >= 2 else ([{\"dose_number\": explicit_dose_number, \"date\": dates[0]}] if explicit_dose_number and dates else [])\n        events.append({\n            \"event_id\": f\"history_{index + 1}\", \"source_text\": segment, \"source_name\": matched_name,\n            \"product_id\": product[\"id\"], \"normalized_name\": product[\"name\"], \"components\": product[\"components\"],\n            \"combination\": bool(product.get(\"combination\")), \"product_unknown\": bool(product.get(\"product_unknown\")),\n            **fact, \"dates\": dates,\n            \"numbered_dose\": explicit_dose_number if fact.get(\"doses\") == 1 else None,\n            \"dose_events\": dose_events,\n            \"date_status\": \"COMPLETE\" if fact.get(\"doses\") and len(dates) >= fact[\"doses\"] else \"MISSING_OR_INCOMPLETE\",\n        })\n    # Keep numbered administrations as one sequence, validating intervals across\n    # all rows rather than declaring each isolated date valid independently.\n    grouped, output = {}, []\n    for event in events:\n        if not event.get(\"numbered_dose\"):\n            output.append(event)\n            continue\n        product_id = event[\"product_id\"]\n        if product_id not in grouped:\n            merged = dict(event)\n            merged.update(doses=0, dates=[], dose_events=[], source_text=\"\", numbered_sequence=True)\n            grouped[product_id] = merged\n            output.append(merged)\n        merged = grouped[product_id]\n        merged[\"doses\"] += 1\n        merged[\"dates\"].extend(event[\"dates\"])\n        merged[\"dose_events\"].append({\"dose_number\": event[\"numbered_dose\"], \"date\": event[\"dates\"][0] if event[\"dates\"] else None})\n        merged[\"source_text\"] += (\"；\" if merged[\"source_text\"] else \"\") + event[\"source_text\"]\n        merged[\"date_status\"] = \"COMPLETE\" if len(merged[\"dates\"]) == merged[\"doses\"] else \"MISSING_OR_INCOMPLETE\"\n    return output\n\n\ndef _structured_history_payload(raw_value):\n    if not raw_value:\n        return {\"status\": \"ABSENT\", \"record_state\": None, \"events\": [], \"free_text\": \"\", \"rejected\": []}\n    try:\n        value = json.loads(raw_value)\n    except (TypeError, ValueError):\n        return {\"status\": \"INVALID_JSON\", \"record_state\": None, \"events\": [], \"free_text\": \"\", \"rejected\": [\"invalid_json\"]}\n    if not isinstance(value, dict) or value.get(\"schema_version\") != \"vaccination_history_v2\":\n        return {\"status\": \"INVALID_SCHEMA\", \"record_state\": None, \"events\": [], \"free_text\": \"\", \"rejected\": [\"invalid_schema\"]}\n    products = {item[\"id\"]: item for item in _product_definitions()}\n    product_aliases = {\n        \"pentavalent\": \"five_in_one\", \"five_in_one_vaccine\": \"five_in_one\",\n        \"hexavalent\": \"six_in_one\", \"quadrivalent_combination\": \"four_in_one\",\n    }\n    accepted = []\n    rejected = []\n    for index, item in enumerate(value.get(\"events\", []) if isinstance(value.get(\"events\"), list) else []):\n        raw_product_id = item.get(\"product_id\") if isinstance(item, dict) else None\n        product_id = product_aliases.get(raw_product_id, raw_product_id)\n        if not isinstance(item, dict) or product_id not in products:\n            rejected.append(f\"event_{index}_invalid_product\")\n            continue\n        product = products[product_id]\n        kind = str(item.get(\"history_state\") or \"UNKNOWN\").upper()\n        if kind == \"MENTIONED\":\n            kind = \"ANY_DOSE\"\n        if kind not in {\"COUNTED\", \"ANY_DOSE\", \"COMPLETE\", \"EXPLICIT_MISSING\", \"UNKNOWN\"}:\n            rejected.append(f\"event_{index}_invalid_state\")\n            continue\n        dose_count = item.get(\"dose_count\")\n        if dose_count is not None and (not isinstance(dose_count, int) or not 0 <= dose_count <= 10):\n            rejected.append(f\"event_{index}_invalid_dose_count\")\n            continue\n        dose_rows = item.get(\"doses\") if isinstance(item.get(\"doses\"), list) else []\n        dates = []\n        dose_events = []\n        for dose_index, dose_row in enumerate(dose_rows, 1):\n            if not isinstance(dose_row, dict):\n                continue\n            date_value = str(dose_row.get(\"date\") or \"\").strip()\n            parsed_dates = _parse_dates(date_value)\n            parsed_date = parsed_dates[0] if parsed_dates else None\n            if parsed_date:\n                dates.append(parsed_date)\n            dose_events.append({\"dose_number\": int(dose_row.get(\"dose_number\") or dose_index), \"date\": parsed_date})\n        if kind == \"EXPLICIT_MISSING\" and dose_count is None:\n            dose_count = 0\n        accepted.append({\n            \"event_id\": str(item.get(\"event_id\") or f\"structured_history_{index + 1}\"),\n            \"source_text\": str(item.get(\"display_name\") or product[\"name\"]),\n            \"source_name\": str(item.get(\"display_name\") or product[\"name\"]),\n            \"product_id\": product[\"id\"], \"normalized_name\": product[\"name\"],\n            \"components\": product[\"components\"], \"combination\": bool(product.get(\"combination\")),\n            \"product_unknown\": bool(product.get(\"product_unknown\")), \"kind\": kind,\n            \"doses\": dose_count, \"missing\": dose_count + 1 if kind == \"EXPLICIT_MISSING\" else None,\n            \"dates\": sorted(set(dates)),\n            \"dose_events\": dose_events,\n            \"date_status\": \"COMPLETE\" if dose_count and len(dates) >= dose_count else \"MISSING_OR_INCOMPLETE\",\n            \"influenza_season\": item.get(\"influenza_season\"),\n            \"current_season_status\": item.get(\"current_season_status\"),\n            \"source\": \"STRUCTURED_UI\",\n        })\n    return {\n        \"status\": \"VALID\" if not rejected else \"PARTIAL\",\n        \"record_state\": value.get(\"record_state\"), \"events\": accepted,\n        \"free_text\": str(value.get(\"free_text\") or \"\").strip(), \"rejected\": rejected,\n    }\n\n\ndef _semantic_administration_records(semantic, existing_events):\n    \"\"\"Use validated LLM facts only when the deterministic name parser missed the source phrase.\"\"\"\n    products = {item[\"id\"]: item for item in _product_definitions()}\n    events = []\n    existing_sources = [item.get(\"source_text\", \"\").lower() for item in existing_events]\n    structured_products = {item.get(\"product_id\") for item in existing_events if item.get(\"source\") == \"STRUCTURED_UI\"}\n    for item in (semantic or {}).get(\"vaccinations\", []):\n        source = item[\"source_span\"].strip()\n        if item.get(\"product_id\") in structured_products:\n            continue\n        if any(source.lower() in known or known in source.lower() for known in existing_sources if known):\n            continue\n        product = products.get(item[\"product_id\"])\n        if not product:\n            continue\n        kind = item[\"history_state\"]\n        doses = item.get(\"dose_count\")\n        if kind == \"EXPLICIT_MISSING\" and doses is None:\n            doses = 0\n        if doses is not None and kind == \"ANY_DOSE\":\n            kind = \"COUNTED\"\n        if product[\"id\"] == \"bcg\" and kind == \"ANY_DOSE\":\n            kind, doses = \"COUNTED\", 1\n        dates = item.get(\"dates\") or []\n        events.append({\n            \"event_id\": f\"semantic_history_{len(events) + 1}\", \"source_text\": source,\n            \"source_name\": source, \"product_id\": product[\"id\"], \"normalized_name\": product[\"name\"],\n            \"components\": product[\"components\"], \"combination\": bool(product.get(\"combination\")),\n            \"product_unknown\": bool(product.get(\"product_unknown\")), \"kind\": kind, \"doses\": doses,\n            \"missing\": doses + 1 if kind == \"EXPLICIT_MISSING\" else None,\n            \"dates\": dates, \"date_status\": \"COMPLETE\" if doses and len(dates) >= doses else \"MISSING_OR_INCOMPLETE\",\n            \"source\": \"SEMANTIC_EXTRACTION\",\n        })\n    return events\n\n\n# One source for retrospective and prospective minimum intervals. Each tuple is\n# (anchor dose, days, calendar months). Never repeat the last interval for extra\n# doses or apply an ordinary series to an unspecified revaccination episode.\n# CN_NIP_2026: physical PDF pp7,9-15; full IPV timing: China CDC 2026-06-18.\nPROGRAM_INTERVALS = {\n    \"hep_b\": {2: [(1, 28, 0)], 3: [(2, 60, 0), (1, 0, 4)]},\n    \"dtap\": {2: [(1, 28, 0)], 3: [(2, 28, 0)], 4: [(3, 0, 6)], 5: [(4, 0, 12)]},\n    \"polio\": {2: [(1, 28, 0)], 3: [(2, 28, 0)], 4: [(3, 28, 0)]},\n    \"mmr\": {2: [(1, 28, 0)]},\n    \"je_live\": {2: [(1, 0, 12)]},\n    \"je_inactivated\": {2: [(1, 7, 0)], 3: [(2, 0, 1)], 4: [(3, 0, 36)]},\n    \"hep_a_inactivated\": {2: [(1, 0, 6)]},\n    \"hpv_nip\": {2: [(1, 0, 5)]},\n    \"mpsv_a\": {2: [(1, 0, 3)]},\n    \"mpsv_ac\": {2: [(1, 0, 36)]},\n}\nPRODUCT_INTERVAL_PROGRAM = {\n    \"five_in_one\": \"dtap\", \"six_in_one\": \"dtap\", \"four_in_one\": \"dtap\",\n    \"ipv\": \"polio\", \"bopv\": \"polio\",\n}\n\n\ndef _add_calendar_months(value, months):\n    absolute = value.year * 12 + value.month - 1 + months\n    year, month0 = divmod(absolute, 12)\n    return date(year, month0 + 1, min(value.day, monthrange(year, month0 + 1)[1]))\n\n\ndef _interval_requirements(program, dose_number, dose_dates):\n    requirements, missing = [], []\n    for anchor, days, months in PROGRAM_INTERVALS.get(program, {}).get(dose_number, []):\n        anchor_date = dose_dates.get(anchor)\n        if anchor_date is None:\n            missing.append(anchor)\n            continue\n        earliest = _add_calendar_months(anchor_date, months) + timedelta(days=days)\n        requirements.append({\"anchor_dose\": anchor, \"days\": days, \"calendar_months\": months, \"earliest_date\": earliest.isoformat()})\n    return requirements, missing\n\n\ndef _birth_date_bounds(age_text):\n    exact = _birth_date_from_age_text(age_text)\n    if exact:\n        return {\"earliest\": exact.isoformat(), \"latest\": exact.isoformat(), \"precision\": \"DAY\"}\n    months = _age_months(age_text)\n    if months is None or re.search(r\"约|左右|大概|差不多\", age_text or \"\"):\n        return None\n    # Bounds are deliberately inclusive: an imprecise age never invents a DOB.\n    width = 1 if re.search(r\"月|半\", age_text or \"\") else 12\n    if re.search(r\"天|日龄|周龄|周大\", age_text or \"\"):\n        return None\n    return {\"earliest\": _add_calendar_months(_today(), -months-width).isoformat(),\n            \"latest\": _add_calendar_months(_today(), -months).isoformat(), \"precision\": \"MONTH\" if width == 1 else \"YEAR\"}\n\n\ndef _birth_date_from_age_text(age_text):\n    match = re.fullmatch(r\"\\s*(20\\d{2})[-/.年](\\d{1,2})[-/.月](\\d{1,2})日?\\s*\", age_text or \"\")\n    if not match:\n        return None\n    try:\n        return date(*(int(value) for value in match.groups()))\n    except ValueError:\n        return None\n\n\ndef _validate_administration_records(events, age_text):\n    \"\"\"Turn machine-readable history into medically validated history facts.\"\"\"\n    birth_date = _birth_date_from_age_text(age_text)\n    birth_bounds = _birth_date_bounds(age_text)\n    for event in events:\n        reported = event.get(\"doses\")\n        raw_dose_events = event.get(\"dose_events\") or [\n            {\"dose_number\": index + 1, \"date\": value} for index, value in enumerate(event.get(\"dates\", []))\n        ]\n        parsed = []\n        issues = []\n        for row in raw_dose_events:\n            value = row.get(\"date\")\n            if not value:\n                continue\n            try:\n                parsed_date = date.fromisoformat(value)\n            except (TypeError, ValueError):\n                issues.append({\"code\": \"INVALID_DOSE_DATE\", \"dose_number\": row.get(\"dose_number\")})\n                continue\n            parsed.append((row.get(\"dose_number\"), parsed_date))\n        if reported is not None and len(parsed) != reported:\n            issues.append({\"code\": \"DOSE_DATE_COUNT_MISMATCH\", \"reported_doses\": reported, \"dated_doses\": len(parsed)})\n        accepted = []\n        seen_dates = set()\n        previous = None\n        program = PRODUCT_INTERVAL_PROGRAM.get(event.get(\"product_id\"), event.get(\"product_id\"))\n        accepted_by_number = {}\n        for sequence_index, (dose_number, dose_date) in enumerate(parsed):\n            if dose_date in seen_dates:\n                issues.append({\"code\": \"DUPLICATE_DOSE_DATE\", \"dose_number\": dose_number, \"date\": dose_date.isoformat()})\n                continue\n            if birth_date and dose_date < birth_date:\n                issues.append({\"code\": \"DOSE_BEFORE_BIRTH\", \"dose_number\": dose_number, \"date\": dose_date.isoformat()})\n                continue\n            if not birth_date and birth_bounds and dose_date < date.fromisoformat(birth_bounds[\"earliest\"]):\n                issues.append({\"code\": \"AGE_HISTORY_TIMELINE_CONFLICT\", \"dose_number\": dose_number, \"date\": dose_date.isoformat(), \"birth_bounds\": birth_bounds})\n                continue\n            if dose_date > _today():\n                issues.append({\"code\": \"DOSE_AFTER_REFERENCE_DATE\", \"dose_number\": dose_number, \"date\": dose_date.isoformat()})\n                continue\n            if previous and dose_date < previous:\n                issues.append({\"code\": \"DOSE_DATE_REVERSED\", \"dose_number\": dose_number, \"date\": dose_date.isoformat()})\n                continue\n            ordinal = dose_number if isinstance(dose_number, int) and dose_number > 0 else sequence_index + 1\n            requirements, missing_anchors = _interval_requirements(program, ordinal, accepted_by_number)\n            failed = [r for r in requirements if dose_date.isoformat() < r[\"earliest_date\"]]\n            if failed:\n                issues.append({\n                    \"code\": \"MINIMUM_INTERVAL_NOT_MET_IN_HISTORY\", \"dose_number\": dose_number,\n                    \"requirements\": failed,\n                })\n                continue\n            # Numbering may span products (IPV1/IPV2/bOPV3). Such anchors\n            # are checked after component merge, not declared absent here.\n            component = \"polio\" if program == \"polio\" else \"dtap\" if program == \"dtap\" else None\n            component_dates = {d for e in events if component and component in e.get(\"components\", []) for d in e.get(\"dates\", [])}\n            cross_product_anchors = bool(component and len(component_dates) >= ordinal and any(e is not event and component in e.get(\"components\", []) for e in events))\n            if missing_anchors and not cross_product_anchors:\n                issues.append({\"code\": \"INTERVAL_ANCHOR_MISSING\", \"dose_number\": ordinal, \"missing_anchor_doses\": missing_anchors})\n            accepted.append(dose_date)\n            accepted_by_number[ordinal] = dose_date\n            seen_dates.add(dose_date)\n            previous = dose_date\n        hard_issue_codes = {\n            \"INVALID_DOSE_DATE\", \"DUPLICATE_DOSE_DATE\", \"DOSE_BEFORE_BIRTH\",\n            \"DOSE_AFTER_REFERENCE_DATE\", \"DOSE_DATE_REVERSED\", \"MINIMUM_INTERVAL_NOT_MET_IN_HISTORY\",\n            \"AGE_HISTORY_TIMELINE_CONFLICT\", \"INTERVAL_ANCHOR_MISSING\",\n        }\n        has_hard_issue = any(issue[\"code\"] in hard_issue_codes for issue in issues)\n        limit = 4 if event.get(\"product_id\") in {\"five_in_one\", \"six_in_one\", \"four_in_one\"} else max(PROGRAM_INTERVALS.get(program, {}), default=0)\n        extra_program = bool(limit and reported and reported > limit)\n        if extra_program:\n            issues.append({\"code\": \"ADDITIONAL_PROGRAM_CONTEXT_REQUIRED\", \"routine_series_limit\": limit})\n        event[\"reported_doses\"] = reported\n        event[\"validated_dates\"] = [value.isoformat() for value in accepted]\n        event[\"validated_doses\"] = len(accepted) if parsed else None\n        event[\"validation_issues\"] = issues\n        event[\"medical_validity_state\"] = \"INVALID\" if has_hard_issue else \"INCOMPLETE\" if extra_program else \"VALID\" if reported and len(accepted) == reported else \"INCOMPLETE\"\n        if has_hard_issue:\n            event[\"date_status\"] = \"INVALID\"\n        elif extra_program:\n            event[\"date_status\"] = \"PROGRAM_CONTEXT_REQUIRED\"\n        elif reported and len(accepted) == reported:\n            event[\"date_status\"] = \"COMPLETE\"\n            event[\"dates\"] = event[\"validated_dates\"]\n    return events\n\n\ndef _aggregate_component(component, events):\n    contributors = [event for event in events if component in event[\"components\"]]\n    if not contributors:\n        return {\"kind\": \"UNMENTIONED\", \"doses\": None, \"missing\": None, \"dates\": [], \"date_status\": \"NONE\", \"contributors\": []}\n    invalid = [event for event in contributors if event.get(\"medical_validity_state\") == \"INVALID\"]\n    if invalid:\n        return {\n            \"kind\": \"INVALID_RECORD\", \"doses\": sum(event.get(\"validated_doses\") or 0 for event in invalid),\n            \"reported_doses\": sum(event.get(\"reported_doses\") or 0 for event in contributors),\n            \"missing\": None, \"dates\": sorted(set(day for event in contributors for day in event.get(\"validated_dates\", []))),\n            \"date_status\": \"INVALID\", \"contributors\": [event[\"event_id\"] for event in contributors],\n            \"products\": [event[\"product_id\"] for event in contributors],\n            \"validation_issues\": [issue for event in invalid for issue in event.get(\"validation_issues\", [])],\n        }\n    counted = [event for event in contributors if event[\"kind\"] == \"COUNTED\"]\n    explicit_missing = [event for event in contributors if event[\"kind\"] == \"EXPLICIT_MISSING\"]\n    if len(counted) > 1:\n        all_dated = all(event[\"date_status\"] == \"COMPLETE\" for event in counted)\n        dates = sorted(set(day for event in counted for day in event[\"dates\"]))\n        if not all_dated:\n            return {\n                \"kind\": \"OVERLAP_UNRESOLVED\", \"doses\": max(event[\"doses\"] for event in counted), \"missing\": None,\n                \"reported_total\": sum(event[\"doses\"] for event in counted), \"dates\": dates, \"date_status\": \"MISSING_OR_INCOMPLETE\",\n                \"contributors\": [event[\"event_id\"] for event in contributors], \"products\": [event[\"product_id\"] for event in contributors],\n            }\n        return {\"kind\": \"COUNTED\", \"doses\": len(dates), \"missing\": None, \"dates\": dates, \"date_status\": \"COMPLETE\", \"contributors\": [event[\"event_id\"] for event in contributors], \"products\": [event[\"product_id\"] for event in contributors]}\n    if counted:\n        event = counted[0]\n        return {\"kind\": \"COUNTED\", \"doses\": event[\"doses\"], \"missing\": None, \"dates\": event[\"dates\"], \"date_status\": event[\"date_status\"], \"contributors\": [item[\"event_id\"] for item in contributors], \"products\": [item[\"product_id\"] for item in contributors], \"influenza_season\": event.get(\"influenza_season\"), \"current_season_status\": event.get(\"current_season_status\")}\n    if explicit_missing:\n        event = explicit_missing[0]\n        return {\"kind\": \"EXPLICIT_MISSING\", \"doses\": event[\"doses\"], \"missing\": event[\"missing\"], \"dates\": event[\"dates\"], \"date_status\": event[\"date_status\"], \"contributors\": [item[\"event_id\"] for item in contributors], \"products\": [item[\"product_id\"] for item in contributors]}\n    kinds = {event[\"kind\"] for event in contributors}\n    kind = \"COMPLETE\" if \"COMPLETE\" in kinds else \"UNKNOWN\" if \"UNKNOWN\" in kinds else \"ANY_DOSE\"\n    return {\"kind\": kind, \"doses\": 1 if component == \"bcg\" and kind == \"ANY_DOSE\" else None, \"missing\": None, \"dates\": [], \"date_status\": \"MISSING_OR_INCOMPLETE\", \"contributors\": [event[\"event_id\"] for event in contributors], \"products\": [event[\"product_id\"] for event in contributors]}\n\n\ndef _normalize_history(record, semantic=None, structured_history=None, age_text=\"\"):\n    structured_history = structured_history or {\"status\": \"ABSENT\", \"events\": [], \"free_text\": \"\"}\n    if structured_history.get(\"status\") in {\"VALID\", \"PARTIAL\"}:\n        events = list(structured_history.get(\"events\", []))\n        events.extend(_administration_records(structured_history.get(\"free_text\", \"\")))\n    else:\n        events = _administration_records(record)\n    events.extend(_semantic_administration_records(semantic, events))\n    events = _validate_administration_records(events, age_text)\n    component_ids = {item[\"id\"] for item in SERIES + OPTIONAL}\n    component_ids.update(component for product in _product_definitions() for component in product[\"components\"])\n    normalized = {component: _aggregate_component(component, events) for component in component_ids}\n    for component, fact in normalized.items():\n        fact[\"birth_bounds\"] = _birth_date_bounds(age_text)\n        fact[\"product_histories\"] = [\n            {\"product_id\": e[\"product_id\"], \"kind\": e[\"kind\"], \"doses\": e.get(\"doses\"), \"dates\": e.get(\"dates\", []), \"date_status\": e.get(\"date_status\")}\n            for e in events if component in e[\"components\"]\n        ]\n    combo_evidence = [event for event in events if event[\"combination\"]]\n    return normalized, combo_evidence, events\n\n\ndef _recognized_history(events):\n    labels = []\n    for event in events:\n        if event.get(\"kind\") == \"EXPLICIT_MISSING\":\n            continue\n        if event.get(\"medical_validity_state\") == \"INVALID\":\n            valid_count = event.get(\"validated_doses\") or 0\n            label = f\"{event['normalized_name']}报告{event.get('reported_doses') or event.get('doses') or 0}剂（日期校验异常，当前仅识别{valid_count}个可继续核对的日期）\"\n        elif event[\"product_id\"] == \"bcg\" and event[\"kind\"] in {\"COUNTED\", \"ANY_DOSE\", \"COMPLETE\"}:\n            label = \"卡介苗已接种\"\n        elif event[\"kind\"] == \"COUNTED\":\n            date_count = len(event.get(\"dates\", []))\n            label = f\"{event['normalized_name']}{event['doses']}剂\"\n            if date_count:\n                label += f\"（已提供{date_count}个逐剂日期）\"\n        elif event[\"kind\"] == \"COMPLETE\":\n            label = f\"{event['normalized_name']}已完成\"\n        elif event[\"kind\"] == \"ANY_DOSE\":\n            label = f\"{event['normalized_name']}已接种（剂次未写）\"\n        elif event[\"kind\"] == \"EXPLICIT_MISSING\":\n            label = f\"{event['normalized_name']}明确缺第{event['missing']}剂\"\n        else:\n            label = f\"{event['normalized_name']}记录待核实\"\n        if event[\"product_unknown\"]:\n            label += \"（具体产品待核实）\"\n        labels.append(label)\n    return labels\n\n\ndef _field_entry(fields, *keys):\n    for name, value in fields.items():\n        if any(key in name for key in keys):\n            return True, value.strip()\n    return False, \"\"\n\n\ndef _activity_state(text):\n    if re.search(r\"活动期|急性发作|病情进展|未缓解|复发\", text or \"\"):\n        return \"ACTIVE\"\n    if re.search(r\"缓解期|病情稳定|稳定期|目前稳定|已缓解|已恢复\", text or \"\"):\n        return \"STABLE\"\n    return \"UNKNOWN\"\n\n\ndef _is_diagnosis_status_clause(text):\n    value = (text or \"\").strip(\" 。.\")\n    return bool(re.fullmatch(\n        r\"(?:近|最近|过去)?(?:\\d+|[一二三四五六七八九十半]+)?(?:天|周|月|年)?\"\n        r\"(?:未|无|没有)(?:再)?(?:发作|复发|症状|发热|抽搐|惊厥)\"\n        r\"|(?:目前|现在|病情)?(?:稳定|稳定期|控制良好|已恢复|已经恢复|痊愈)\"\n        r\"|体温正常|精神正常|精神状态正常|精神食欲正常|精神和食欲正常|无明显症状\",\n        value,\n    ))\n\n\ndef _diagnosis_model(diagnosis_text):\n    raw = (diagnosis_text or \"\").strip()\n    if not raw or re.search(r\"请填写|请描述\", raw):\n        return [], [], {\"information_state\": \"BLANK\", \"risk_domains\": [], \"unmapped_diagnoses\": [], \"clinical_facts\": []}\n    if re.fullmatch(r\"(?:原始病例|病例|病历|资料)?(?:未填写|未提供|未记录|不详|不清楚|未知|待补充)(?:具体|明确)?(?:诊断|疾病|病情)?[。.]?\", raw):\n        return [], [], {\"information_state\": \"BLANK\", \"risk_domains\": [], \"unmapped_diagnoses\": [], \"clinical_facts\": []}\n    if re.fullmatch(r\"(?:无|没有|健康|无特殊疾病|未诊断疾病|无基础疾病)[。.]?\", raw):\n        return [], [], {\"information_state\": \"EXPLICIT_NONE\", \"risk_domains\": [], \"unmapped_diagnoses\": [], \"clinical_facts\": []}\n\n    diagnoses = []\n    categories = []\n    risk_domains = []\n    unmapped = []\n    clinical_facts = []\n    fragments = [part.strip(\" 。.\") for part in re.split(r\"[；;、，,\\n]+\", raw) if part.strip(\" 。.\")]\n    for fragment in fragments:\n        if re.fullmatch(r\"(?:健康|身体健康|目前健康|无基础疾病|无特殊疾病|没有基础疾病)\", fragment):\n            clinical_facts.append({\"fact_type\": \"GENERAL_HEALTH\", \"source_span\": fragment, \"subject\": \"CHILD\"})\n            continue\n        if _is_diagnosis_status_clause(fragment):\n            clinical_facts.append({\"fact_type\": \"DISEASE_STATUS\", \"source_span\": fragment, \"subject\": \"CHILD\"})\n            continue\n        fact_types = _fact_types(fragment)\n        for fact_type in fact_types:\n            clinical_facts.append({\n                \"fact_type\": fact_type,\n                \"source_span\": fragment,\n                \"subject\": \"MOTHER\" if fact_type == \"MATERNAL_HISTORY\" else \"FAMILY\" if fact_type == \"FAMILY_HISTORY\" else \"CHILD\",\n            })\n        if \"CHILD_DIAGNOSIS\" not in fact_types:\n            continue\n        category_matches = []\n        for category_id, category_name, pattern in SPECIAL_HEALTH_CATEGORIES:\n            if re.search(pattern, fragment, re.I):\n                category_matches.append((category_id, category_name))\n                categories.append(category_id)\n        domain_matches = [domain for domain, pattern in RISK_DOMAIN_RULES if re.search(pattern, fragment, re.I)]\n        for category_id, _ in category_matches:\n            mapped_domain = CATEGORY_RISK_DOMAINS.get(category_id)\n            if mapped_domain and mapped_domain not in domain_matches:\n                domain_matches.append(mapped_domain)\n        risk_domains.extend(domain_matches)\n        certainty = \"SUSPECTED\" if re.search(r\"疑似|待排|可能|考虑|[？?]\", fragment) else \"CONFIRMED\"\n        activity = _activity_state(fragment)\n\n        if category_matches:\n            for category_id, category_name in category_matches:\n                diagnoses.append({\n                    \"raw_text\": fragment, \"normalized_name\": fragment.rstrip(\"？?\"),\n                    \"category_id\": category_id, \"category_name\": category_name,\n                    \"risk_domain\": CATEGORY_RISK_DOMAINS.get(category_id) or (domain_matches[0] if domain_matches else \"OTHER_COVERED\"),\n                    \"certainty\": certainty, \"activity\": activity,\n                    \"knowledge_coverage\": \"EXACT_26_CATEGORY\", \"source_span\": fragment,\n                })\n        elif domain_matches:\n            diagnoses.append({\n                \"raw_text\": fragment, \"normalized_name\": fragment.rstrip(\"？?\"),\n                \"category_id\": None, \"category_name\": None,\n                \"risk_domain\": domain_matches[0], \"certainty\": certainty, \"activity\": activity,\n                \"knowledge_coverage\": \"DOMAIN_GENERIC\", \"source_span\": fragment,\n            })\n        else:\n            entry = {\n                \"raw_text\": fragment, \"normalized_name\": fragment.rstrip(\"？?\"),\n                \"category_id\": \"UNMAPPED_DIAGNOSIS\", \"category_name\": \"尚未归类的诊断\",\n                \"risk_domain\": \"UNKNOWN\", \"certainty\": certainty, \"activity\": activity,\n                \"knowledge_coverage\": \"UNCOVERED\", \"source_span\": fragment,\n            }\n            diagnoses.append(entry)\n            unmapped.append(fragment)\n    return diagnoses, list(dict.fromkeys(categories)), {\n        \"information_state\": \"PRESENT\", \"risk_domains\": list(dict.fromkeys(risk_domains)),\n        \"unmapped_diagnoses\": list(dict.fromkeys(unmapped)), \"clinical_facts\": clinical_facts,\n    }\n\n\ndef _affirmed_treatment_fragments(text):\n    fragments = []\n    for clause in re.split(r\"[；;\\n。]\", text or \"\"):\n        # Negation carries across an enumerated list, until an explicit positive\n        # administration verb. Historical/planned treatments remain facts.\n        negative = False\n        family_subject = False\n        for fragment in re.split(r\"[，,]\", clause):\n            if re.search(r\"母亲|妈妈|父亲|爸爸|家属\", fragment):\n                family_subject = True\n            if re.search(r\"患儿|孩子|儿童本人\", fragment):\n                family_subject = False\n            if re.search(r\"(?:未提供|未记录|不清楚|不详|未知|未使用|未用过|未用|未接受|没有|否认|^\\s*无|无.{0,3}(?:化疗|激素|IVIG|输血|免疫抑制))\", fragment, re.I):\n                negative = True\n            if re.search(r\"正在(?:使用|接受)|已(?:使用|接受)|曾(?:用|使用|接受)|给予|予以\", fragment):\n                negative = False\n            if not negative and not family_subject:\n                fragments.append(fragment)\n    return fragments\n\n\ndef _immune_results(fields):\n    raw = _field(fields, \"免疫功能及相关检查\")\n    state = \"BLANK\" if not raw or raw == \"未填写\" else \"NOT_TESTED\" if re.fullmatch(r\"未检查|未查|未做检查\", raw) else \"UNKNOWN\" if re.fullmatch(r\"不清楚|未知|不详\", raw) else \"REPORTED\"\n    rows = []\n    for line in re.split(r\"[\\n；;]+\", raw):\n        if not line.strip():\n            continue\n        rows.append({\"source_span\": line.strip(), \"subject\": \"FAMILY\" if re.search(r\"母亲|妈妈|父亲|爸爸|家属\", line) and not re.search(r\"患儿|孩子\", line) else \"CHILD\", \"dates\": _parse_dates(line), \"interpretation\": \"AS_REPORTED_NOT_CLINICALLY_VALIDATED\"})\n    # Normal CBC or a number alone never establishes global immune competence.\n    child_results = \"；\".join(row[\"source_span\"] for row in rows if row[\"subject\"] == \"CHILD\")\n    immune_concern = state == \"REPORTED\" and _positive_concept(child_results, r\"免疫功能低下|免疫缺陷|(?:Ig[AGM]|免疫球蛋白|CD4|T细胞|B细胞|淋巴细胞).{0,12}(?:降低|偏低|低于|↓)\")\n    return {\"information_state\": state, \"raw_text\": raw, \"observations\": rows, \"immune_concern_reported\": bool(immune_concern), \"source\": \"USER_REPORTED\", \"reference_date\": _today().isoformat()}\n\n\ndef _allergy_facts(fields):\n    raw = _field(fields, \"过敏\", \"其他\")\n    facts = []\n    for span in re.split(r\"[；;\\n]+\", raw):\n        if not span.strip():\n            continue\n        kind = \"VACCINE_REACTION\" if re.search(r\"接种后|接种部位|异常反应\", span) else \"VACCINE_ALLERGY\" if re.search(r\"疫苗|成分\", span) else \"DRUG_ALLERGY\" if re.search(r\"药物|青霉素|头孢|阿莫西林\", span) else \"FOOD_ALLERGY\" if re.search(r\"食物|鸡蛋|牛奶|海鲜|花生\", span) else \"ALLERGY_HISTORY\"\n        facts.append({\"fact_type\": kind, \"source_span\": span.strip(), \"subject\": \"FAMILY\" if re.search(r\"母亲|父亲|家属\", span) else \"CHILD\", \"polarity\": \"ABSENT\" if re.match(r\"\\s*(?:无|没有|否认|未发生)\", span) else \"UNKNOWN\" if re.search(r\"未填写|不详|未知|未记录|无明确记录\", span) else \"PRESENT\"})\n    return facts\n\n\ndef _treatment_model(text, fields):\n    present, treatment_text = _field_entry(fields, \"用药\", \"治疗\")\n    stripped = treatment_text.strip()\n    if not present or not stripped or re.fullmatch(r\"(?:未填写|空白|BLANK)\", stripped, re.I) or re.search(r\"请尽量写药名|包括化疗\", stripped):\n        information_state = \"BLANK\"\n    elif re.fullmatch(r\"(?:无|没有|未用药|未治疗|无特殊治疗|未使用)\", stripped):\n        information_state = \"EXPLICIT_NONE\"\n    elif re.search(r\"未知|不详|不清楚|未提供|情况不明\", stripped):\n        information_state = \"UNKNOWN_DETAIL\"\n    else:\n        information_state = \"PRESENT\"\n\n    combined = \"\\n\".join(_affirmed_treatment_fragments(\"\\n\".join(filter(None, [treatment_text, _field(fields, \"诊断\", \"疾病\", \"病情\")]))))\n    definitions = [\n        (\"CHEMOTHERAPY\", r\"化疗|化学治疗\"),\n        (\"RADIOTHERAPY\", r\"放疗|放射治疗\"),\n        (\"IMMUNOTHERAPY\", r\"免疫治疗|CAR[- ]?T|细胞治疗\"),\n        (\"CORTICOSTEROID\", r\"糖皮质激素|泼尼松|甲泼尼龙|地塞米松\"),\n        (\"IMMUNOSUPPRESSANT\", r\"免疫抑制剂|免疫抑制治疗|环孢素|他克莫司|吗替麦考酚酯|硫唑嘌呤|甲氨蝶呤\"),\n        (\"BIOLOGIC\", r\"生物制剂|利妥昔单抗|抗B细胞|阿达木单抗|英夫利西单抗|托珠单抗\"),\n        (\"ANTIMICROBIAL\", r\"阿奇霉素|头孢|阿莫西林|青霉素|抗菌药|抗生素|奥司他韦\"),\n        (\"IVIG\", r\"IVIG|静(?:脉)?注(?:射)?(?:人)?免疫球蛋白|丙种球蛋白|丙球\"),\n        (\"BLOOD_PRODUCT\", r\"输血|血液制品|血浆|红细胞(?:悬液|输注)|血小板输注|全血\"),\n        (\"HSCT\", r\"造血干细胞移植|HSCT|骨髓移植\"),\n