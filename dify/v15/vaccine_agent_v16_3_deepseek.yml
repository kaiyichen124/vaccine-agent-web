月是否有癫痫发作、目前是否控制稳定\")\n        if profile[\"chd_uncertain\"] and \"房间隔缺损等先心病诊断是否已经确诊\" not in missing:\n            missing.append(\"房间隔缺损等先心病诊断是否已经确诊\")\n        if profile[\"chd\"] and not profile[\"chd_stable\"] and \"目前有无心功能异常、严重肺动脉高压或近期心脏手术\" not in missing:\n            missing.append(\"目前有无心功能异常、严重肺动脉高压或近期心脏手术\")\n        if profile.get(\"preterm_temporal_status\") in {\"CURRENT\", \"UNKNOWN\"} and \"目前生长、呼吸和心功能状态是否稳定\" not in missing:\n            missing.append(\"目前生长、呼吸和心功能状态是否稳定\")\n    if profile.get(\"immune_results\", {}).get(\"immune_concern_reported\"):\n        missing.insert(0, \"已提供免疫相关异常结果：请核对检查日期、单位、儿童参考范围及医生对结果的判断\")\n    targeted = []\n    if profile.get(\"leukemia\") or profile.get(\"solid_malignancy\"):\n        targeted = [\"目前是否正在化疗、放疗、免疫治疗或使用免疫抑制剂？\", \"最后一次治疗是什么时间？\", \"目前疾病是否缓解或稳定？\", \"近期是否发热或处于感染急性期？\", \"近期是否使用过IVIG或其他血液制品？\"]\n    elif profile.get(\"autoimmune\"):\n        targeted = [\"目前是否使用全身激素、免疫抑制剂或生物制剂，名称和剂量是多少？\", \"最后一次相关治疗是什么时间？\", \"目前疾病处于活动期还是稳定期？\", \"近期是否发热或处于感染急性期？\", \"近期是否使用过IVIG或其他血液制品？\"]\n    elif profile.get(\"hsct\") or profile.get(\"solid_organ_transplant\"):\n        targeted = [\"移植类型和移植日期是什么？\", \"目前是否仍在使用免疫抑制剂，最后一次用药是什么时间？\", \"医生是否确认疾病稳定或免疫功能已经恢复？\", \"近期是否发热或处于感染急性期？\", \"近期是否使用过IVIG或其他血液制品？\"]\n    elif profile.get(\"epilepsy\"):\n        targeted = [\"近6个月是否发生过癫痫或惊厥，目前控制是否稳定？\", \"目前使用哪些抗癫痫药，近期是否调整治疗？\", \"近期是否发热或处于感染急性期？\"]\n    elif profile.get(\"preterm_temporal_status\") in {\"CURRENT\", \"UNKNOWN\"}:\n        targeted = [\"目前生长、呼吸和循环状态是否稳定，是否仍需氧疗或住院治疗？\", \"近期是否发热或处于感染急性期？\", \"近期是否使用过IVIG或其他血液制品？\"]\n    elif gate in {\"HIGH_RISK_ACTIVE\", \"HIGH_RISK_INFORMATION_PENDING\"}:\n        targeted = [\"目前是否正在化疗或使用激素、免疫抑制剂、生物制剂？\", \"最后一次相关治疗是什么时间？\", \"目前疾病是否稳定？\", \"近期是否发热或处于感染急性期？\", \"近期是否使用过IVIG或其他血液制品？\"]\n    missing.extend(targeted)\n    missing = list(dict.fromkeys(missing))\n    overall_state = profile.get(\"overall_recommendation_state\", \"ROUTINE_CATCHUP\")\n    state_text = {\n        \"ROUTINE_CATCHUP\": (\"常规补种\", \"当前状态支持按年龄、接种记录和最小间隔继续安排。\"),\n        \"INACTIVATED_ONLY\": (\"建议接种灭活疫苗\", \"优先安排适龄灭活疫苗，减毒活疫苗等待专科复核。\"),\n        \"DEFER\": (\"暂缓接种\", \"当前存在明确的暂缓条件，先处理疾病或治疗阶段问题。\"),\n        \"FURTHER_EVALUATION\": (\"需进一步评估\", \"关键临床信息会改变接种结论，补齐后再生成疫苗清单。\"),\n    }\n    headline, alert = state_text[overall_state]\n    if overall_state in {\"ROUTINE_CATCHUP\", \"INACTIVATED_ONLY\"}:\n        missing = []\n    return {\"gate\": gate, \"overall_recommendation_state\": overall_state, \"standard_recommendation\": headline, \"headline\": headline, \"alert\": alert, \"critical_missing\": missing, \"targeted_questions\": missing}\n\n\ndef _overall_recommendation_state(profile, case_text):\n    \"\"\"Map the interpreted case to the four gold-standard top-level states.\"\"\"\n    treatment_text = str(profile.get(\"treatment\") or \"\")\n    high_dose_systemic_steroid = _positive_concept(\n        case_text,\n        r\"(?:大剂量|较大剂量).{0,12}(?:全身)?(?:糖皮质激素|激素)|(?:泼尼松|甲泼尼龙).{0,10}(?:2(?:\\.0+)?\\s*mg/kg|20\\s*mg)\",\n    ) and not bool(re.search(r\"吸入|鼻喷|外用|局部\", treatment_text, re.I))\n    hsct_date_known = bool(re.search(r\"移植(?:日期|时间)|移植后\\s*\\d+\\s*(?:天|周|个?月|年)|20\\d{2}[年\\-/.]\\d{1,2}\", case_text or \"\"))\n    hsct_early_or_unrecovered = bool(re.search(r\"移植后\\s*(?:[0-5](?:\\s*个?月)?|\\d+\\s*(?:天|周))|移植后早期|免疫重建未完成|尚未完全恢复\", case_text or \"\"))\n    treatment_unknown = bool(re.search(r\"不清楚|不详|未知|无法提供\", treatment_text, re.I))\n\n    if profile.get(\"acute_episode\") == \"ACTIVE\" or high_dose_systemic_steroid or (profile.get(\"hsct\") and hsct_early_or_unrecovered):\n        return \"DEFER\"\n    ivig_detail_missing = (\n        bool(re.search(r\"IVIG|免疫球蛋白|丙种球蛋白\", case_text or \"\", re.I))\n        and bool(re.search(r\"日期|剂量\", case_text or \"\"))\n        and bool(re.search(r\"未知|不详|无法提供|不清楚|未提供\", case_text or \"\"))\n    )\n    if profile.get(\"kawasaki_ivig_pending\") or (profile.get(\"kawasaki\") and ivig_detail_missing) or (profile.get(\"hsct\") and (not hsct_date_known or treatment_unknown)):\n        return \"FURTHER_EVALUATION\"\n    if profile.get(\"stable\") and (profile.get(\"solid_organ_transplant\") or profile.get(\"immune_risk_level\") == \"CONFIRMED\"):\n        return \"INACTIVATED_ONLY\"\n    if profile.get(\"patient_path\") in {\"HIGH_RISK_INFORMATION_PENDING\", \"RISK_INFORMATION_PENDING\"}:\n        return \"FURTHER_EVALUATION\"\n    if profile.get(\"solid_organ_transplant\") or profile.get(\"immune_risk_level\") == \"CONFIRMED\" or profile.get(\"intensive_treatment\"):\n        return \"INACTIVATED_ONLY\"\n    return \"ROUTINE_CATCHUP\"\n\n\ndef _caregiver_health_summary(profile):\n    parts = []\n    if profile[\"hsct\"]:\n        kind = {\"ALLOGENEIC\": \"异体\", \"AUTOLOGOUS\": \"自体\", \"UNKNOWN\": \"类型未明确的\"}.get(profile[\"hsct_type\"], \"\")\n        prefix = \"孩子有白血病及\" if profile[\"leukemia\"] else \"孩子有\"\n        parts.append(f\"{prefix}{kind}造血干细胞移植史，后续接种按移植时间、治疗和免疫功能恢复情况逐项修正。\")\n    else:\n        if profile[\"leukemia\"]:\n            parts.append(\"孩子有白血病；化疗阶段、缓解状态和免疫功能恢复会直接改变接种时间及活疫苗安排。\")\n        elif profile[\"solid_malignancy\"]:\n            parts.append(\"孩子有恶性肿瘤；需要结合化疗、放疗、免疫治疗、疾病控制和免疫恢复情况安排疫苗。\")\n        if profile[\"autoimmune\"]:\n            parts.append(\"孩子有自身免疫性疾病；疾病活动度、激素剂量、免疫抑制剂和生物制剂会改变部分疫苗结论。\")\n        if profile[\"solid_organ_transplant\"]:\n            parts.append(\"孩子有实体器官移植史，后续接种需结合移植时间和免疫抑制治疗。\")\n        if profile[\"epilepsy\"]:\n            parts.append(\"孩子有癫痫病史；控制稳定时通常可以接种，近6个月仍有发作时含百日咳成分疫苗先暂缓。\")\n        if profile[\"developmental_delay\"]:\n            parts.append(\"发育迟缓本身不自动构成接种禁忌。\")\n        if profile[\"chd\"]:\n            certainty = \"诊断尚待确认\" if profile[\"chd_uncertain\"] else \"已记录先天性心脏病\"\n            parts.append(f\"{certainty}；是否影响接种主要看心功能、严重肺动脉高压和近期手术情况。\")\n        if profile[\"preterm_vlbw\"] or profile[\"respiratory_history\"]:\n            parts.append(\"孩子有早产、极低出生体重或严重呼吸疾病病史；当前状态稳定后通常按实际年龄继续接种。\")\n        if profile[\"infectious\"]:\n            if profile[\"acute_episode\"] in {\"POSSIBLE_ACTIVE\", \"UNKNOWN\"}:\n                parts.append(\"已记录感染性疾病或当前治疗线索；急性期是否结束尚待确认，候选疫苗暂不直接安排。\")\n            elif profile[\"acute_episode\"] == \"RECOVERED\":\n                parts.append(\"感染性疾病已恢复，可继续按年龄和接种记录计算。\")\n        if profile[\"unmapped_diagnoses\"]:\n            parts.append(\"仍有尚未完成风险归类的诊断，需要先核实疾病性质和当前治疗。\")\n    return \"\".join(parts) or \"本次按年龄、接种记录和最小间隔计算接种安排。\"\n\n\ndef _parent_visible_ids(items, normalized, months, sex, mode):\n    \"\"\"后台全量判断；这里仅选择当前有行动价值或紧邻当前阶段的项目。\"\"\"\n    visible = []\n    for item in items:\n        vaccine_id = item[\"vaccine_id\"]\n        state = item[\"decision_state\"]\n        fact = normalized.get(vaccine_id, {\"kind\": \"UNMENTIONED\"})\n        explicitly_mentioned = fact.get(\"kind\") not in {\"UNMENTIONED\", \"UNKNOWN\"}\n        if state in ACTION_STATES | REVIEW_STATES:\n            # 远期 HPV 即使后台产生记录核对状态，也只在目标年龄段或用户明确提及时出现。\n            if vaccine_id == \"hpv_nip\" and not explicitly_mentioned and not (months is not None and 156 <= months <= 215 and \"女\" in (sex or \"\")):\n                continue\n            visible.append(vaccine_id)\n            continue\n        if state == \"COMPLETED\" and explicitly_mentioned:\n            visible.append(vaccine_id)\n            continue\n        if state == \"NOT_YET_DUE\" and item[\"reason_code\"] == \"NEXT_DOSE_NOT_DUE\":\n            visible.append(vaccine_id)\n            continue\n        if state == \"CATCHUP_WINDOW_CLOSED\" and explicitly_mentioned:\n            visible.append(vaccine_id)\n            continue\n        if vaccine_id == \"hpv_nip\" and months is not None and 144 <= months < 156 and \"女\" in (sex or \"\"):\n            visible.append(vaccine_id)\n            continue\n        # 非免疫规划项目也必须通过前面的年龄和行动价值过滤；后台审计结果不直接泄漏。\n        if item[\"category\"].startswith(\"非免疫\") and explicitly_mentioned and state not in {\"NO_INDICATION\", \"CATCHUP_WINDOW_CLOSED\", \"NOT_YET_DUE\"}:\n            visible.append(vaccine_id)\n    return list(dict.fromkeys(visible))\n\n\ndef _parent_summary(items, visible_ids, normalized, patient_decision):\n    visible = [item for item in items if item[\"vaccine_id\"] in set(visible_ids)]\n    return {\n        \"action_count\": sum(item[\"decision_state\"] in ACTION_STATES for item in visible),\n        \"information_task_count\": sum(item[\"decision_state\"] in {\"RECORDS_NEEDED\", \"PRODUCT_NEEDED\", \"HEALTH_STATUS_NEEDED\"} for item in visible),\n        \"record_items_to_verify\": sum(item[\"decision_state\"] == \"RECORDS_NEEDED\" for item in visible),\n        \"product_items_to_verify\": sum(item[\"decision_state\"] == \"PRODUCT_NEEDED\" for item in visible),\n        \"health_items_to_verify\": sum(item[\"decision_state\"] == \"HEALTH_STATUS_NEEDED\" for item in visible),\n        \"medical_review_count\": sum(item[\"decision_state\"] == \"MEDICAL_REVIEW\" for item in visible),\n        \"deferred_count\": sum(item[\"decision_state\"] == \"TEMPORARILY_DEFERRED\" for item in visible),\n        \"critical_clinical_information_count\": len(patient_decision[\"critical_missing\"]),\n        \"grouped_record_task\": False,\n    }\n\n\ndef _optional_candidates(text, months, profile, normalized):\n    candidates = []\n    splenic_risk = profile.get(\"planned_splenectomy\") or profile.get(\"asplenia\")\n    high_risk = profile[\"patient_path\"] in {\"HIGH_RISK_ACTIVE\", \"HIGH_RISK_INFORMATION_PENDING\"} or splenic_risk or bool(re.search(r\"脑脊液漏|人工耳蜗\", text))\n    for vaccine in OPTIONAL:\n        mentioned = bool(re.search(vaccine[\"pattern\"], text, re.I))\n        triggered = (vaccine[\"id\"] == \"ppsv23\" and high_risk) or (splenic_risk and vaccine[\"id\"] in {\"pcv\", \"hib\", \"mpcv_ac\", \"mpsv_acyw\", \"mpcv_acyw\"})\n        high_risk_candidate = high_risk and bool(set(vaccine.get(\"risk_domains\", [])) & set(profile[\"risk_domains\"]))\n        if not (mentioned or triggered or high_risk_candidate):\n            continue\n        if vaccine.get(\"min_age\") is not None and months is not None and months < vaccine[\"min_age\"]:\n            state, reason_code, reason = \"NOT_YET_DUE\", \"OPTIONAL_AGE_NOT_DUE\", \"尚未达到相关产品的起始年龄。\"\n        elif vaccine.get(\"max_age\") is not None and months is not None and months > vaccine[\"max_age\"]:\n            state, reason_code, reason = \"CATCHUP_WINDOW_CLOSED\", \"OPTIONAL_PRODUCT_AGE_CLOSED\", \"已超过该类产品的适用年龄窗口，当前不进入接种候选。\"\n        elif vaccine.get(\"high_risk_only\") and not high_risk:\n            state, reason_code, reason = \"NO_INDICATION\", \"NO_HIGH_RISK_INDICATION\", \"现有资料未见需要积极考虑该疫苗的高风险适应证。\"\n        else:\n            fact = normalized.get(vaccine[\"id\"], {\"kind\": \"UNMENTIONED\"})\n            if vaccine[\"id\"] == \"flu\":\n                season = _current_influenza_season()\n                supplied_season = fact.get(\"influenza_season\")\n                season_status = fact.get(\"current_season_status\") if not supplied_season or supplied_season == season else None\n                if season_status == \"VACCINATED\":\n                    state, reason_code, reason = \"COMPLETED\", \"INFLUENZA_CURRENT_SEASON_COMPLETE\", f\"已记录{season}流感季完成接种，当前流感季无需重复安排。\"\n                elif season_status == \"NOT_VACCINATED\":\n                    state, reason_code, reason = \"NOW_DUE\", \"INFLUENZA_CURRENT_SEASON_DUE\", f\"已明确{season}流感季尚未接种，当前可按本流感季程序安排。\"\n                else:\n                    state, reason_code, reason = \"RECORDS_NEEDED\", \"INFLUENZA_CURRENT_SEASON_REQUIRED\", f\"需先确认{season}流感季是否已经接种；既往累计剂次数不能代表本流感季已完成。\"\n            elif fact.get(\"kind\") == \"COMPLETE\":\n                state, reason_code, reason = \"COMPLETED\", \"RECORD_COMPLETE\", \"记录明确已完成相应程序。\"\n            else:\n                state, reason_code, reason = \"PRODUCT_NEEDED\", \"OPTIONAL_PRODUCT_AND_HISTORY\", \"需结合既往记录、当前年龄和具体产品程序判断。\"\n        candidates.append({\n            \"vaccine_id\": vaccine[\"id\"], \"vaccine\": vaccine[\"name\"], \"display_name\": vaccine[\"name\"],\n            \"category\": \"非免疫规划（自费、自愿）\", \"decision_state\": state,\n            \"final_state\": STATE_LABELS[state], \"reason_code\": reason_code, \"reason\": reason,\n            \"caregiver_advice\": reason, \"standard_recommendation_status\": \"需进一步评估\" if state in REVIEW_STATES else None,\n            \"dose\": None, \"priority\": 55, \"implementation_options\": [], \"medical_rule_ids\": [], \"evidence_ids\": [],\n            \"evidence_trace\": [{\"evidence_id\": \"PRODUCT_OR_KB_REQUIRED\", \"section\": \"对应非免疫规划疫苗产品说明或知识库条目\", \"location\": \"待检索\", \"rule\": reason_code}],\n        })\n    return candidates\n\n\ndef _evidence_routing(profile):\n    allowed = [\"CN_NIP_2026\"]\n    topic_routes = []\n\n    def add_topic(topic_id, evidence_ids, reason):\n        valid = [evidence_id for evidence_id in evidence_ids if evidence_id in EVIDENCE_REGISTRY]\n        if valid:\n            allowed.extend(valid)\n            topic_routes.append({\"topic_id\": topic_id, \"evidence_ids\": valid, \"reason\": reason})\n\n    for category in profile[\"special_health_categories\"]:\n        if category == \"ALLOGENEIC_HSCT\" and profile.get(\"hsct_type\") != \"ALLOGENEIC\":\n            continue\n        evidence_id = SPECIAL_EVIDENCE_INDEX.get(category, (None, None))[0]\n        if evidence_id in EVIDENCE_REGISTRY:\n            add_topic(category, [evidence_id], \"命中特殊健康状态专题\")\n    if profile.get(\"autoimmune\"):\n        add_topic(\"AUTOIMMUNE_AND_IMMUNOSUPPRESSANT\", [\"CN_AUTOIMMUNE_2019\", \"CN_IMMUNOSUPPRESSANT_2019\"], \"自身免疫或炎症性疾病需同时核对疾病和免疫抑制治疗\")\n    if profile.get(\"leukemia\"):\n        add_topic(\"LEUKEMIA_CHEMOTHERAPY\", [\"CN_LEUKEMIA_CHEMO_2019\", \"CN_IMMUNOSUPPRESSANT_2019\"], \"白血病需核对化疗阶段和免疫抑制影响\")\n    if profile.get(\"solid_organ_transplant\"):\n        add_topic(\"SOLID_ORGAN_TRANSPLANT\", [\"CN_SOLID_ORGAN_TRANSPLANT_2019\", \"CN_IMMUNOSUPPRESSANT_2019\"], \"实体器官移植需核对移植和持续免疫抑制\")\n    if profile.get(\"epilepsy\"):\n        add_topic(\"EPILEPSY\", [\"CN_EPILEPSY_2019\"], \"癫痫或非热性惊厥专题\")\n    if profile.get(\"preterm_vlbw\"):\n        add_topic(\"PRETERM\", [\"CN_PRETERM_2018\"], \"早产儿专题\")\n    if profile[\"malignancy\"]:\n        add_topic(\"MALIGNANCY_GENERAL\", [\"CN_GD_TUMOR_2020\", \"CN_IMMUNOSUPPRESSANT_2019\"], \"肿瘤通用高风险与治疗影响\")\n    if profile[\"hsct\"]:\n        add_topic(\"HCT\", [\"CN_GD_HCT_2020\", \"CN_IMMUNOSUPPRESSANT_2019\"], \"造血干细胞移植与免疫抑制\")\n    if profile.get(\"blood_product\") or profile.get(\"ivig\"):\n        add_topic(\"ANTIBODY_PRODUCTS\", [\"CN_IVIG_2019\", \"CDC_ANTIBODY_PRODUCTS\"], \"IVIG或血液制品可能改变活疫苗间隔\")\n    if profile.get(\"unmapped_diagnoses\"):\n        add_topic(\"UNRECOGNIZED_HIGH_RISK\", [\"CN_IMMUNOSUPPRESSANT_2019\", \"CN_PID_2018\"], \"未识别疾病的免疫功能和治疗风险兜底\")\n    candidates = []\n    if profile[\"hsct\"] and profile.get(\"hsct_type\") == \"UNKNOWN\":\n        candidates.append({\"evidence_id\": \"CN_ALLO_HSCT_2019\", \"missing_condition\": \"HSCT_TYPE_ALLOGENEIC\"})\n    uncovered_categories = [category for category in profile[\"special_health_categories\"] if category not in SPECIAL_EVIDENCE_INDEX]\n    allowed = list(dict.fromkeys(allowed))\n    special_ids = [evidence_id for evidence_id in allowed if evidence_id != \"CN_NIP_2026\"]\n    risk_route = profile.get(\"patient_path\") != \"ROUTINE\" or bool(profile.get(\"unmapped_diagnoses\"))\n    topic_count = max(1, len({item[\"topic_id\"] for item in topic_routes})) if risk_route else 0\n    requested_top_k = min(8, max(2, 2 + 2 * topic_count))\n    return {\n        \"allowed_evidence_ids\": allowed,\n        \"candidate_evidence_ids\": candidates,\n        \"uncovered_category_ids\": uncovered_categories,\n        \"unmapped_diagnoses\": profile[\"unmapped_diagnoses\"],\n        \"topic_routes\": topic_routes,\n        \"risk_route\": risk_route,\n        \"special_evidence_required\": risk_route,\n        \"special_evidence_ids\": special_ids,\n        \"special_evidence_insufficient\": risk_route and not special_ids,\n        \"retrieval_status\": \"SPECIAL_EVIDENCE_INSUFFICIENT\" if risk_route and not special_ids else \"ROUTED\",\n        \"requested_top_k\": requested_top_k,\n        \"selection_policy\": {\"national_program\": \"1-2\", \"per_topic\": \"1-2\", \"maximum\": 8, \"deduplicate\": True},\n        \"evidence_catalog\": {evidence_id: EVIDENCE_REGISTRY[evidence_id].get(\"title\", evidence_id) for evidence_id in allowed if evidence_id in EVIDENCE_REGISTRY},\n    }\n\n\ndef _attach_routed_evidence(items, routing):\n    health_evidence = [evidence_id for evidence_id in routing[\"allowed_evidence_ids\"] if evidence_id != \"CN_NIP_2026\"]\n    for item in items:\n        if item[\"decision_state\"] not in {\"MEDICAL_REVIEW\", \"TEMPORARILY_DEFERRED\", \"HEALTH_STATUS_NEEDED\"}:\n            continue\n        for evidence_id in health_evidence:\n            if evidence_id in item[\"evidence_ids\"]:\n                continue\n            source = EVIDENCE_REGISTRY[evidence_id]\n            if evidence_id == \"CDC_ANTIBODY_PRODUCTS\" and item.get(\"reason_code\") != \"ANTIBODY_PRODUCT_INTERVAL\":\n                continue\n            if evidence_id == \"CN_INFECTIOUS_2019\" and item[\"reason_code\"] not in {\"CURRENT_ACUTE_ILLNESS\", \"INFECTIOUS_CURRENT_STATUS_REQUIRED\"}:\n                continue\n            item[\"evidence_ids\"].append(evidence_id)\n            item[\"evidence_trace\"].append({\n                \"evidence_id\": evidence_id, \"section\": source.get(\"section\", \"接种建议\"),\n                \"location\": source.get(\"location\", \"对应共识接种建议章节\"), \"rule\": item[\"reason_code\"],\n            })\n    return items\n\n\ndef _annotate_decision_stages(items, normalized, months, sex, profile):\n    \"\"\"Expose every stage of the shared pipeline for audit and regression tests.\"\"\"\n    catalog = {item[\"id\"]: item for item in SERIES + OPTIONAL}\n    interval_reasons = {\n        \"LAST_DOSE_DATE_REQUIRED\": \"LAST_DOSE_DATE_REQUIRED\",\n        \"COMPONENT_OVERLAP_DATE_REQUIRED\": \"DEDUPLICATION_AND_DATES_REQUIRED\",\n        \"POLIO_PRODUCT_PATH_AND_DATE\": \"PRODUCT_PATH_AND_DATE_REQUIRED\",\n        \"MINIMUM_INTERVAL_NOT_MET\": \"MINIMUM_INTERVAL_NOT_MET\",\n    }\n    health_reason_codes = {\n        \"CURRENT_ACUTE_ILLNESS\", \"HIGH_RISK_LIVE_VACCINE_DEFER\", \"HIGH_RISK_ACTIVE_PATH\",\n        \"HIGH_RISK_TREATMENT_INFORMATION_REQUIRED\", \"UNMAPPED_DIAGNOSIS_RISK_REVIEW\",\n        \"INFECTIOUS_CURRENT_STATUS_REQUIRED\", \"EPILEPSY_CONTROL_REQUIRED\", \"CHD_UNSTABLE\",\n        \"CHD_STABILITY_REQUIRED\", \"PRETERM_CURRENT_STABILITY_REQUIRED\", \"IVIG_INJECTABLE_LIVE_INTERVAL\",\n    }\n    for item in items:\n        rule = catalog.get(item[\"vaccine_id\"], {})\n        if months is None:\n            age_gate = \"AGE_UNKNOWN\"\n        elif rule.get(\"min_age\") is not None and months < rule[\"min_age\"]:\n            age_gate = \"NOT_YET_ELIGIBLE\"\n        elif rule.get(\"schedule\") and months < rule[\"schedule\"][0]:\n            age_gate = \"NOT_YET_ELIGIBLE\"\n        elif rule.get(\"max_age\") is not None and months > rule[\"max_age\"]:\n            age_gate = \"PRODUCT_WINDOW_CLOSED\"\n        elif rule.get(\"catchup_max\") is not None and months > rule[\"catchup_max\"]:\n            age_gate = \"CATCHUP_WINDOW_CLOSED\"\n        else:\n            age_gate = \"ELIGIBLE\"\n        population_gate = \"NOT_APPLICABLE\" if rule.get(\"sex\") and rule[\"sex\"] not in (sex or \"\") else \"ELIGIBLE\"\n        history_fact = normalized.get(item[\"vaccine_id\"])\n        history_state = history_fact.get(\"kind\", \"UNMENTIONED\") if history_fact else \"UNMENTIONED\"\n        interval_state = interval_reasons.get(item[\"reason_code\"])\n        if not interval_state:\n            interval_state = \"VALID_OR_NOT_REQUIRED\" if item[\"decision_state\"] in ACTION_STATES | {\"COMPLETED\", \"NOT_YET_DUE\"} else \"NOT_EVALUATED\"\n        health_modifier = item[\"reason_code\"] if item[\"reason_code\"] in health_reason_codes else None\n        item.update({\n            \"age_gate\": age_gate,\n            \"population_gate\": population_gate,\n            \"history_state\": history_state,\n            \"interval_state\": interval_state,\n            \"health_modifier\": health_modifier,\n            \"patient_path_modifier\": profile[\"patient_path\"] if health_modifier else None,\n            \"final_decision_state\": item[\"decision_state\"],\n            \"product_rule\": {\n                \"product_dependent\": bool(rule.get(\"product_dependent\")),\n                \"min_age_months\": rule.get(\"min_age\", rule.get(\"schedule\", [None])[0] if rule.get(\"schedule\") else None),\n                \"max_age_months\": rule.get(\"max_age\"),\n                \"catchup_max_months\": rule.get(\"catchup_max\"),\n            },\n        })\n    return items\n\n\ndef _priority_summary(items, profile, patient_decision):\n    ordered = sorted((item for item in items if item[\"decision_state\"] in ACTION_STATES | REVIEW_STATES), key=lambda item: (item[\"priority\"], item[\"vaccine_id\"]))\n    action_count = sum(item[\"decision_state\"] in ACTION_STATES for item in items)\n    confirmation_count = sum(item[\"decision_state\"] in {\"RECORDS_NEEDED\", \"PRODUCT_NEEDED\", \"HEALTH_STATUS_NEEDED\"} for item in items)\n    defer_count = sum(item[\"decision_state\"] == \"TEMPORARILY_DEFERRED\" for item in items) if profile[\"acute_status\"] != \"UNKNOWN\" else None\n    return {\n        \"action_count\": action_count,\n        \"confirmation_count\": confirmation_count,\n        \"medical_review_count\": sum(item[\"decision_state\"] == \"MEDICAL_REVIEW\" for item in items),\n        \"critical_clinical_information_count\": len(patient_decision[\"critical_missing\"]),\n        \"defer_count\": defer_count,\n        \"defer_assessment\": \"KNOWN\" if defer_count is not None else \"UNKNOWN_CURRENT_HEALTH_STATUS\",\n        \"items\": [{\"vaccine_id\": item[\"vaccine_id\"], \"display_name\": item[\"display_name\"], \"dose\": item[\"dose\"], \"decision_state\": item[\"decision_state\"], \"final_state\": item[\"final_state\"], \"reason_code\": item[\"reason_code\"]} for item in ordered[:4]],\n    }\n\n\ndef _next_steps(items, mode, profile, patient_decision):\n    steps = []\n    if patient_decision[\"gate\"] in {\"HIGH_RISK_ACTIVE\", \"HIGH_RISK_INFORMATION_PENDING\"}:\n        if patient_decision[\"critical_missing\"]:\n            steps.append(\"补齐会直接改变接种结论的关键信息：\" + \"、\".join(patient_decision[\"critical_missing\"]) + \"。\")\n        if profile[\"hsct\"] or profile[\"solid_organ_transplant\"]:\n            steps.append(\"由血液科或移植团队结合移植时间、当前治疗和医生对免疫功能恢复的评估，制定后续接种计划。\")\n        elif profile[\"autoimmune\"]:\n            steps.append(\"补充疾病活动状态以及激素、免疫抑制剂和生物制剂信息后，重新计算受影响疫苗。\")\n        else:\n            steps.append(\"由血液科或原治疗团队结合治疗阶段制定接种计划；显著免疫抑制期间不安排减毒活疫苗。\")\n        return steps[:4]\n    if patient_decision[\"critical_missing\"]:\n        steps.append(\"先补充会改变本病例接种结论的信息：\" + \"、\".join(patient_decision[\"critical_missing\"]) + \"。\")\n    overlap_names = [item[\"display_name\"] for item in items if item[\"reason_code\"] == \"COMPONENT_OVERLAP_DATE_REQUIRED\"]\n    if overlap_names:\n        steps.append(\"逐剂核对以下疫苗及联合疫苗的接种日期，完成成分合并和去重：\" + \"、\".join(dict.fromkeys(overlap_names)) + \"。\")\n    date_names = [item[\"display_name\"] for item in items if item[\"reason_code\"] in {\"LAST_DOSE_DATE_REQUIRED\", \"POLIO_PRODUCT_PATH_AND_DATE\"}]\n    if date_names:\n        steps.append(\"补充最近一剂接种日期后再验证最小间隔：\" + \"、\".join(dict.fromkeys(date_names)) + \"。\")\n    if mode == \"UNKNOWN\" or any(item[\"decision_state\"] == \"RECORDS_NEEDED\" for item in items):\n        names = [item[\"display_name\"] for item in items if item[\"decision_state\"] == \"RECORDS_NEEDED\" and item[\"reason_code\"] not in {\"COMPONENT_OVERLAP_DATE_REQUIRED\", \"LAST_DOSE_DATE_REQUIRED\"}]\n        if names:\n            steps.append(\"核对接种证或电子接种记录中的剂次数：\" + \"、\".join(names) + \"。\")\n    if any(item[\"decision_state\"] == \"PRODUCT_NEEDED\" for item in items):\n        names = [item[\"display_name\"] for item in items if item[\"decision_state\"] == \"PRODUCT_NEEDED\"]\n        steps.append(\"确认会改变程序的疫苗产品或剂型：\" + \"、\".join(names) + \"。\")\n    if not patient_decision[\"critical_missing\"] and profile[\"acute_status\"] == \"UNKNOWN\" and any(item[\"decision_state\"] in ACTION_STATES | REVIEW_STATES for item in items):\n        steps.append(\"补充孩子今天是否发热、精神状态是否正常、急性症状是否已恢复。\")\n    if any(item[\"decision_state\"] == \"TEMPORARILY_DEFERRED\" for item in items):\n        steps.append(\"待退热且急性病情恢复后，再安排当前到期项目。\")\n    if any(item[\"decision_state\"] == \"MEDICAL_REVIEW\" for item in items):\n        steps.append(\"携带治疗名称、剂量和日期，评估受影响的减毒活疫苗。\")\n    if not steps and any(item[\"decision_state\"] in ACTION_STATES for item in items):\n        steps.append(\"按“现在可以安排”中的最前缺失剂次预约接种。\")\n    return list(dict.fromkeys(steps))[:4]\n\n\ndef _enforce_profile_invariants(profile):\n    \"\"\"Reject impossible patient gates before any vaccine conclusion is composed.\"\"\"\n    audit = []\n    flags = profile.get(\"clinical_flags\", {})\n    gate = profile.get(\"patient_path\")\n    if flags.get(\"immune_deficiency_possible\") and gate == \"ROUTINE\":\n        profile[\"patient_path\"] = profile[\"patient_gate\"] = \"HIGH_RISK_INFORMATION_PENDING\"\n        profile[\"risk_disposition\"] = \"POTENTIAL_HIGH_RISK\"\n        profile[\"underlying_risk\"] = \"HIGH_RISK_INFORMATION_PENDING\"\n        profile[\"immune_risk\"] = True\n        audit.append({\"rule_id\": \"INV_IMMUNE_RISK_NOT_ROUTINE\", \"action\": \"CORRECTED\", \"from\": gate, \"to\": profile[\"patient_path\"]})\n    gate = profile.get(\"patient_path\")\n    if (flags.get(\"planned_splenectomy\") or flags.get(\"asplenia\")) and gate == \"ROUTINE\":\n        profile[\"patient_path\"] = profile[\"patient_gate\"] = \"TARGETED_MODIFIER\"\n        profile[\"risk_disposition\"] = \"TARGETED_RISK\"\n        audit.append({\"rule_id\": \"INV_SPLENIC_RISK_NOT_ROUTINE\", \"action\": \"CORRECTED\", \"from\": gate, \"to\": profile[\"patient_path\"]})\n    gate = profile.get(\"patient_path\")\n    if flags.get(\"hematologic_or_immune_review\") and gate == \"ROUTINE\":\n        profile[\"patient_path\"] = profile[\"patient_gate\"] = \"HIGH_RISK_INFORMATION_PENDING\"\n        profile[\"risk_disposition\"] = \"POTENTIAL_HIGH_RISK\"\n        audit.append({\"rule_id\": \"INV_HEMATOLOGIC_RISK_NOT_ROUTINE\", \"action\": \"CORRECTED\", \"from\": gate, \"to\": profile[\"patient_path\"]})\n    gate = profile.get(\"patient_path\")\n    if profile.get(\"severe_vaccine_allergy\") and gate == \"ROUTINE\":\n        profile[\"patient_path\"] = profile[\"patient_gate\"] = \"TARGETED_MODIFIER\"\n        profile[\"risk_disposition\"] = \"TARGETED_RISK\"\n        audit.append({\"rule_id\": \"INV_SEVERE_VACCINE_ALLERGY_NOT_ROUTINE\", \"action\": \"CORRECTED\", \"from\": gate, \"to\": profile[\"patient_path\"]})\n    return audit\n\n\ndef _enforce_vaccine_invariants(items, normalized, structured_history):\n    \"\"\"Final deterministic fuse for product, single-dose and structured-history facts.\"\"\"\n    audit = []\n    by_id = {item.get(\"vaccine_id\"): item for item in items}\n    for vaccine_id, known_products in {\n        \"je\": {\"je_live\", \"je_inactivated\"},\n        \"hep_a\": {\"hep_a_live\", \"hep_a_inactivated\"},\n    }.items():\n        fact = normalized.get(vaccine_id, {})\n        item = by_id.get(vaccine_id)\n        if item and set(fact.get(\"products\", [])) & known_products and item.get(\"decision_state\") == \"PRODUCT_NEEDED\":\n            item.update(\n                decision_state=\"RECORDS_NEEDED\", final_state=STATE_LABELS[\"RECORDS_NEEDED\"],\n                reason_code=\"KNOWN_PRODUCT_HISTORY_VALIDATION_REQUIRED\",\n                reason=\"疫苗产品已经明确；当前只需按该产品程序核对剂次和逐剂日期。\",\n                caregiver_advice=\"产品无需重复确认，请核对该产品的剂次和逐剂日期。\", priority=8,\n            )\n            audit.append({\"rule_id\": \"INV_KNOWN_PRODUCT_NOT_PRODUCT_NEEDED\", \"vaccine_id\": vaccine_id, \"action\": \"CORRECTED\"})\n    for item in items:\n        calculation = item.get(\"program_calculation\", {})\n        earliest = calculation.get(\"earliest_date\")\n        if item[\"decision_state\"] in ACTION_STATES and earliest and earliest > _today().isoformat():\n            reason = f\"本剂最早接种日期为{earliest}，当前尚未到期。\"\n            item.update(decision_state=\"NOT_YET_DUE\", final_state=STATE_LABELS[\"NOT_YET_DUE\"], reason_code=\"FINAL_EARLIEST_DATE_GATE\", reason=reason, caregiver_advice=reason)\n            audit.append({\"rule_id\": \"INV_NO_ACTION_BEFORE_EARLIEST_DATE\", \"vaccine_id\": item[\"vaccine_id\"], \"action\": \"CORRECTED\"})\n    bcg = by_id.get(\"bcg\")\n    if bcg and \"下一剂\" in \"\".join(str(bcg.get(key) or \"\") for key in (\"reason\", \"caregiver_advice\")):\n        bcg.update(\n            decision_state=\"RECORDS_NEEDED\", final_state=STATE_LABELS[\"RECORDS_NEEDED\"],\n            reason_code=\"BCG_HISTORY_REQUIRED\", reason=\"需核对卡介苗是否已经接种；确认未接种后再按当前年龄评估补种条件。\",\n            caregiver_advice=\"核对卡介苗接种记录；卡介苗不使用多剂次疫苗的‘下一剂’模板。\", dose=None,\n        )\n        audit.append({\"rule_id\": \"INV_BCG_NO_NEXT_DOSE_TEMPLATE\", \"vaccine_id\": \"bcg\", \"action\": \"CORRECTED\"})\n    if structured_history.get(\"status\") in {\"VALID\", \"PARTIAL\"} and structured_history.get(\"events\"):\n        if not any(fact.get(\"kind\") not in {\"UNMENTIONED\", \"UNKNOWN\"} for fact in normalized.values()):\n            audit.append({\"rule_id\": \"INV_STRUCTURED_HISTORY_PRESERVED\", \"action\": \"BLOCKED\"})\n    return audit\n\n\ndef _attach_readiness(items, profile, normalized):\n    \"\"\"Separate due-ness, evidence sufficiency and permission to schedule now.\"\"\"\n    blockers = {\n        \"RECORDS_NEEDED\": \"接种史或逐剂日期待核实\",\n        \"PRODUCT_NEEDED\": \"产品或年龄对应程序待核实\",\n        \"HEALTH_STATUS_NEEDED\": \"影响接种的临床信息待核实\",\n        \"MEDICAL_REVIEW\": \"需要专业评估\",\n        \"TEMPORARILY_DEFERRED\": \"当前状态需要暂缓\",\n        \"NOT_YET_DUE\": \"尚未到年龄或最小间隔\",\n        \"COMPLETED\": \"已完成当前程序\",\n        \"CATCHUP_WINDOW_CLOSED\": \"已超过适用窗口\",\n        \"POPULATION_NOT_APPLICABLE\": \"不属于适用人群\",\n        \"NO_INDICATION\": \"无当前适应证\",\n    }\n    for item in items:\n        original = item[\"decision_state\"]\n        fact = normalized.get(item[\"vaccine_id\"], {})\n        conditional = (\n            original == \"RECORDS_NEEDED\"\n            and item.get(\"reason_code\") == \"LAST_DOSE_DATE_REQUIRED\"\n            and profile[\"patient_path\"] == \"ROUTINE\"\n            and fact.get(\"kind\") in {\"COUNTED\", \"EXPLICIT_MISSING\"}\n            and bool(item.get(\"dose\"))\n        )\n        if conditional:\n            item.update(\n                decision_state=\"CONDITIONALLY_DUE\", final_decision_state=\"CONDITIONALLY_DUE\",\n                final_state=STATE_LABELS[\"CONDITIONALLY_DUE\"], caregiver_state=STATE_LABELS[\"CONDITIONALLY_DUE\"],\n                parent_reason_label=\"已到年龄，接种间隔待核实\",\n                conditions=[\"核对上一剂接种日期，并满足相应最小间隔\"],\n            )\n        state = item[\"decision_state\"]\n        item[\"readiness\"] = {\n            \"eligible_now\": state in ACTION_STATES,\n            \"age_due\": True if state in ACTION_STATES or conditional else False if state in {\"NOT_YET_DUE\", \"CATCHUP_WINDOW_CLOSED\", \"POPULATION_NOT_APPLICABLE\"} else None,\n            \"need_confirmed\": True if state in ACTION_STATES or conditional else False if state == \"COMPLETED\" else None,\n            \"conditions\": item.get(\"conditions\", []),\n            \"blockers\": [] if state in ACTION_STATES else [blockers.get(original, \"当前无法确定直接安排条件\")],\n            \"source_decision_state\": original,\n        }\n    return items\n\n\ndef _action_explanation(items, visible_ids, profile):\n    visible = [item for item in items if item[\"vaccine_id\"] in set(visible_ids)]\n    counts = {}\n    for item in visible:\n        key = item[\"decision_state\"]\n        counts[key] = counts.get(key, 0) + 1\n    groups = [\n        ([\"CONDITIONALLY_DUE\"], \"已到年龄，待核实接种间隔\"),\n        ([\"RECORDS_NEEDED\"], \"接种史不足或存在记录冲突\"),\n        ([\"PRODUCT_NEEDED\"], \"产品或适龄程序待核实\"),\n        ([\"HEALTH_STATUS_NEEDED\"], \"关键健康信息待核实\"),\n        ([\"MEDICAL_REVIEW\", \"TEMPORARILY_DEFERRED\"], \"需要暂缓或专业评估\"),\n        ([\"COMPLETED\", \"NOT_YET_DUE\"], \"已完成或尚未到期\"),\n    ]\n    reasons = [{\"count\": sum(counts.get(key, 0) for key in keys), \"label\": label} for keys, label in groups]\n    reasons = [reason for reason in reasons if reason[\"count\"]]\n    actions = sum(counts.get(key, 0) for key in ACTION_STATES)\n    explanation = \"\" if actions else \"当前没有可直接安排的项目。\" + (\"；\".join(str(x[\"count\"]) + \"项\" + x[\"label\"] for x in reasons) + \"。\" if reasons else \"本次未识别到已满足安排条件的适龄项目。\")\n    return {\"action_count\": actions, \"conditional_count\": counts.get(\"CONDITIONALLY_DUE\", 0), \"zero_action_explanation\": explanation, \"zero_action_reasons\": reasons}\n\n\ndef main(case_info: str, semantic_facts: str = \"\", vaccination_history_json: str = \"\", history_complete: str = \"\") -> dict:\n    reference = _field(_fields(case_info), \"评估日期\", \"评测日期\", \"参考日期\")\n    invalid_reference = False\n    try:\n        assessment_date = date.fromisoformat(reference) if reference else None\n    except ValueError:\n        assessment_date, invalid_reference = None, True\n    token = _REFERENCE_DATE.set(assessment_date)\n    try:\n        return _main(case_info, semantic_facts, vaccination_history_json, history_complete, invalid_reference)\n    finally:\n        _REFERENCE_DATE.reset(token)\n\n\ndef _main(case_info, semantic_facts, vaccination_history_json, history_complete=\"\", invalid_reference=False):\n    text = case_info or \"\"\n    fields = _fields(text)\n    age_text = _field(fields, \"年龄\", \"出生日期\")\n    sex = _field(fields, \"性别\")\n