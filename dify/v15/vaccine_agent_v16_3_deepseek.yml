") or entry.get(\"raw_text\") or \"\").strip()\n        treatment_type = str(entry.get(\"type\") or \"\").strip().upper()\n        if not source or source.lower() not in treatment_source.lower() or treatment_type not in allowed_treatments:\n            rejected.append(\"treatment_without_source_or_invalid_type\")\n            continue\n        if source.lower() not in affirmative_source.lower() or entry.get(\"subject\", \"CHILD\") != \"CHILD\":\n            rejected.append(\"negative_unknown_or_non_child_treatment\")\n            continue\n        # A semantic procedure class must agree with its source action. Excision\n        # cannot establish transplantation, even when the model supplies that enum.\n        if treatment_type in {\"HSCT\", \"SOLID_ORGAN_TRANSPLANT\"}:\n            required = r\"造血干细胞移植|骨髓移植|\\bHSCT\\b|\\bHCT\\b\" if treatment_type == \"HSCT\" else r\"实体器官移植|肝移植|肾移植|心脏移植|肺移植|器官移植\"\n            if not re.search(required, source, re.I):\n                rejected.append(\"transplant_class_without_transplant_source\")\n                continue\n        # A model-provided class must agree with the drug text before it can alter risk.\n        # Known antiepileptic medicines are retained as ordinary treatment context.\n        if re.search(r\"丙戊酸|左乙拉西坦|卡马西平|奥卡西平|拉莫三嗪|托吡酯|苯巴比妥\", source, re.I):\n            treatment_type = \"ANTIEPILEPTIC\"\n        elif re.search(r\"胰岛素(?:泵)?\", source, re.I):\n            treatment_type = \"OTHER\"\n        elif re.search(r\"促红细胞生成素|\\bEPO\\b|降压药\", source, re.I):\n            treatment_type = \"OTHER\"\n        elif treatment_type == \"BLOOD_PRODUCT\" and re.search(r\"血液透析|腹膜透析\", source, re.I):\n            treatment_type = \"OTHER\"\n        elif treatment_type == \"ANTIMICROBIAL\" and not re.search(\n            r\"阿奇霉素|头孢|阿莫西林|青霉素|抗菌药|抗生素|奥司他韦|抗病毒\", source, re.I\n        ):\n            treatment_type = \"OTHER\"\n        accepted_treatments.append({\n            \"type\": treatment_type, \"raw_text\": source,\n            \"status\": entry.get(\"status\") if entry.get(\"status\") in {\"ONGOING\", \"ENDED\", \"UNKNOWN\"} else \"UNKNOWN\",\n            \"dose\": entry.get(\"dose\"), \"date\": entry.get(\"date\"),\n            **{key: entry[key] for key in (\"route\", \"frequency\", \"start_date\", \"end_date\", \"last_date\") if isinstance(entry.get(key), str) and entry[key] in source},\n            \"hsct_type\": entry.get(\"hsct_type\") if entry.get(\"hsct_type\") in {\"ALLOGENEIC\", \"AUTOLOGOUS\", \"UNKNOWN\"} else None,\n            \"detail_state\": \"UNKNOWN_DETAIL\", \"source_span\": source, \"source\": \"SEMANTIC_EXTRACTION\",\n        })\n    product_ids = {item[\"id\"] for item in _product_definitions()}\n    for entry in value.get(\"vaccinations\", []) if isinstance(value.get(\"vaccinations\"), list) else []:\n        if not isinstance(entry, dict):\n            rejected.append(\"vaccination_not_object\")\n            continue\n        source = str(entry.get(\"source_span\") or entry.get(\"raw_text\") or \"\").strip()\n        product_id = str(entry.get(\"product_id\") or \"\").strip().lower()\n        dose_count = entry.get(\"dose_count\")\n        history_state = str(entry.get(\"history_state\") or \"ANY_DOSE\").upper()\n        if not source or source.lower() not in evidence_text.lower() or product_id not in product_ids:\n            rejected.append(\"vaccination_without_source_or_invalid_product\")\n            continue\n        if dose_count is not None and (not isinstance(dose_count, int) or not 0 <= dose_count <= 10):\n            rejected.append(\"vaccination_invalid_dose_count\")\n            continue\n        if history_state not in {\"COUNTED\", \"ANY_DOSE\", \"COMPLETE\", \"EXPLICIT_MISSING\", \"UNKNOWN\"}:\n            history_state = \"ANY_DOSE\"\n        accepted_vaccinations.append({\n            \"source_span\": source, \"product_id\": product_id, \"dose_count\": dose_count,\n            \"history_state\": history_state, \"dates\": _parse_dates(source), \"source\": \"SEMANTIC_EXTRACTION\",\n        })\n    for warning in value.get(\"field_warnings\", []) if isinstance(value.get(\"field_warnings\"), list) else []:\n        if not isinstance(warning, dict):\n            continue\n        source = str(warning.get(\"source_span\") or \"\").strip()\n        source_field = str(warning.get(\"source_field\") or \"\").upper()\n        expected_field = str(warning.get(\"expected_field\") or \"\").upper()\n        field_text = treatment_text if source_field == \"TREATMENT\" else diagnosis_text if source_field == \"DIAGNOSIS\" else record_text if source_field == \"VACCINATION_RECORD\" else \"\"\n        if source and source.lower() in (field_text or \"\").lower() and source_field in {\"DIAGNOSIS\", \"TREATMENT\", \"VACCINATION_RECORD\"} and expected_field in {\"DIAGNOSIS\", \"TREATMENT\", \"VACCINATION_RECORD\"}:\n            field_warnings.append({\"source_span\": source, \"source_field\": source_field, \"expected_field\": expected_field})\n    return {\n        \"status\": \"VALIDATED\", \"demographics\": demographics, \"case_interpretation\": case_interpretation,\n        \"clinical_assertions\": accepted_assertions, \"diagnoses\": accepted_diagnoses,\n        \"treatments\": accepted_treatments, \"vaccinations\": accepted_vaccinations,\n        \"field_warnings\": field_warnings, \"rejected\": rejected,\n    }\n\n\ndef _health_profile(text, fields, semantic_facts=None, age_months=None):\n    diagnosis_text = _field(fields, \"诊断\", \"疾病\", \"病情\")\n    # Vaccine free text cannot establish a disease, treatment or stable state.\n    text = \"\\n\".join(filter(None, [diagnosis_text, _field(fields, \"用药\", \"治疗\")]))\n    immune_results = _immune_results(fields)\n    allergy_facts = _allergy_facts(fields)\n    diagnoses, categories, diagnosis_meta = _diagnosis_model(diagnosis_text)\n    treatment_model = _treatment_model(text, fields)\n    semantic = semantic_facts if isinstance(semantic_facts, dict) and semantic_facts.get(\"status\") else _validated_semantic_facts(semantic_facts, diagnosis_text, treatment_model[\"raw_text\"], full_text=text)\n    # Reconcile subject/type on the deterministic facts as well as LLM facts.\n    # This also covers a mother's second comma-separated diagnosis.\n    non_child = [item for item in semantic.get(\"clinical_assertions\", []) if item.get(\"subject\") in {\"MOTHER\", \"FATHER\", \"FAMILY\"}]\n    def belongs_to_other(source):\n        return any(source in item[\"source_span\"] or item[\"source_span\"] in source for item in non_child if source)\n    diagnoses = [item for item in diagnoses if not belongs_to_other(item.get(\"source_span\", \"\"))]\n    categories = list(dict.fromkeys(item[\"category_id\"] for item in diagnoses if item.get(\"category_id\") and item[\"category_id\"] != \"UNMAPPED_DIAGNOSIS\"))\n    diagnosis_meta[\"risk_domains\"] = list(dict.fromkeys(item[\"risk_domain\"] for item in diagnoses if item.get(\"risk_domain\") != \"UNKNOWN\"))\n    diagnosis_meta[\"unmapped_diagnoses\"] = [item for item in diagnosis_meta[\"unmapped_diagnoses\"] if not belongs_to_other(item)]\n    for fact in diagnosis_meta.get(\"clinical_facts\", []):\n        if belongs_to_other(fact.get(\"source_span\", \"\")):\n            owner = next(item for item in non_child if fact[\"source_span\"] in item[\"source_span\"] or item[\"source_span\"] in fact[\"source_span\"])\n            fact.update(subject=owner[\"subject\"], fact_type=owner[\"type\"])\n    semantic_interpretation = semantic.get(\"case_interpretation\", {})\n    # DeepSeek resolves sentence-level negation and coordination. It may suppress only\n    # regex-generated UNKNOWN fragments in an explicitly healthy summary; it cannot\n    # erase a recognized disease/risk category.\n    if (\n        semantic_interpretation.get(\"diagnosis_state\") == \"EXPLICIT_HEALTHY\"\n        and not semantic.get(\"diagnoses\") and not categories and not diagnosis_meta[\"risk_domains\"]\n    ):\n        diagnoses = []\n        diagnosis_meta = {\"information_state\": \"EXPLICIT_NONE\", \"risk_domains\": [], \"unmapped_diagnoses\": []}\n    category_names = {category_id: category_name for category_id, category_name, _ in SPECIAL_HEALTH_CATEGORIES}\n    for extracted in semantic[\"diagnoses\"]:\n        existing = next((item for item in diagnoses if extracted[\"source_span\"] in item[\"source_span\"] or item[\"source_span\"] in extracted[\"source_span\"]), None)\n        if existing:\n            existing[\"normalized_name\"] = extracted[\"normalized_name\"] or existing[\"normalized_name\"]\n            if existing[\"risk_domain\"] == \"UNKNOWN\" and extracted[\"risk_domain\"] != \"UNKNOWN\":\n                existing[\"risk_domain\"] = extracted[\"risk_domain\"]\n                existing[\"knowledge_coverage\"] = \"DOMAIN_GENERIC\"\n            if extracted[\"category_id\"] and not existing.get(\"category_id\") in category_names:\n                existing[\"category_id\"] = extracted[\"category_id\"]\n                existing[\"category_name\"] = category_names[extracted[\"category_id\"]]\n                existing[\"knowledge_coverage\"] = \"EXACT_26_CATEGORY\"\n            existing[\"risk_features\"] = list(dict.fromkeys(\n                list(existing.get(\"risk_features\", [])) + list(extracted.get(\"risk_features\", []))\n            ))\n        else:\n            diagnoses.append({\n                \"raw_text\": extracted[\"source_span\"], \"normalized_name\": extracted[\"normalized_name\"],\n                \"category_id\": extracted[\"category_id\"],\n                \"category_name\": category_names.get(extracted[\"category_id\"]),\n                \"risk_domain\": extracted[\"risk_domain\"], \"certainty\": extracted[\"certainty\"],\n                \"activity\": extracted[\"activity\"],\n                \"risk_features\": extracted.get(\"risk_features\", []),\n                \"knowledge_coverage\": \"EXACT_26_CATEGORY\" if extracted[\"category_id\"] else \"DOMAIN_GENERIC\",\n                \"source_span\": extracted[\"source_span\"], \"source\": \"SEMANTIC_EXTRACTION\",\n            })\n        if extracted[\"category_id\"]:\n            categories.append(extracted[\"category_id\"])\n        if extracted[\"risk_domain\"] != \"UNKNOWN\":\n            diagnosis_meta[\"risk_domains\"].append(extracted[\"risk_domain\"])\n            diagnosis_meta[\"unmapped_diagnoses\"] = [name for name in diagnosis_meta[\"unmapped_diagnoses\"] if name not in extracted[\"source_span\"] and extracted[\"source_span\"] not in name]\n    existing_treatment_types = {item[\"type\"] for item in treatment_model[\"items\"]}\n    for extracted in semantic[\"treatments\"]:\n        existing_treatment = next((item for item in treatment_model[\"items\"] if item[\"type\"] == extracted[\"type\"]), None)\n        if existing_treatment:\n            if existing_treatment.get(\"status\") == \"UNKNOWN\" or extracted.get(\"status\") in {\"ENDED\", \"ONGOING\"}:\n                existing_treatment[\"status\"] = extracted.get(\"status\") or existing_treatment.get(\"status\")\n            for key in (\"dose\", \"date\", \"route\", \"frequency\", \"start_date\", \"end_date\", \"last_date\"):\n                if extracted.get(key):\n                    existing_treatment[key] = extracted[key]\n            if extracted.get(\"detail_state\") == \"COMPLETE\":\n                existing_treatment[\"detail_state\"] = \"COMPLETE\"\n        else:\n            treatment_model[\"items\"].append(extracted)\n            existing_treatment_types.add(extracted[\"type\"])\n    # Semantic extraction may identify a treatment mentioned in free text, but it cannot turn BLANK into EXPLICIT_NONE.\n    if semantic[\"treatments\"] and treatment_model[\"information_state\"] == \"BLANK\":\n        treatment_model[\"information_state\"] = \"PRESENT\"\n    categories = list(dict.fromkeys(categories))\n    diagnosis_meta[\"risk_domains\"] = list(dict.fromkeys(diagnosis_meta[\"risk_domains\"]))\n    treatment_types = {item[\"type\"] for item in treatment_model[\"items\"]}\n    for treatment_type, category_id in {\n        \"IMMUNOSUPPRESSANT\": \"IMMUNOSUPPRESSANT_USE\", \"CORTICOSTEROID\": \"IMMUNOSUPPRESSANT_USE\",\n        \"BIOLOGIC\": \"IMMUNOSUPPRESSANT_USE\", \"IVIG\": \"IVIG_USE\",\n        \"SOLID_ORGAN_TRANSPLANT\": \"SOLID_ORGAN_TRANSPLANT\",\n    }.items():\n        applicable = any(item[\"type\"] == treatment_type and _is_immunosuppressive_treatment(item) for item in treatment_model[\"items\"]) if treatment_type in {\"CORTICOSTEROID\", \"BIOLOGIC\", \"IMMUNOSUPPRESSANT\"} else treatment_type in treatment_types\n        if applicable and category_id not in categories:\n            categories.append(category_id)\n\n    risk_domains = list(diagnosis_meta[\"risk_domains\"])\n    stable = bool(re.search(r\"病情稳定|情况稳定|控制稳定|临床稳定|生长发育稳定|稳定期|(?:目前|当前).{0,12}稳定|无.{0,8}急性加重|已恢复|已经恢复|症状已消失|痊愈|健康|精神正常|精神状态正常|精神食欲正常|无发作|肝功能.{0,4}稳定\", text))\n    explicit_no_acute = bool(re.search(r\"无发热|体温正常|无急性发作|已退热|急性症状.{0,5}(?:已恢复|无)|病情稳定\", text))\n    acute_unwell = bool(re.search(r\"(?:体温|(?<!无)(?<!未)发热).{0,8}(?:38(?:\\.\\d)?|39(?:\\.\\d)?|40(?:\\.\\d)?)|仍在发热|持续发热|精神状态欠佳|精神较差|病情尚未恢复|急性感染期|急性发作期|急性重症|症状明显|腹泻\\s*[5-9]\\s*次|腹泻\\s*\\d{2,}\\s*次|反复呕吐\", text))\n    if semantic_interpretation.get(\"diagnosis_state\") == \"EXPLICIT_HEALTHY\":\n        stable = True\n    if semantic_interpretation.get(\"acute_status\") in {\"ABSENT\", \"RECOVERED\"}:\n        explicit_no_acute = True\n    # Semantic ACTIVE establishes current symptoms, not their severity. Mild\n    # rhinorrhea/cough must not turn into a global acute-defer decision.\n\n    hsct_item = next((item for item in treatment_model[\"items\"] if item[\"type\"] == \"HSCT\"), None)\n    hsct = bool(hsct_item)\n    hsct_type = hsct_item[\"hsct_type\"] if hsct_item else None\n    if hsct_type == \"ALLOGENEIC\" and \"ALLOGENEIC_HSCT\" not in categories:\n        categories.append(\"ALLOGENEIC_HSCT\")\n    if hsct and \"TRANSP