            "code": "import json\nimport re\n\n\nREQUIRED_SECTIONS = (\"孩子目前情况\", \"本次最需要关注\", \"疫苗安排\", \"下一步\", \"提示\")\nFORBIDDEN_INTERNAL = (\n    \"UNMAPPED_DIAGNOSIS\", \"RISK_INFORMATION_PENDING\", \"HIGH_RISK_ACTIVE\",\n    \"HARD_CONFLICT\", \"SOFT_CONFLICT\", \"RULE_KEPT\", \"decision_state\",\n)\nACTION_WORDS = (\"现在可以安排\", \"可以立即接种\", \"可立即接种\", \"今天可以接种\", \"无需等待\")\nNON_ACTION_STATES = {\n    \"CONDITIONALLY_DUE\", \"RECORDS_NEEDED\", \"PRODUCT_NEEDED\", \"HEALTH_STATUS_NEEDED\",\n    \"MEDICAL_REVIEW\", \"TEMPORARILY_DEFERRED\", \"COMPLETED\", \"NOT_YET_DUE\",\n    \"CATCHUP_WINDOW_CLOSED\", \"POPULATION_NOT_APPLICABLE\", \"NO_INDICATION\",\n}\n\n\ndef _loads(value):\n    try:\n        return json.loads(value) if isinstance(value, str) else value or {}\n    except (TypeError, ValueError):\n        return {}\n\n\ndef main(deepseek_text: str = \"\", deterministic_text: str = \"\", result_json: str = \"\") -> dict:\n    text = str(deepseek_text or \"\").strip()\n    issues = []\n    if not text:\n        issues.append(\"EMPTY_DEEPSEEK_OUTPUT\")\n    for section in REQUIRED_SECTIONS:\n        if section not in text:\n            issues.append(\"MISSING_SECTION_\" + section)\n    if any(token in text for token in FORBIDDEN_INTERNAL):\n        issues.append(\"INTERNAL_ENUM_LEAK\")\n    if len(text) < 120:\n        issues.append(\"OUTPUT_TOO_SHORT\")\n    if len(text) > 12000:\n        issues.append(\"OUTPUT_TOO_LONG\")\n\n    decision = _loads(result_json)\n    if decision.get(\"processing_status\") != \"READY\":\n        issues.append(\"DECISION_NOT_READY\")\n    overall_state = decision.get(\"overall_recommendation_state\")\n    if overall_state in {\"DEFER\", \"FURTHER_EVALUATION\"} and \"| 疫苗名称 |\" in text:\n        issues.append(\"VACCINE_TABLE_FORBIDDEN_FOR_CASE_STATE\")\n    if overall_state == \"INACTIVATED_ONLY\" and \"总体建议：建议接种灭活疫苗\" not in str(deterministic_text or \"\"):\n        issues.append(\"MISSING_INACTIVATED_ONLY_HEADLINE\")\n\n    # The prose is an explanation channel. It must never promote a structured\n    # non-action state to an executable recommendation.\n    for item in decision.get(\"vaccines\", []):\n        if item.get(\"decision_state\") not in NON_ACTION_STATES:\n            continue\n        names = [str(item.get(\"display_name\") or \"\"), str(item.get(\"vaccine\") or \"\")]\n        names = [name for name in names if name]\n        for name in names:\n            start = text.find(name)\n            if start < 0:\n                continue\n            window = text[start:start + 260]\n            if any(word in window for word in ACTION_WORDS):\n                issues.append(\"PROSE_CONTRADICTS_STRUCTURED_STATE_\" + str(item.get(\"vaccine_id\") or \"UNKNOWN\"))\n                break\n\n    # User-visible names, states, doses and dates always come from the\n    # deterministic renderer. DeepSeek prose is validated and retained only as\n    # an audit signal, so a fluent sentence cannot rewrite a clinical result.\n    final_text = str(deterministic_text or \"\")\n    report = {\n        \"passed\": not issues,\n        \"issues\": issues,\n        \"render_mode\": \"STRUCTURED_DETERMINISTIC_RENDER\",\n        \"prose_validation\": \"PASSED\" if not issues else \"REJECTED\",\n    }\n    return {\n        \"result\": final_text,\n        \"result_json\": result_json,\n        \"validation_report\": json.dumps(report, ensure_ascii=False, separators=(\",\", \":\")),\n    }\n",
