MPORARILY_DEFERRED\", \"HIGH_RISK_LIVE_VACCINE_DEFER\", \"暂缓接种\"\n            else:\n                reason = \"当前处于显著免疫抑制、移植或高风险治疗阶段；保留该疫苗方向，由对应专科结合治疗阶段确定时间和剂次。\"\n                state, code, standard = \"MEDICAL_REVIEW\", \"HIGH_RISK_ACTIVE_PATH\", \"需进一步评估\"\n            item.update(decision_state=state, final_state=STATE_LABELS[state], reason_code=code, reason=reason, caregiver_advice=reason, standard_recommendation_status=standard, priority=3)\n            item[\"medical_rule_ids\"] = [\"PATIENT_PATH_HIGH_RISK_ACTIVE\"]\n        elif path == \"HIGH_RISK_INFORMATION_PENDING\":\n            reason = \"关键治疗或疾病活动信息尚未填写；补齐这些信息后再确定该疫苗的接种时间和剂次。\"\n            item.update(decision_state=\"HEALTH_STATUS_NEEDED\", final_state=STATE_LABELS[\"HEALTH_STATUS_NEEDED\"], reason_code=\"HIGH_RISK_TREATMENT_INFORMATION_REQUIRED\", reason=reason, caregiver_advice=reason, standard_recommendation_status=\"需进一步评估\", priority=3)\n            item[\"medical_rule_ids\"] = [\"PATIENT_PATH_HIGH_RISK_INFORMATION_PENDING\"]\n        elif path == \"RISK_INFORMATION_PENDING\":\n            reason = \"当前诊断尚未完成风险归类；需先确认疾病性质、当前状态和治疗情况，再放行具体接种时间。\"\n            item.update(decision_state=\"HEALTH_STATUS_NEEDED\", final_state=STATE_LABELS[\"HEALTH_STATUS_NEEDED\"], reason_code=\"UNMAPPED_DIAGNOSIS_RISK_REVIEW\", reason=reason, caregiver_advice=reason, standard_recommendation_status=\"需进一步评估\", priority=3)\n            item[\"medical_rule_ids\"] = [\"PATIENT_PATH_RISK_INFORMATION_PENDING\"]\n        elif profile.get(\"kawasaki_ivig_pending\") and item[\"vaccine_id\"] in {\"mmr\", \"varicella\"} and item[\"decision_state\"] in ACTION_STATES:\n            reason = \"川崎病治疗中是否使用过IVIG尚未明确；请补充IVIG剂量和末次使用日期，再按相应间隔确定本项接种时间。\"\n            item.update(decision_state=\"CONDITIONALLY_DUE\", final_state=STATE_LABELS[\"CONDITIONALLY_DUE\"], reason_code=\"KAWASAKI_IVIG_INFORMATION_REQUIRED\", reason=reason, caregiver_advice=reason, standard_recommendation_status=\"需进一步评估\", priority=4)\n            item[\"medical_rule_ids\"] = [\"KAWASAKI_IVIG_LIVE_VACCINE_INTERVAL\"]\n        elif profile[\"infectious\"] and profile[\"acute_episode\"] in {\"POSSIBLE_ACTIVE\", \"UNKNOWN\"}:\n            reason = \"已记录感染性疾病或当前治疗线索；先确认是否仍发热、急性症状是否明显以及病情是否已经稳定。\"\n            item.update(decision_state=\"HEALTH_STATUS_NEEDED\", final_state=STATE_LABELS[\"HEALTH_STATUS_NEEDED\"], reason_code=\"INFECTIOUS_CURRENT_STATUS_REQUIRED\", reason=reason, caregiver_advice=reason, standard_recommendation_status=\"需进一步评估\", priority=4)\n            item[\"medical_rule_ids\"] = [\"INFECTIOUS_DISEASE_CURRENT_STATUS\"]\n        elif profile[\"epilepsy\"] and item[\"vaccine_id\"] == \"dtap\" and profile[\"seizure_status\"] != \"CONTROLLED\":\n            state = \"TEMPORARILY_DEFERRED\" if profile[\"seizure_status\"] == \"RECENT_OR_UNCONTROLLED\" else \"HEALTH_STATUS_NEEDED\"\n            reason = \"近6个月仍有癫痫发作，含百日咳成分疫苗暂缓，待癫痫控制稳定后再安排。\" if state == \"TEMPORARILY_DEFERRED\" else \"需要先确认癫痫近6个月是否发作及目前是否控制稳定，再决定含百日咳成分疫苗。\"\n            item.update(decision_state=state, final_state=STATE_LABELS[state], reason_code=\"EPILEPSY_CONTROL_REQUIRED\", reason=reason, caregiver_advice=reason, standard_recommendation_status=\"暂缓接种\" if state == \"TEMPORARILY_DEFERRED\" else \"需进一步评估\", priority=4)\n            item[\"medical_rule_ids\"] = [\"CN_EPILEPSY_CONSENSUS_3\"]\n            item[\"evidence_trace\"].append({\"evidence_id\": \"CN_EPILEPSY_CONSENSUS_2019\", \"section\": \"3 接种建议\", \"location\": \"PDF第2页\", \"rule\": \"近6个月发作暂缓；控制6个月及以上可以接种\"})\n        elif profile[\"chd_high_risk\"] and item[\"decision_state\"] in ACTION_STATES:\n            reason = \"当前存在心功能不全、严重肺动脉高压或近期手术等信息，先暂缓本次接种并完成心脏专科评估。\"\n            item.update(decision_state=\"TEMPORARILY_DEFERRED\", final_state=STATE_LABELS[\"TEMPORARILY_DEFERRED\"], reason_code=\"CHD_UNSTABLE\", reason=reason, caregiver_advice=reason, standard_recommendation_status=\"暂缓接种\", priority=4)\n            item[\"evidence_trace\"].append({\"evidence_id\": \"CN_CHD_CONSENSUS_2019\", \"section\": \"3.2 暂缓接种\", \"location\": \"PDF第3页\", \"rule\": \"心功能不全或严重肺动脉高压暂缓\"})\n        elif profile[\"chd\"] and not profile[\"chd_stable\"] and item[\"decision_state\"] in ACTION_STATES:\n            reason = \"先确认心功能、是否有严重肺动脉高压及近期手术情况；状态稳定后可按程序安排。\"\n            item.update(decision_state=\"HEALTH_STATUS_NEEDED\", final_state=STATE_LABELS[\"HEALTH_STATUS_NEEDED\"], reason_code=\"CHD_STABILITY_REQUIRED\", reason=reason, caregiver_advice=reason, standard_recommendation_status=\"需进一步评估\", priority=5)\n            item[\"evidence_trace\"].append({\"evidence_id\": \"CN_CHD_CONSENSUS_2019\", \"section\": \"3 接种建议\", \"location\": \"PDF第3页\", \"rule\": \"稳定且心功能正常可以接种\"})\n        elif profile.get(\"preterm_temporal_status\") in {\"CURRENT\", \"UNKNOWN\"} and profile[\"acute_status\"] == \"UNKNOWN\" and item[\"decision_state\"] in ACTION_STATES:\n            reason = \"需确认目前生长、呼吸和循环状态稳定；稳定后通常按实际年龄继续接种。\"\n            item.update(decision_state=\"HEALTH_STATUS_NEEDED\", final_state=STATE_LABELS[\"HEALTH_STATUS_NEEDED\"], reason_code=\"PRETERM_CURRENT_STABILITY_REQUIRED\", reason=reason, caregiver_advice=reason, standard_recommendation_status=\"需进一步评估\", priority=6)\n            item[\"evidence_trace\"].append({\"evidence_id\": \"CN_PRETERM_CONSENSUS_2018\", \"section\": \"3 接种建议\", \"location\": \"PDF第1-2页\", \"rule\": \"早产儿通常按实际年龄接种；危重者生命体征稳定后接种\"})\n        elif (profile[\"ivig\"] or profile.get(\"blood_product\")) and item[\"vaccine_id\"] in {\"mmr\", \"varicella\"}:\n            reason = \"已记录IVIG或血液制品使用；请核对具体制品、剂量和末次使用日期，以判断本项接种所需间隔。其他疫苗不因此整体暂停。\"\n            item.update(decision_state=\"MEDICAL_REVIEW\", final_state=STATE_LABELS[\"MEDICAL_REVIEW\"], reason_code=\"ANTIBODY_PRODUCT_INTERVAL\", reason=reason, caregiver_advice=reason, standard_recommendation_status=\"需进一步评估\", priority=8)\n            item[\"medical_rule_ids\"] = [\"ANTIBODY_PRODUCT_LIVE_INTERVAL\"]\n            item[\"evidence_ids\"].append(\"CDC_ANTIBODY_PRODUCTS\")\n            item[\"evidence_trace\"].append({\"evidence_id\": \"CDC_ANTIBODY_PRODUCTS\", \"section\": \"Spacing of vaccines and antibody-containing products\", \"rule\": \"需要产品、剂量及日期判断含麻疹或水痘疫苗的间隔；不直接套用美国程序\"})\n    return items\n\n\ndef _patient_level_decision(profile, text):\n    gate = profile[\"patient_path\"]\n    missing = []\n    if gate == \"ACUTE_DEFER\":\n        headline = \"当前急性病情未恢复，今天到期疫苗先暂缓\"\n        alert = \"先处理急性问题；恢复后继续按基础疾病、治疗状态和接种记录计算。\"\n    elif profile[\"hsct\"]:\n        if profile[\"hsct_type\"] == \"UNKNOWN\":\n            missing.append(\"移植类型（自体或异体）\")\n        if not re.search(r\"移植(?:日期|时间)|移植后\\s*\\d+|20\\d{2}[年\\-/.]\\d{1,2}\", text):\n            missing.append(\"移植日期\")\n        if not re.search(r\"免疫重建|免疫恢复|免疫功能\", text):\n            missing.append(\"医生是否已评估免疫功能恢复\")\n        if not re.search(r\"免疫抑制.{0,8}(?:无|停用|正在|药|治疗)\", text) or re.search(r\"免疫抑制.{0,12}(?:未提供|未知|不清)\", text):\n            missing.append(\"目前是否仍使用免疫抑制药物\")\n        headline = \"已进入造血干细胞移植相关接种路径\"\n        alert = \"适龄疫苗继续逐项显示；具体时间和剂次由移植类型、移植日期、免疫抑制和免疫恢复状态修正。\"\n    elif profile[\"solid_organ_transplant\"]:\n        if not re.search(r\"移植(?:日期|时间)|移植后\\s*\\d+|20\\d{2}[年\\-/.]\\d{1,2}\", text):\n            missing.append(\"移植日期\")\n        if not re.search(r\"免疫抑制.{0,8}(?:无|停用|正在|药|治疗)\", text) or re.search(r\"免疫抑制.{0,12}(?:未提供|未知|不清)\", text):\n            missing.append(\"目前是否仍使用免疫抑制药物\")\n        headline = \"已进入器官移植后特殊接种路径\"\n        alert = \"暂不按普通儿童免疫程序直接生成具体接种时间和剂次；后续计划需结合移植时间和当前治疗制定。\"\n    elif profile[\"leukemia\"]:\n        if profile[\"treatment_information_state\"] in {\"BLANK\", \"UNKNOWN_DETAIL\"}:\n            missing.append(\"目前处于化疗哪个阶段，或化疗是否已经结束及结束日期\")\n        if not re.search(r\"缓解|复发|免疫恢复|免疫功能\", text):\n            missing.append(\"白血病缓解状态和免疫功能恢复情况\")\n        headline = \"白血病接种路径已启动\"\n        alert = \"先按化疗阶段、缓解状态和免疫恢复情况修正适龄疫苗；未填写治疗信息时不生成精确时间和剂次。\"\n    elif profile[\"solid_malignancy\"]:\n        if profile[\"treatment_information_state\"] in {\"BLANK\", \"UNKNOWN_DETAIL\"}:\n            missing.extend(TREATMENT_DEPENDENCIES[\"SOLID_MALIGNANCY\"])\n        elif profile[\"disease_activity\"] == \"UNKNOWN\":\n            missing.append(\"当前肿瘤控制情况\")\n        headline = \"已识别恶性肿瘤相关接种风险\"\n        alert = \"化疗、放疗、免疫治疗和疾病控制情况会改变疫苗种类与接种时间；关键信息不全时暂不生成精确补种方案。\"\n    elif profile[\"autoimmune\"]:\n        if profile[\"disease_activity\"] == \"UNKNOWN\":\n            missing.append(\"自身免疫性疾病目前处于活动期还是稳定缓解期\")\n        if profile[\"treatment_information_state\"] in {\"BLANK\", \"UNKNOWN_DETAIL\"}:\n            missing.append(\"当前及近期激素名称和剂量、免疫抑制剂及生物制剂\")\n        headline = \"自身免疫性疾病接种路径已启动\"\n        alert = \"疾病活动度和免疫抑制治疗会改变部分疫苗结论；适龄疫苗继续逐项计算。\"\n    elif gate in {\"HIGH_RISK_ACTIVE\", \"HIGH_RISK_INFORMATION_PENDING\"}:\n        if profile[\"treatment_information_state\"] in {\"BLANK\", \"UNKNOWN_DETAIL\"}:\n            missing.append(\"当前及近期可能影响免疫功能的治疗名称、剂量和日期\")\n        headline = \"已进入免疫功能相关接种路径\"\n        alert = \"适龄疫苗继续逐项显示；高风险治疗期间明确拦截受影响项目。\"\n    elif gate == \"RISK_INFORMATION_PENDING\":\n        missing.extend([\n            \"这个疾病的完整诊断名称是什么，是否可能影响免疫功能？\",\n            \"目前是否正在化疗或使用激素、免疫抑制剂、生物制剂？\",\n            \"最后一次相关治疗是什么时间？\",\n            \"目前疾病是否稳定，近期是否发热或处于感染急性期？\",\n            \"近期是否使用过IVIG或其他血液制品？\",\n        ])\n        headline = \"当前诊断的接种风险尚待判定\"\n        alert = \"诊断未命中现有专项分类时保留风险状态；完成疾病性质和治疗信息核实前，不直接生成精确接种时间。\"\n    elif profile.get(\"kawasaki_ivig_pending\"):\n        missing.append(\"川崎病治疗期间是否使用IVIG，以及剂量和末次使用日期\")\n        headline = \"先核实川崎病IVIG治疗信息\"\n        alert = \"IVIG可能改变麻腮风、水痘等疫苗的接种时间；其他疫苗继续按年龄和记录计算。\"\n    elif profile[\"ivig\"] or profile.get(\"blood_product\"):\n        missing.append(\"IVIG或血液制品的具体名称、剂量和末次使用日期\")\n        headline = \"按IVIG或血液制品使用情况核对相关疫苗间隔\"\n        alert = \"麻腮风、水痘等受影响项目单独评估；其他疫苗继续按年龄和记录计算。\"\n    elif profile[\"epilepsy\"]:\n        if profile[\"seizure_status\"] == \"UNKNOWN\":\n            missing.append(\"近6个月是否有癫痫发作、目前是否控制稳定\")\n            headline = \"先确认癫痫控制情