.get(\"source_span\", \"\") for item in diagnosis_meta.get(\"clinical_facts\", [])\n        if item.get(\"subject\", \"CHILD\") == \"CHILD\"\n    ]\n    child_risk_source = \"\\n\".join(filter(None, [\n        *(item.get(\"source_span\") or item.get(\"raw_text\") or \"\" for item in diagnoses),\n        *child_fact_spans,\n        *(item.get(\"source_span\") or item.get(\"raw_text\") or \"\" for item in treatment_model[\"items\"]),\n    ]))\n    clinical_flags = _clinical_risk_flags(child_risk_source, diagnoses, treatment_model[\"items\"])\n    if immune_results[\"immune_concern_reported\"]:\n        clinical_flags[\"immune_deficiency_possible\"] = True\n    malignancy = malignancy or clinical_flags[\"malignancy\"]\n    immune_diagnoses = [\n        item for item in diagnoses\n        if item.get(\"risk_domain\") == \"PRIMARY_OR_SECONDARY_IMMUNODEFICIENCY\"\n        or item.get(\"category_id\") == \"PRIMARY_IMMUNODEFICIENCY\"\n    ]\n    confirmed_immune_deficiency = any(\n        item.get(\"certainty\") == \"CONFIRMED\"\n        and not re.search(r\"反复感染|疑似|可能|待排|\\?|？\", item.get(\"source_span\", \"\"))\n        for item in immune_diagnoses\n    )\n    immune_risk_level = (\n        \"CONFIRMED\" if confirmed_immune_deficiency\n        else \"POSSIBLE\" if clinical_flags[\"immune_deficiency_possible\"]\n        else \"NONE\"\n    )\n    immune_condition = immune_risk_level != \"NONE\"\n    # ACTIVE requires an explicit current high-risk fact. A possible immune\n    # deficiency (for example recurrent infection) stays pending.\n    active_immune_risk = confirmed_immune_deficiency and _has_explicit_current_activity(child_risk_source)\n    treatment_sensitive_condition = clinical_flags[\"treatment_sensitive_condition\"]\n    high_risk_diagnosis = malignancy or autoimmune or immune_condition or clinical_flags[\"hematologic_or_immune_review\"]\n    uncovered = bool(diagnosis_meta[\"unmapped_diagnoses\"])\n    # 已明确恢复或稳定、且未出现开放风险特征的未映射名称不再全局阻断；\n    # DeepSeek+RAG继续复核其疾