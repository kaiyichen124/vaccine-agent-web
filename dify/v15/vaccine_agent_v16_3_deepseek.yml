l_errors = [\"INVALID_REFERENCE_DATE\"] if invalid_reference else []\n    if structured_raw and structured_history.get(\"status\") in {\"INVALID_JSON\", \"INVALID_SCHEMA\"}:\n        critical_errors.append(\"HISTORY_PARSE_ERROR\")\n    if structured_raw:\n        try:\n            supplied_history = json.loads(structured_raw)\n            supplied_count = len(supplied_history.get(\"events\", [])) if isinstance(supplied_history, dict) and isinstance(supplied_history.get(\"events\"), list) else 0\n        except (TypeError, ValueError):\n            supplied_count = 0\n        if supplied_count > 0 and not administration_records:\n            critical_errors.append(\"HISTORY_PARSE_ERROR\")\n    if semantic.get(\"status\") in {\"INVALID_JSON\", \"INVALID_SCHEMA\"}:\n        critical_errors.append(\"SEMANTIC_PARSE_ERROR\")\n    recognized_history = _recognized_history(administration_records)\n    completion_cutoff = _nip_completion_cutoff(record)\n    if completion_cutoff is not None:\n        for series in SERIES:\n            if normalized[series[\"id\"]][\"kind\"] != \"UNMENTIONED\" or not series.get(\"schedule\"):\n                continue\n            completed = sum(due_month <= completion_cutoff for due_month in series[\"schedule\"])\n            normalized[series[\"id\"]] = {\"kind\": \"COUNTED\", \"doses\": completed, \"missing\": None, \"dates\": [], \"date_status\": \"ASSUMED_VALID_PROGRAM\", \"contributors\": [], \"products\": []}\n    profile = _health_profile(text, fields, semantic, months)\n    profile[\"overall_recommendation_state\"] = _overall_recommendation_state(profile, text)\n    invariant_audit = _enforce_profile_invariants(profile)\n    patient_context = \"\\n\".join(filter(None, [profile[\"diagnosis\"], profile[\"treatment\"], profile[\"immune_results\"][\"raw_text\"] if profile[\"immune_results\"][\"information_state\"] == \"REPORTED\" else \"\"]))\n    patient_decision = _patient_level_decision(profile, patient_context)\n    items = [_calculate_program(series, normalized[series[\"id\"]], mode, months, sex) for series in SERIES]\n    items.extend(_optional_candidates(text, months, profile, normalized))\n    items = _attach_implementation_options(items, combo_evidence, months)\n    items = _apply_health_rules(items, profile)\n    invariant_audit.extend(_enforce_vaccine_invariants(items, normalized, structured_history))\n    if any(entry.get(\"action\") == \"BLOCKED\" for entry in invariant_audit):\n        critical_errors.append(\"INVARIANT_VIOLATION\")\n    evidence_routing = _evidence_routing(profile)\n    items = _attach_routed_evidence(items, evidence_routing)\n    items = _annotate_decision_stages(items, normalized, months, sex, profile)\n    items = _attach_parent_labels(items)\n    items = _attach_readiness(items, profile, normalized)\n    summary = _priority_summary(items, profile, patient_decision)\n    steps = _next_steps(items, mode, profile, patient_decision)\n    visible_vaccine_ids = _parent_visible_ids(items, normalized, months, sex, mode)\n    if profile[\"overall_recommendation_state\"] in {\"DEFER\", \"FURTHER_EVALUATION\"}:\n        visible_vaccine_ids = []\n    parent_view = {\n        \"visible_vaccine_ids\": visible_vaccine_ids,\n        \"recognized_history\": recognized_history,\n        \"health_summary\": _caregiver_health_summary(profile),\n        \"summary\": _parent_summary(items, visible_vaccine_ids, normalized, patient_decision),\n    }\n    parent_view[\"summary\"].update(_action_explanation(items, visible_vaccine_ids, profile))\n\n    sources = []\n    for evidence_id in evidence_routing[\"allowed_evidence_ids\"]:\n        source = EVIDENCE_REGISTRY.get(evidence_id, {\"title\": evidence_id})\n        sources.append({\n            \"evidence_id\": evidence_id, \"title\": source[\"title\"], \"url\": source.get(\"url\", \"\"),\n            \"local_path\": source.get(\"local_path\", \"\"), \"section\": source.get(\"section\", \"\"),\n            \"location\": source.get(\"loca